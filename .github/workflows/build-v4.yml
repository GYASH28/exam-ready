name: Build ExamVerse v4 APK

on:
  push:
    branches:
      - upgrade/max-ui-v4
    paths:
      - 'android/**'
      - '.github/workflows/build-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/max-ui-v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile and verify
        working-directory: android
        run: |
          gradle :app:assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Package APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ExamVerse-v4.0.0.apk
          sha256sum dist/ExamVerse-v4.0.0.apk > dist/ExamVerse-v4.0.0.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ExamVerse-v4-installable-apk
          path: dist/*
          if-no-files-found: error
