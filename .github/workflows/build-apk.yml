name: Build ExamVerse v2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.examverse/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        run: |
          cat .examverse/source.b64.part* | base64 --decode > ExamVerse-v2-source.zip
          unzip -q ExamVerse-v2-source.zip
          test -f ExamVerse-v2/settings.gradle
          test -f ExamVerse-v2/app/build.gradle

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.1"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile installable debug APK
        working-directory: ExamVerse-v2
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp ExamVerse-v2/app/build/outputs/apk/debug/app-debug.apk dist/ExamVerse-v2.0.0.apk
          sha256sum dist/ExamVerse-v2.0.0.apk > dist/ExamVerse-v2.0.0.apk.sha256
          unzip -l dist/ExamVerse-v2.0.0.apk | grep -E "AndroidManifest.xml|classes.dex|resources.arsc"

      - uses: actions/upload-artifact@v4
        with:
          name: ExamVerse-v2-installable-apk
          path: dist/*
          if-no-files-found: error
