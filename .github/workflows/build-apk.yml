name: Build ExamVerse v2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.examverse/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        run: |
          cat .examverse/source.b64.part* | base64 --decode > ExamVerse-v2-source.zip
          unzip -q ExamVerse-v2-source.zip
          test -f ExamVerse-v2/settings.gradle
          test -f ExamVerse-v2/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile installable debug APK
        working-directory: ExamVerse-v2
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp ExamVerse-v2/app/build/outputs/apk/debug/app-debug.apk dist/ExamVerse-v2.0.0.apk
          sha256sum dist/ExamVerse-v2.0.0.apk > dist/ExamVerse-v2.0.0.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ExamVerse-v2-installable-apk
          path: dist/*
          if-no-files-found: error
