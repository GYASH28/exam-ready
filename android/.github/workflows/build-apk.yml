name: Build ExamVerse v3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile installable debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare friendly APK name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ExamVerse-v3.0.0.apk
          sha256sum dist/ExamVerse-v3.0.0.apk > dist/ExamVerse-v3.0.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ExamVerse-v3-installable-apk
          path: dist/*
          if-no-files-found: error
