.unit-grid{gap:17px}

.quest-card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px var(--comic-stroke)}

.quest-content .unit-actions{margin-top:13px}

.exam-card{border-top:5px solid #ff987c}.streak-card{border-top:5px solid #bca3f6}

</style></head><body><div class="shell"><aside id="side" class="side"><div class="brand">BIT<span>QUEST!</span></div><div class="eyebrow">CWIT / DTM / SEM 03</div><div id="nav" class="nav"></div><div style="margin-top:auto"><div class="row spread"><span class="eyebrow">MISSION PROGRESS</span><b id="pct">0%</b></div><div class="progress"><i id="bar" style="width:0%"></i></div><p class="small" id="progressText">0 lessons cleared</p><div class="small">Offline • saves on this device</div></div></aside><main class="main"><header class="top"><button class="mobile" id="menu" aria-label="Open navigation">☰</button><b id="crumb">Mission control</b><div class="sp"></div><input id="search" placeholder="Search lessons, questions, code…" aria-label="Search all material"><button id="timerBtn" class="timer" title="Start or pause study timer">25:00 ▶</button><button id="focus" title="Focus mode">◎</button><button id="theme" title="Toggle theme">☾</button></header><div class="content" id="app"></div></main></div><div id="toast" class="toast hidden" role="status"></div><script id="data" type="application/json">{"units":[["Logic gates & logic families","Number systems, codes and the seven logic gates.",10,"#ffd36b","01","The binary origin story"],["Minimization techniques","Boolean algebra, SOP/POS and Karnaugh maps.",10,"#d5c3ff","02","Make gates do less work"],["Combinational & sequential design","Adders, MUX, decoders, flip-flops, counters and registers.",15,"#ffc1d8","03","The circuit boss battle"],["The 8051 microcontroller","Architecture, pinout, registers and memory.",10,"#bde5ff","04","Meet the tiny computer"],["8051 assembly programming","Tools, jumps, stacks, calls and delays.",15,"#ffb88d","05","Speak fluent robot"],["Addressing modes & I/O","Instructions, data transfer, arithmetic, codes and ports.",10,"#cce9ac","06","Make the chip obey"]],"lessons":[{"id":"L1-1","unit":1,"title":"Number systems and place value","analogy":"A number system is just a way to write a value. Binary is base 2, octal base 8, decimal base 10 and hexadecimal base 16.","hook":"101101₂ = 32+8+4+1 = 45₁₀. 3A₁₆ = 3×16+10 = 58₁₀.","bullets":["Binary digits 0–1; octal 0–7; decimal 0–9; hex 0–9 and A–F."],"diagram":"convert","qs":[],"deep":["Every digit has a place value. Multiply by base raised to its position, beginning with position zero on the right. A larger base can write the same value using fewer digits.","2F₁₆ = 2×16+15=47. Reverse: 47÷16=2 remainder F.","Do not read binary as a decimal numeral."]},{"id":"L1-2","unit":1,"title":"Conversions between bases","analogy":"To convert to decimal, multiply each digit by its positional weight. To convert from decimal, divide repeatedly by the target base and read remainders upward.","hook":"25 ÷ 2 = 12 r1; 12 ÷ 2 = 6 r0; 6 ÷ 2 = 3 r0; 3 ÷ 2 = 1 r1; 1 ÷ 2 = 0 r1. Answer 11001₂.","bullets":["Binary to octal: group 3 bits from right; binary to hex: group 4. Add leading zeros if needed."],"diagram":"convert","qs":[],"deep":["Convert any base to decimal by positional expansion; convert decimal to any base by repeated division. Read remainders bottom to top. Binary grouping uses 3 bits per octal digit and 4 per hex digit.","10101101₂ → 010 101 101 → 255₈; → 1010 1101 → AD₁₆.","Group from the right for integers."]},{"id":"L1-3","unit":1,"title":"Signed binary and complements","analogy":"A fixed-width signed number has a sign bit. One’s complement flips bits; two’s complement flips bits then adds one.","hook":"8-bit −5: 00000101 → 11111010 → 11111011. 8-bit range −128 to +127.","bullets":["For n-bit two’s complement range is −2^(n−1) to 2^(n−1)−1. Keep the same width throughout."],"diagram":"convert","qs":[],"deep":["Two's complement uses the most significant bit with negative place value. Preserve the selected bit width and discard carry beyond it.","−12 in 8 bits: 00001100 → 11110011 → 11110100. Adding 12 returns zero.","Carry out and signed overflow are not the same."]},{"id":"L1-4","unit":1,"title":"Binary addition and subtraction","analogy":"Binary addition carries when the sum reaches 2. In two’s complement subtraction add the two’s complement of the subtrahend; discard final carry.","hook":"7−3 in 4 bits: 0111 + 1101 = 1 0100 → 0100. One’s complement: 0111 + 1100 = 1 0011; add carry → 0100.","bullets":["For one’s complement subtraction add complement of B to A and add end-around carry if present. With no carry, complement result to get negative magnitude."],"diagram":"convert","qs":[],"deep":["For binary addition, 1+1 yields carry 1 and sum 0; adding an incoming carry yields 11. Subtract by adding the fixed-width complement of the subtrahend.","9−5: 1001 + 1011 = 1 0100 → 0100.","Specify bit width before complementing."]},{"id":"L1-5","unit":1,"title":"BCD and Gray code","analogy":"BCD encodes every decimal digit separately using four bits; Gray code changes only one bit between consecutive values.","hook":"59 in BCD = 0101 1001, NOT ordinary binary 111011. 1011 binary → 1110 Gray → 1011 binary.","bullets":["Binary→Gray: keep MSB and XOR adjacent binary bits. Gray→binary: keep MSB and XOR previous binary bit with next Gray bit."],"diagram":"convert","qs":[],"deep":["BCD keeps individual decimal digits separate; Gray changes only one bit between adjacent code words. Convert binary to Gray by copying MSB then XORing adjacent binary bits.","87 → 1000 0111 BCD; 1101 → 1011 Gray.","BCD groups 1010–1111 are invalid."]},{"id":"L1-6","unit":1,"title":"Basic and derived logic gates","analogy":"Logic gates take binary inputs and produce a binary output. AND needs both, OR needs at least one, XOR needs different inputs.","hook":"A=1 B=0: AND 0, OR 1, XOR 1, NAND 1, NOR 0, XNOR 0.","bullets":["NOT inverts. NAND = NOT AND, NOR = NOT OR, XNOR = NOT XOR. Draw symbol, expression and truth table in an exam."],"diagram":"gates","qs":[],"deep":["AND is true when both inputs are true; OR when at least one is true; XOR when exactly one is true. Bubbles invert the gate output.","For A=B=1, OR=1 but XOR=0; NAND=0 and NOR=0.","XOR is not inclusive OR."]},{"id":"L1-7","unit":1,"title":"Universal gates: NAND and NOR","analogy":"A universal gate can implement any Boolean function using only copies of itself.","hook":"Draw AND using two NAND gates: first NAND A,B, then tie both second inputs together to invert.","bullets":["NAND NOT=A NAND A; AND=invert NAND; OR=(A NAND A) NAND (B NAND B). NOR NOT=A NOR A; OR=invert NOR; AND=(A NOR A) NOR (B NOR B)."],"diagram":"universal","qs":[],"deep":["Tie both NAND inputs to invert. NAND the resulting complemented inputs to form OR, using De Morgan's theorem.","X=NAND(A,A), Y=NAND(B,B), Z=NAND(X,Y). Z=A+B.","NAND and NOR are individually universal."]},{"id":"L1-8","unit":1,"title":"TTL, ECL and CMOS","analogy":"Logic families group ICs made using a common circuit technology. TTL uses bipolar transistors, ECL uses non-saturating bipolar current steering, CMOS uses complementary MOSFETs.","hook":"CMOS inverter: input 0 turns PMOS on and NMOS off → output 1; input 1 does the opposite.","bullets":["Traditional ECL is very fast but power-hungry; CMOS has low static power and generally good noise immunity; TTL is a classic medium-speed bipolar family. Actual values depend on series."],"diagram":"families","qs":[],"deep":["TTL uses bipolar transistors, CMOS uses complementary MOSFETs, ECL avoids transistor saturation. Choose logic families based on supply, power, noise margins and speed.","CMOS often suits battery devices; ECL is historically useful for high-speed logic.","Modern CMOS may outperform older TTL; avoid absolute speed claims."]},{"id":"L1-9","unit":1,"title":"Logic family characteristics","analogy":"Fan-in is number of inputs; fan-out is number of similar inputs an output can drive. Propagation delay is the time from input change to corresponding output change.","hook":"VOH=2.4 V, VIH=2.0 V: high noise margin 0.4 V. If delay times 8 and 12 ns, average 10 ns.","bullets":["Noise immunity resists interference. NMH=VOH(min)−VIH(min); NML=VIL(max)−VOL(max). Power P=VI; average propagation delay=(tPLH+tPHL)/2."],"diagram":"families","qs":[],"deep":["Fan-out depends on output drive and input currents. Noise margin measures resistance to voltage disturbances. Propagation delay measures response time.","If IOL=8 mA and IIL=0.4 mA, low-state fan-out is 20; check high-state too.","Fan-in counts inputs, fan-out counts driven inputs."]},{"id":"L2-1","unit":2,"title":"Boolean algebra fundamentals","analogy":"Boolean variables are 0 or 1. AND is product, OR is sum, NOT is complement.","hook":"A+AB=A by absorption: A(1+B)=A.","bullets":["Identity A+0=A, A·1=A; null A+1=1, A·0=0; idempotent A+A=A, AA=A; complement A+A′=1, AA′=0; involution (A′)′=A."],"diagram":"bool","qs":[],"deep":["Treat variables as on/off switches. AND acts like series switches, OR like parallel switches; complements reverse the state.","AB+AB′=A(B+B′)=A.","Boolean 1+1=1."]},{"id":"L2-2","unit":2,"title":"Boolean laws, duality and De Morgan","analogy":"The commutative, associative and distributive laws rearrange expressions without changing their output. Duality exchanges AND↔OR and 0↔1.","hook":"For A=1 B=0: (AB)′=1; A′+B′=0+1=1. Verify all four rows.","bullets":["De Morgan: (AB)′=A′+B′; (A+B)′=A′B′. Prove with both expression columns in a truth table."],"diagram":"bool","qs":[],"deep":["Duality swaps AND with OR and 0 with 1; De Morgan complements operands and switches the operation. Verify by comparing all input rows.","(A+B)′=A′B′. At A=0,B=1, both equal 0.","A complement bar across a group changes the operation."]},{"id":"L2-3","unit":2,"title":"Combinational logic and SOP","analogy":"Combinational circuits depend only on current input. Sum of products ORs product terms. Canonical SOP uses minterms for rows where output is 1.","hook":"F=Σm(1,3,5,7) for A,B,C = A′B′C+A′BC+AB′C+ABC = C.","bullets":["In a minterm, bit 0 means complemented variable, bit 1 means normal. Σm denotes list of minterms."],"diagram":"sop","qs":[],"deep":["Canonical SOP combines minterms for output-one rows. Each minterm includes every variable once.","Σm(1,3) for A,B = A′B+AB=B.","In minterms bit 0 means complemented variable."]},{"id":"L2-4","unit":2,"title":"POS and maxterms","analogy":"Product of sums ANDs sum terms. Canonical POS uses maxterms for rows where output is 0.","hook":"Row 010 → (A+B′+C). F=ΠM(0,2,4,6)=C for A,B,C.","bullets":["In a maxterm, bit 0 means normal variable and bit 1 means complemented. ΠM denotes list of maxterms."],"diagram":"sop","qs":[],"deep":["Canonical POS multiplies maxterms corresponding to output-zero rows. Each maxterm is zero at its own row.","ΠM(0,2)=(A+B)(A′+B)=B.","In maxterms bit 0 means normal variable."]},{"id":"L2-5","unit":2,"title":"K-map: two and three variables","analogy":"Karnaugh maps arrange truth-table entries so adjacent cells differ by one bit. Group adjacent 1s for SOP, 0s for POS.","hook":"F(A,B,C)=Σm(1,3,5,7): four cells with C=1, so F=C.","bullets":["Use Gray order 00,01,11,10. Group sizes 1,2,4,8…; wrap edges; overlap allowed. Keep unchanged variables only."],"diagram":"kmap","qs":[],"deep":["Use Gray order 00,01,11,10. Adjacent cells differ in one variable. Group ones in powers of two, then keep variables that stay constant.","Σm(0,1,4,5) for A,B,C = B′.","Diagonal cells are not adjacent."]},{"id":"L2-6","unit":2,"title":"Four-variable maps and don't cares","analogy":"A four-variable map has 16 cells. Opposite edges are adjacent; even the four corners can form a group.","hook":"F=Σm(0,2,8,10) has four corner cells. B=0,D=0 remain constant → B′D′.","bullets":["Don’t-care X can be included if it creates a larger useful group, or ignored. Never include a required 0 in an SOP group."],"diagram":"kmap","qs":[],"deep":["Use AB and CD in Gray order for a four-variable map. Don't-care cells may be selected to form larger valid groups.","Σm(0,1,2,3), d(4,5,6,7) gives A′.","No need to cover every don't-care."]},{"id":"L3-1","unit":3,"title":"Half and full adders","analogy":"A half adder adds two single bits; a full adder also includes carry-in. Each produces sum and carry-out.","hook":"A=B=Cin=1 → sum 1 and carry 1 (binary 11).","bullets":["HA: S=A⊕B, C=AB. FA: S=A⊕B⊕Cin, Cout=AB+Cin(A⊕B). Implement with two half adders and OR."],"diagram":"adder","qs":[],"deep":["Half adder has two inputs; full adder takes carry-in. Combine two half adders and OR their carries.","A=B=Cin=1 gives S=1 and Cout=1.","Full-adder carry is AB+ACin+BCin."]},{"id":"L3-2","unit":3,"title":"Half subtractor","analogy":"A half subtractor subtracts B from A and produces difference and borrow.","hook":"0−1 → difference 1, borrow 1.","bullets":["D=A⊕B; Borrow=A′B. If A=0,B=1, borrow is needed."],"diagram":"subtract","qs":[],"deep":["Half subtractor calculates A−B with difference XOR and borrow A′B.","0−1 yields difference 1 and borrow 1.","Borrow depends on which operand is the minuend."]},{"id":"L3-3","unit":3,"title":"Multiplexer 4:1 and 8:1","analogy":"A multiplexer chooses one of many input signals and sends it to one output. Select lines form a binary address.","hook":"S1S0=10 → Y=I2. To implement XOR of A,B with a 4:1 MUX, connect I0=0,I1=1,I2=1,I3=0, select A,B.","bullets":["4:1 requires two select bits; 8:1 requires three. 4:1 Y=I0 S1′S0′+I1 S1′S0+I2 S1S0′+I3 S1S0."],"diagram":"mux","qs":[],"deep":["A multiplexer routes one selected input. For n select bits it supports 2ⁿ input lines.","4:1 MUX S1S0=10 selects D2.","MUX selects rather than adds data."]},{"id":"L3-4","unit":3,"title":"Demultiplexer 1:4 and decoder 3:8","analogy":"DEMUX routes one data input to a selected output. Decoder activates one output corresponding to an input code.","hook":"D=1 select 11 → Y3=1. Decoder input 101 → Y5=1. A DEMUX with D tied to 1 behaves as a decoder.","bullets":["1:4 DEMUX: Y0=D S1′S0′, Y1=D S1′S0, Y2=D S1S0′, Y3=D S1S0. Active-high 3:8 decoder selects one of eight outputs."],"diagram":"mux","qs":[],"deep":["A demultiplexer routes one input to an output; a decoder activates a line specified by an input code.","3:8 active-high decoder with input 101 activates Y5.","Check active-low outputs before drawing tables."]},{"id":"L3-5","unit":3,"title":"Binary to Gray converter circuit","analogy":"A converter changes binary bits into Gray code using XOR gates.","hook":"Input 1011 → output 1110. Draw three XOR gates plus direct MSB wire.","bullets":["For 4 bits: G3=B3, G2=B3⊕B2, G1=B2⊕B1, G0=B1⊕B0."],"diagram":"gates","qs":[],"deep":["Binary-to-Gray is a direct MSB wire followed by XOR gates on adjacent binary bits.","1011₂ gives 1110 Gray.","Reverse conversion XORs the previously decoded binary bit with the current Gray bit."]},{"id":"L3-6","unit":3,"title":"Memory cell and SR flip-flop","analogy":"Sequential circuits remember previous state. An SR latch can be built using two cross-coupled NOR gates. It has Set and Reset inputs.","hook":"If Q=1 and S=R=0, next Q remains 1. Active-low NAND SR has different input conventions.","bullets":["Active-high SR: 00 hold, 01 reset, 10 set, 11 invalid. A clocked flip-flop updates at its triggering event."],"diagram":"ff","qs":[],"deep":["A bistable cell stores one bit through feedback. A NOR SR latch holds with S=R=0, sets with S=1, resets with R=1.","Starting Q=0, S=1/R=0 sets Q=1; S=R=0 preserves Q.","Active-low NAND SR has different input rules."]},{"id":"L3-7","unit":3,"title":"JK flip-flop, preset and clear","analogy":"JK avoids the invalid SR combination by toggling when J=K=1 on a triggering clock edge.","hook":"If Q=0, J=K=1, next Q=1. On the next active edge it becomes 0.","bullets":["JK 00 hold, 01 reset, 10 set, 11 toggle. Preset and clear can asynchronously force Q=1 or Q=0; polarity depends on IC."],"diagram":"ff","qs":[],"deep":["JK toggles at an active clock edge when J=K=1. Preset and clear can override normal clocked operation.","Starting Q=0 and J=K=1, three edges give 1,0,1.","Race-around applies to level-triggered JK with long clock pulses."]},{"id":"L3-8","unit":3,"title":"Excitation tables","analogy":"A truth/characteristic table predicts next output from inputs. An excitation table gives required inputs for a desired transition.","hook":"For JK transition 1→0, K must be 1; J can be either 0 or 1.","bullets":["JK: 0→0 J=0 K=X; 0→1 J=1 K=X; 1→0 J=X K=1; 1→1 J=X K=0. SR: 0→0 S=0 R=X; 0→1 S=1 R=0; 1→0 S=0 R=1; 1→1 S=X R=0."],"diagram":"ff","qs":[],"deep":["Characteristic tables predict next state; excitation tables specify what inputs are required to reach a target state.","JK 0→1: J=1,K=X. JK 1→0: J=X,K=1.","X is a don't-care condition."]},{"id":"L3-9","unit":3,"title":"Asynchronous and synchronous counters","analogy":"Counters count clock pulses. Ripple counters clock each next flip-flop from the previous stage; synchronous counters share a clock.","hook":"For mod-10, at least 4 FFs are needed because 2³<10≤2⁴; reset or design state transitions after count 9.","bullets":["n flip-flops can count up to 2ⁿ states. A 3-bit binary up counter cycles 000→001→010→011→100→101→110→111→000."],"diagram":"counter","qs":[],"deep":["Ripple counters clock successive stages from the previous output. Synchronous counters use a common clock. n flip-flops support 2ⁿ states.","Three bits count 000 through 111 then repeat; MOD-6 needs three flip-flops.","Ripple delay accumulates stage by stage."]},{"id":"L3-10","unit":3,"title":"Registers and shift registers","analogy":"A register is a group of flip-flops storing multiple bits. Shift registers move bits on each clock.","hook":"SIPO takes 1 bit per pulse and makes all stored bits available in parallel after enough pulses.","bullets":["SISO serial in/out; SIPO serial in/parallel out; PISO parallel in/serial out; PIPO parallel in/out."],"diagram":"register","qs":[],"deep":["Shift registers move stored bits by one stage per clock. SISO, SIPO, PISO and PIPO describe data entry and exit.","Right shift of 0000 with inputs 1,0,1,1 produces 1000,0100,1010,1101.","State which side receives the serial input."]},{"unit":4,"title":"The 8051 in 60 seconds","analogy":"Think of an 8051 as a tiny computer that controls real things.","hook":"Classic exam numbers: 8-bit · 4KB ROM · 128B RAM · 4 ports · 2 timers · 40 pins.","bullets":["The CPU makes decisions; RAM holds temporary values; ROM holds the program.","Ports connect buttons, LEDs, motors, and other hardware.","One chip is why a microcontroller works well for embedded systems."],"qs":[1,10,15],"diagram":"architecture","id":"L4-1","deep":["Classic 8051 combines CPU, program/data memory, timers, interrupts, serial port and four eight-bit ports.","Read a switch on P1, make a decision, drive an LED on P2.","8051 derivatives may have different memory and timing."]},{"unit":4,"title":"CPU vs MCU / RISC vs CISC","analogy":"Two comparison tables can score easy marks.","hook":"CPU-only vs computer-on-a-chip; smaller/simple vs larger/complex instruction set.","bullets":["Write the differences in two clean columns.","MCUs usually have internal RAM, ROM, I/O and timers.","8051 is traditionally described as CISC-like."],"qs":[1,2,3],"diagram":"risc","id":"L4-2","deep":["Microprocessors often need external peripherals; microcontrollers integrate them. RISC/CISC describe instruction-set philosophy.","A desktop CPU is a microprocessor; classic 8051 is a CISC MCU.","RISC is not synonymous with MCU."]},{"unit":4,"title":"Harvard vs Von Neumann","analogy":"Imagine two cupboards (code and data) versus one shared cupboard.","hook":"Harvard = separate code/data. Von Neumann = shared memory.","bullets":["Draw two boxes or one box — that is almost half the answer.","8051 has separate code and data ADDRESS spaces.","Name the advantage: potential independent code/data access."],"qs":[4,5,6],"diagram":"harvard","id":"L4-3","deep":["Harvard keeps code and data spaces distinct; Von Neumann shares a memory space/path.","MOVC reads program code; MOVX accesses external data.","Same numeric address can refer to distinct spaces."]},{"unit":4,"title":"The memory family","analogy":"How do you erase old program data?","hook":"PROM = never; EPROM = UV; EEPROM = electrically by byte; Flash = electrically by block.","bullets":["EPROM has a UV erase window in typical erasable packages.","Flash is used in AT89C51 program storage.","Compare EEPROM vs Flash with a byte-vs-block table."],"qs":[7,8],"diagram":"memorytypes","id":"L4-4","deep":["ROM/Flash retains code, RAM holds working state, EEPROM retains electrically rewritable settings.","Firmware stays in Flash while sensor readings live in RAM.","The original 8051 used mask ROM; variants differ."]},{"unit":4,"title":"Pins and internal blocks","analogy":"Learn the 40-pin DIP by groups, not 40 unrelated names.","hook":"P1 left top (1–8), P3 left middle (10–17), P2 right bottom (21–28), P0 right top (32–39).","bullets":["Reset = 9; ground = 20; VCC = 40; XTAL = 18/19.","Architecture drawing: CPU + RAM/ROM + I/O + timers + serial + interrupts.","Practice drawing each group once on blank paper."],"qs":[9,10],"diagram":"pins","id":"L4-5","deep":["Classic DIP-40: RST 9, XTAL2/XTAL1 18/19, GND 20, PSEN 29, ALE 30, EA 31, VCC 40. P0 and P2 support external memory.","P0 carries multiplexed low address/data; P2 carries high address.","Classic GPIO P0 needs external pull-ups."]},{"unit":4,"title":"Registers, PSW and RAM","analogy":"The most scoring diagram is the 128-byte RAM map.","hook":"00–1F banks; 20–2F bit memory; 30–7F general RAM.","bullets":["4 banks × 8 registers, selected by PSW RS1 RS0.","PSW order: CY AC F0 RS1 RS0 OV – P.","8051 ROM is 4 KB; internal RAM 128 bytes; external code/data spaces are separate."],"qs":[11,12,13,14],"diagram":"ram","id":"L4-6","deep":["Internal RAM 00H–1FH has register banks, 20H–2FH is bit-addressable, 30H–7FH is general RAM. Direct 80H–FFH addresses SFRs.","RS1/RS0=10 selects register bank 2. SP resets to 07H.","First PUSH increments SP to 08H before storing."]},{"unit":5,"title":"From .ASM to a working program","analogy":"Coding toolchain is just write → convert → combine → test.","hook":"Editor → Assembler → Linker → Debugger.","bullets":["Assembler converts mnemonics to machine instructions.","ORG/EQU/END are directives, while ADD/INC/DEC are CPU instructions.","A program often starts with ORG 0000H and ends with END."],"qs":[1,2,3],"diagram":"workflow","id":"L5-1","deep":["Assembly directives guide the assembler; mnemonics become instructions. Assemble, link if needed, then load the simulator or target.","ORG 0000H; MOV A,#25H; HERE: SJMP HERE; END.","ORG, EQU and END are not executed by the CPU."]},{"unit":5,"title":"Loops and jump family","analogy":"DJNZ is a built-in countdown timer for your code.","hook":"MOV R0,#05H; LOOP: INC A; DJNZ R0,LOOP — repeats five times.","bullets":["Conditional jump tests something (JZ, CJNE, DJNZ).","Unconditional jump always jumps (SJMP, AJMP, LJMP).","SJMP small relative range; AJMP one 2KB page; LJMP anywhere in 64KB."],"qs":[4,5,6,10,11],"diagram":"loop","id":"L5-2","deep":["A jump changes execution flow. DJNZ decrements first and jumps only if nonzero; JZ checks accumulator A.","MOV R2,#03H; AGAIN: DJNZ R2,AGAIN. Counter becomes 2,1,0.","DJNZ executes three times, branch taken twice."]},{"unit":5,"title":"Stack and subroutines","analogy":"CALL is like going to the kitchen and coming back to your desk.","hook":"PUSH adds an item to LIFO stack; POP removes it; CALL remembers where to return.","bullets":["PUSH increases SP, then stores data.","RET returns to instruction after CALL.","Subroutines save code when tasks repeat."],"qs":[7,12,13],"diagram":"stack","id":"L5-3","deep":["PUSH increments SP before writing; POP reads before decrementing. CALL saves the return address; RET restores it.","SP=07H; PUSH ACC stores at 08H; POP ACC restores SP=07H.","Use RETI for interrupt returns."]},{"unit":5,"title":"Three programs you should write","analogy":"Addition/subtraction, five-iteration loop and cube.","hook":"ADD A,#data; CLR C / SUBB A,#data; DJNZ for repeats.","bullets":["Do the ADD and SUBB programs by hand.","For cube, 8-bit input can produce a 24-bit output — learn that detail.","In exams, add ORG, labels, a safe stopping loop and END."],"qs":[8,9,10,11],"diagram":"","id":"L5-4","deep":["Plan which registers hold operands, results and counters. Check for overflow of the 8-bit result.","MOV A,#0F0H; ADD A,#20H → A=10H, CY=1.","MUL AB returns the low byte in A, high byte in B."]},{"unit":5,"title":"Delay numericals without panic","analogy":"Each instruction costs machine cycles; your job is just count them.","hook":"12 MHz standard 8051: 1 machine cycle = 1 μs.","bullets":["Machine cycle time = 12 / oscillator frequency.","MOV R0,#05H is 1 cycle; five DJNZ iterations are 10 cycles.","Total 11 cycles = 11 μs, excluding surrounding instructions."],"qs":[14,15],"diagram":"timing","id":"L5-5","deep":["Classic 8051 machine cycle is 12 oscillator periods. Count cycles for each instruction including repeated branches.","At 12 MHz: MOV R7,#100 (1 cycle); DJNZ R7,LOOP (2×100) = 201 µs excluding other overhead.","Some modern cores use fewer clocks per machine cycle."]},{"unit":6,"title":"Seven addressing modes","analogy":"Addressing mode is simply the location of the value.","hook":"#25H = immediate; R0 = register; 30H = direct; @R0 = indirect.","bullets":["MOVC A,@A+DPTR accesses indexed code memory.","JNZ LOOP is a relative branch.","SETB P1.0 addresses a single bit."],"qs":[1,2,3,4],"diagram":"addressing","id":"L6-1","deep":["Addressing mode identifies where an operand comes from: literal, register, direct memory, indirect memory, indexed etc.","MOV A,#30H loads a literal; MOV A,30H reads RAM; MOV A,@R0 uses pointer R0.","The # symbol completely changes meaning."]},{"unit":6,"title":"MOV vs MOVC vs MOVX","analogy":"Same idea — different kinds of memory.","hook":"MOV normal data; MOVC code memory; MOVX external data memory.","bullets":["MOV A,#10H puts a constant in A.","MOVC reads a lookup table stored in program memory.","MOVX talks to external data RAM."],"qs":[5],"diagram":"addressing","id":"L6-2","deep":["MOV transfers internal data, MOVC reads program memory with A+DPTR or A+PC, MOVX accesses external data.","MOV DPTR,#2000H; CLR A; MOVC A,@A+DPTR reads code at 2000H.","MOVC is read-only."]},{"unit":6,"title":"Arithmetic and logic instructions","analogy":"An 8051 program is short when you know each verb.","hook":"ADD adds; SUBB subtracts with borrow; DEC reduces by one.","bullets":["ANL is AND (both); ORL is OR (either); XRL is XOR (different).","CJNE compares, DJNZ counts down.","CLR C before normal subtraction."],"qs":[6,7,8,9],"diagram":"logic","id":"L6-3","deep":["Arithmetic affects numeric results and some flags; ANL/ORL/XRL/CPL operate bitwise.","A=F0H; ANL A,#0FH→00H; ORL A,#0AH→0AH; XRL A,#03H→09H.","Clear C before ordinary SUBB unless an incoming borrow is intended."]},{"unit":6,"title":"Rotate, SWAP and number codes","analogy":"Think about digits as bits rather than their visual appearance.","hook":"SWAP 25H → 52H; packed BCD 25 → 25H; ASCII \"5\" → 35H.","bullets":["RL and RR rotate A with no carry; RLC and RRC include Carry.","For a single digit, BCD to ASCII is +30H.","DA A adjusts a BCD result after addition (from notes)."],"qs":[10,11,12],"diagram":"rotate","id":"L6-4","deep":["RL/RR rotate inside accumulator; RLC/RRC include carry. SWAP exchanges the two nibbles.","81H RL→03H; 3CH SWAP→C3H.","Rotate is not a logical shift."]},{"unit":6,"title":"Ports, switches and LEDs","analogy":"Pins are bits — each can be set, cleared, checked or flipped.","hook":"SETB = 1; CLR = 0; CPL = invert.","bullets":["CPL P1 changes all 8 bits; CPL P1.0 changes only one.","JNB checks an active-low switch (pressed = 0).","Whether a 1 turns a physical LED on depends on wiring."],"qs":[13,14,15],"diagram":"ports","id":"L6-5","deep":["Write classic quasi-bidirectional ports high before reading. For a pulled-up switch, grounding it reads zero.","SETB P1.0; JB P1.0,OFF; CLR P2.0 can light an active-low LED.","LEDs require current limiting; check actual wiring."]}],"questions":[{"id":"U1Q1","unit":1,"num":1,"title":"Explain Number systems and place value.","easy":"A number system is just a way to write a value. Binary is base 2, octal base 8, decimal base 10 and hexadecimal base 16.","points":["Binary digits 0–1; octal 0–7; decimal 0–9; hex 0–9 and A–F.","101101₂ = 32+8+4+1 = 45₁₀. 3A₁₆ = 3×16+10 = 58₁₀."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"convert","code":""},{"id":"U1Q2","unit":1,"num":2,"title":"Explain Conversions between bases.","easy":"To convert to decimal, multiply each digit by its positional weight. To convert from decimal, divide repeatedly by the target base and read remainders upward.","points":["Binary to octal: group 3 bits from right; binary to hex: group 4. Add leading zeros if needed.","25 ÷ 2 = 12 r1; 12 ÷ 2 = 6 r0; 6 ÷ 2 = 3 r0; 3 ÷ 2 = 1 r1; 1 ÷ 2 = 0 r1. Answer 11001₂."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"convert","code":""},{"id":"U1Q3","unit":1,"num":3,"title":"Explain Signed binary and complements.","easy":"A fixed-width signed number has a sign bit. One’s complement flips bits; two’s complement flips bits then adds one.","points":["For n-bit two’s complement range is −2^(n−1) to 2^(n−1)−1. Keep the same width throughout.","8-bit −5: 00000101 → 11111010 → 11111011. 8-bit range −128 to +127."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"convert","code":""},{"id":"U1Q4","unit":1,"num":4,"title":"Explain Binary addition and subtraction.","easy":"Binary addition carries when the sum reaches 2. In two’s complement subtraction add the two’s complement of the subtrahend; discard final carry.","points":["For one’s complement subtraction add complement of B to A and add end-around carry if present. With no carry, complement result to get negative magnitude.","7−3 in 4 bits: 0111 + 1101 = 1 0100 → 0100. One’s complement: 0111 + 1100 = 1 0011; add carry → 0100."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"convert","code":""},{"id":"U1Q5","unit":1,"num":5,"title":"Explain BCD and Gray code.","easy":"BCD encodes every decimal digit separately using four bits; Gray code changes only one bit between consecutive values.","points":["Binary→Gray: keep MSB and XOR adjacent binary bits. Gray→binary: keep MSB and XOR previous binary bit with next Gray bit.","59 in BCD = 0101 1001, NOT ordinary binary 111011. 1011 binary → 1110 Gray → 1011 binary."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"convert","code":""},{"id":"U1Q6","unit":1,"num":6,"title":"Explain Basic and derived logic gates.","easy":"Logic gates take binary inputs and produce a binary output. AND needs both, OR needs at least one, XOR needs different inputs.","points":["NOT inverts. NAND = NOT AND, NOR = NOT OR, XNOR = NOT XOR. Draw symbol, expression and truth table in an exam.","A=1 B=0: AND 0, OR 1, XOR 1, NAND 1, NOR 0, XNOR 0."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"gates","code":""},{"id":"U1Q7","unit":1,"num":7,"title":"Explain Universal gates: NAND and NOR.","easy":"A universal gate can implement any Boolean function using only copies of itself.","points":["NAND NOT=A NAND A; AND=invert NAND; OR=(A NAND A) NAND (B NAND B). NOR NOT=A NOR A; OR=invert NOR; AND=(A NOR A) NOR (B NOR B).","Draw AND using two NAND gates: first NAND A,B, then tie both second inputs together to invert."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"universal","code":""},{"id":"U1Q8","unit":1,"num":8,"title":"Explain TTL, ECL and CMOS.","easy":"Logic families group ICs made using a common circuit technology. TTL uses bipolar transistors, ECL uses non-saturating bipolar current steering, CMOS uses complementary MOSFETs.","points":["Traditional ECL is very fast but power-hungry; CMOS has low static power and generally good noise immunity; TTL is a classic medium-speed bipolar family. Actual values depend on series.","CMOS inverter: input 0 turns PMOS on and NMOS off → output 1; input 1 does the opposite."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"families","code":""},{"id":"U1Q9","unit":1,"num":9,"title":"Explain Logic family characteristics.","easy":"Fan-in is number of inputs; fan-out is number of similar inputs an output can drive. Propagation delay is the time from input change to corresponding output change.","points":["Noise immunity resists interference. NMH=VOH(min)−VIH(min); NML=VIL(max)−VOL(max). Power P=VI; average propagation delay=(tPLH+tPHL)/2.","VOH=2.4 V, VIH=2.0 V: high noise margin 0.4 V. If delay times 8 and 12 ns, average 10 ns."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"families","code":""},{"id":"U2Q1","unit":2,"num":1,"title":"Explain Boolean algebra fundamentals.","easy":"Boolean variables are 0 or 1. AND is product, OR is sum, NOT is complement.","points":["Identity A+0=A, A·1=A; null A+1=1, A·0=0; idempotent A+A=A, AA=A; complement A+A′=1, AA′=0; involution (A′)′=A.","A+AB=A by absorption: A(1+B)=A."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"bool","code":""},{"id":"U2Q2","unit":2,"num":2,"title":"Explain Boolean laws, duality and De Morgan.","easy":"The commutative, associative and distributive laws rearrange expressions without changing their output. Duality exchanges AND↔OR and 0↔1.","points":["De Morgan: (AB)′=A′+B′; (A+B)′=A′B′. Prove with both expression columns in a truth table.","For A=1 B=0: (AB)′=1; A′+B′=0+1=1. Verify all four rows."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"bool","code":""},{"id":"U2Q3","unit":2,"num":3,"title":"Explain Combinational logic and SOP.","easy":"Combinational circuits depend only on current input. Sum of products ORs product terms. Canonical SOP uses minterms for rows where output is 1.","points":["In a minterm, bit 0 means complemented variable, bit 1 means normal. Σm denotes list of minterms.","F=Σm(1,3,5,7) for A,B,C = A′B′C+A′BC+AB′C+ABC = C."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"sop","code":""},{"id":"U2Q4","unit":2,"num":4,"title":"Explain POS and maxterms.","easy":"Product of sums ANDs sum terms. Canonical POS uses maxterms for rows where output is 0.","points":["In a maxterm, bit 0 means normal variable and bit 1 means complemented. ΠM denotes list of maxterms.","Row 010 → (A+B′+C). F=ΠM(0,2,4,6)=C for A,B,C."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"sop","code":""},{"id":"U2Q5","unit":2,"num":5,"title":"Explain K-map: two and three variables.","easy":"Karnaugh maps arrange truth-table entries so adjacent cells differ by one bit. Group adjacent 1s for SOP, 0s for POS.","points":["Use Gray order 00,01,11,10. Group sizes 1,2,4,8…; wrap edges; overlap allowed. Keep unchanged variables only.","F(A,B,C)=Σm(1,3,5,7): four cells with C=1, so F=C."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"kmap","code":""},{"id":"U2Q6","unit":2,"num":6,"title":"Explain Four-variable maps and don't cares.","easy":"A four-variable map has 16 cells. Opposite edges are adjacent; even the four corners can form a group.","points":["Don’t-care X can be included if it creates a larger useful group, or ignored. Never include a required 0 in an SOP group.","F=Σm(0,2,8,10) has four corner cells. B=0,D=0 remain constant → B′D′."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"kmap","code":""},{"id":"U3Q1","unit":3,"num":1,"title":"Explain Half and full adders.","easy":"A half adder adds two single bits; a full adder also includes carry-in. Each produces sum and carry-out.","points":["HA: S=A⊕B, C=AB. FA: S=A⊕B⊕Cin, Cout=AB+Cin(A⊕B). Implement with two half adders and OR.","A=B=Cin=1 → sum 1 and carry 1 (binary 11)."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"adder","code":""},{"id":"U3Q2","unit":3,"num":2,"title":"Explain Half subtractor.","easy":"A half subtractor subtracts B from A and produces difference and borrow.","points":["D=A⊕B; Borrow=A′B. If A=0,B=1, borrow is needed.","0−1 → difference 1, borrow 1."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"subtract","code":""},{"id":"U3Q3","unit":3,"num":3,"title":"Explain Multiplexer 4:1 and 8:1.","easy":"A multiplexer chooses one of many input signals and sends it to one output. Select lines form a binary address.","points":["4:1 requires two select bits; 8:1 requires three. 4:1 Y=I0 S1′S0′+I1 S1′S0+I2 S1S0′+I3 S1S0.","S1S0=10 → Y=I2. To implement XOR of A,B with a 4:1 MUX, connect I0=0,I1=1,I2=1,I3=0, select A,B."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"mux","code":""},{"id":"U3Q4","unit":3,"num":4,"title":"Explain Demultiplexer 1:4 and decoder 3:8.","easy":"DEMUX routes one data input to a selected output. Decoder activates one output corresponding to an input code.","points":["1:4 DEMUX: Y0=D S1′S0′, Y1=D S1′S0, Y2=D S1S0′, Y3=D S1S0. Active-high 3:8 decoder selects one of eight outputs.","D=1 select 11 → Y3=1. Decoder input 101 → Y5=1. A DEMUX with D tied to 1 behaves as a decoder."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"mux","code":""},{"id":"U3Q5","unit":3,"num":5,"title":"Explain Binary to Gray converter circuit.","easy":"A converter changes binary bits into Gray code using XOR gates.","points":["For 4 bits: G3=B3, G2=B3⊕B2, G1=B2⊕B1, G0=B1⊕B0.","Input 1011 → output 1110. Draw three XOR gates plus direct MSB wire."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"gates","code":""},{"id":"U3Q6","unit":3,"num":6,"title":"Explain Memory cell and SR flip-flop.","easy":"Sequential circuits remember previous state. An SR latch can be built using two cross-coupled NOR gates. It has Set and Reset inputs.","points":["Active-high SR: 00 hold, 01 reset, 10 set, 11 invalid. A clocked flip-flop updates at its triggering event.","If Q=1 and S=R=0, next Q remains 1. Active-low NAND SR has different input conventions."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"ff","code":""},{"id":"U3Q7","unit":3,"num":7,"title":"Explain JK flip-flop, preset and clear.","easy":"JK avoids the invalid SR combination by toggling when J=K=1 on a triggering clock edge.","points":["JK 00 hold, 01 reset, 10 set, 11 toggle. Preset and clear can asynchronously force Q=1 or Q=0; polarity depends on IC.","If Q=0, J=K=1, next Q=1. On the next active edge it becomes 0."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"ff","code":""},{"id":"U3Q8","unit":3,"num":8,"title":"Explain Excitation tables.","easy":"A truth/characteristic table predicts next output from inputs. An excitation table gives required inputs for a desired transition.","points":["JK: 0→0 J=0 K=X; 0→1 J=1 K=X; 1→0 J=X K=1; 1→1 J=X K=0. SR: 0→0 S=0 R=X; 0→1 S=1 R=0; 1→0 S=0 R=1; 1→1 S=X R=0.","For JK transition 1→0, K must be 1; J can be either 0 or 1."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"ff","code":""},{"id":"U3Q9","unit":3,"num":9,"title":"Explain Asynchronous and synchronous counters.","easy":"Counters count clock pulses. Ripple counters clock each next flip-flop from the previous stage; synchronous counters share a clock.","points":["n flip-flops can count up to 2ⁿ states. A 3-bit binary up counter cycles 000→001→010→011→100→101→110→111→000.","For mod-10, at least 4 FFs are needed because 2³<10≤2⁴; reset or design state transitions after count 9."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"counter","code":""},{"id":"U3Q10","unit":3,"num":10,"title":"Explain Registers and shift registers.","easy":"A register is a group of flip-flops storing multiple bits. Shift registers move bits on each clock.","points":["SISO serial in/out; SIPO serial in/parallel out; PISO parallel in/serial out; PIPO parallel in/out.","SIPO takes 1 bit per pulse and makes all stored bits available in parallel after enough pulses."],"tip":"Write the definition, formula or table, then one worked example.","diagram":"register","code":""},{"id":"A1-1","unit":1,"num":10,"title":"Convert (25) base 10 to base 2.","easy":"Answer: (11001) base 2.","points":["2×10^1 + 5×10^0 = 25 decimal. Then 25 ÷ 2 = 12, remainder 1; 12 ÷ 2 = 6, remainder 0; 6 ÷ 2 = 3, remainder 0; 3 ÷ 2 = 1, remainder 1; 1 ÷ 2 = 0, remainder 1. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-2","unit":1,"num":11,"title":"Convert (101101) base 2 to base 10.","easy":"Answer: (45) base 10.","points":["1×2^5 + 0×2^4 + 1×2^3 + 1×2^2 + 0×2^1 + 1×2^0 = 45 decimal."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-3","unit":1,"num":12,"title":"Convert (725) base 8 to base 10.","easy":"Answer: (469) base 10.","points":["7×8^2 + 2×8^1 + 5×8^0 = 469 decimal."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-4","unit":1,"num":13,"title":"Convert (3A) base 16 to base 10.","easy":"Answer: (58) base 10.","points":["3×16^1 + 10×16^0 = 58 decimal."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-5","unit":1,"num":14,"title":"Convert (100) base 10 to base 8.","easy":"Answer: (144) base 8.","points":["1×10^2 + 0×10^1 + 0×10^0 = 100 decimal. Then 100 ÷ 8 = 12, remainder 4; 12 ÷ 8 = 1, remainder 4; 1 ÷ 8 = 0, remainder 1. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-6","unit":1,"num":15,"title":"Convert (255) base 10 to base 16.","easy":"Answer: (FF) base 16.","points":["2×10^2 + 5×10^1 + 5×10^0 = 255 decimal. Then 255 ÷ 16 = 15, remainder F; 15 ÷ 16 = 0, remainder F. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-7","unit":1,"num":16,"title":"Convert (110101101) base 2 to base 8.","easy":"Answer: (655) base 8.","points":["1×2^8 + 1×2^7 + 0×2^6 + 1×2^5 + 0×2^4 + 1×2^3 + 1×2^2 + 0×2^1 + 1×2^0 = 429 decimal. Then 429 ÷ 8 = 53, remainder 5; 53 ÷ 8 = 6, remainder 5; 6 ÷ 8 = 0, remainder 6. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-8","unit":1,"num":17,"title":"Convert (101111001101) base 2 to base 16.","easy":"Answer: (BCD) base 16.","points":["1×2^11 + 0×2^10 + 1×2^9 + 1×2^8 + 1×2^7 + 1×2^6 + 0×2^5 + 0×2^4 + 1×2^3 + 1×2^2 + 0×2^1 + 1×2^0 = 3021 decimal. Then 3021 ÷ 16 = 188, remainder D; 188 ÷ 16 = 11, remainder C; 11 ÷ 16 = 0, remainder B. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-9","unit":1,"num":18,"title":"Convert (753) base 8 to base 2.","easy":"Answer: (111101011) base 2.","points":["7×8^2 + 5×8^1 + 3×8^0 = 491 decimal. Then 491 ÷ 2 = 245, remainder 1; 245 ÷ 2 = 122, remainder 1; 122 ÷ 2 = 61, remainder 0; 61 ÷ 2 = 30, remainder 1; 30 ÷ 2 = 15, remainder 0; 15 ÷ 2 = 7, remainder 1; 7 ÷ 2 = 3, remainder 1; 3 ÷ 2 = 1, remainder 1; 1 ÷ 2 = 0, remainder 1. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-10","unit":1,"num":19,"title":"Convert (9F) base 16 to base 2.","easy":"Answer: (10011111) base 2.","points":["9×16^1 + 15×16^0 = 159 decimal. Then 159 ÷ 2 = 79, remainder 1; 79 ÷ 2 = 39, remainder 1; 39 ÷ 2 = 19, remainder 1; 19 ÷ 2 = 9, remainder 1; 9 ÷ 2 = 4, remainder 1; 4 ÷ 2 = 2, remainder 0; 2 ÷ 2 = 1, remainder 0; 1 ÷ 2 = 0, remainder 1. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-11","unit":1,"num":20,"title":"Convert (156) base 10 to base 2.","easy":"Answer: (10011100) base 2.","points":["1×10^2 + 5×10^1 + 6×10^0 = 156 decimal. Then 156 ÷ 2 = 78, remainder 0; 78 ÷ 2 = 39, remainder 0; 39 ÷ 2 = 19, remainder 1; 19 ÷ 2 = 9, remainder 1; 9 ÷ 2 = 4, remainder 1; 4 ÷ 2 = 2, remainder 0; 2 ÷ 2 = 1, remainder 0; 1 ÷ 2 = 0, remainder 1. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-12","unit":1,"num":21,"title":"Convert (11111111) base 2 to base 10.","easy":"Answer: (255) base 10.","points":["1×2^7 + 1×2^6 + 1×2^5 + 1×2^4 + 1×2^3 + 1×2^2 + 1×2^1 + 1×2^0 = 255 decimal."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-13","unit":1,"num":22,"title":"Convert (457) base 8 to base 16.","easy":"Answer: (12F) base 16.","points":["4×8^2 + 5×8^1 + 7×8^0 = 303 decimal. Then 303 ÷ 16 = 18, remainder F; 18 ÷ 16 = 1, remainder 2; 1 ÷ 16 = 0, remainder 1. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-14","unit":1,"num":23,"title":"Convert (AF) base 16 to base 8.","easy":"Answer: (257) base 8.","points":["10×16^1 + 15×16^0 = 175 decimal. Then 175 ÷ 8 = 21, remainder 7; 21 ÷ 8 = 2, remainder 5; 2 ÷ 8 = 0, remainder 2. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-15","unit":1,"num":24,"title":"Convert (512) base 10 to base 8.","easy":"Answer: (1000) base 8.","points":["5×10^2 + 1×10^1 + 2×10^0 = 512 decimal. Then 512 ÷ 8 = 64, remainder 0; 64 ÷ 8 = 8, remainder 0; 8 ÷ 8 = 1, remainder 0; 1 ÷ 8 = 0, remainder 1. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-16","unit":1,"num":25,"title":"Convert (2047) base 10 to base 16.","easy":"Answer: (7FF) base 16.","points":["2×10^3 + 0×10^2 + 4×10^1 + 7×10^0 = 2047 decimal. Then 2047 ÷ 16 = 127, remainder F; 127 ÷ 16 = 7, remainder F; 7 ÷ 16 = 0, remainder 7. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-17","unit":1,"num":26,"title":"Convert (111010101) base 2 to base 16.","easy":"Answer: (1D5) base 16.","points":["1×2^8 + 1×2^7 + 1×2^6 + 0×2^5 + 1×2^4 + 0×2^3 + 1×2^2 + 0×2^1 + 1×2^0 = 469 decimal. Then 469 ÷ 16 = 29, remainder 5; 29 ÷ 16 = 1, remainder D; 1 ÷ 16 = 0, remainder 1. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-18","unit":1,"num":27,"title":"Convert (110010101111) base 2 to base 8.","easy":"Answer: (6257) base 8.","points":["1×2^11 + 1×2^10 + 0×2^9 + 0×2^8 + 1×2^7 + 0×2^6 + 1×2^5 + 0×2^4 + 1×2^3 + 1×2^2 + 1×2^1 + 1×2^0 = 3247 decimal. Then 3247 ÷ 8 = 405, remainder 7; 405 ÷ 8 = 50, remainder 5; 50 ÷ 8 = 6, remainder 2; 6 ÷ 8 = 0, remainder 6. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-19","unit":1,"num":28,"title":"Convert (674) base 8 to base 16.","easy":"Answer: (1BC) base 16.","points":["6×8^2 + 7×8^1 + 4×8^0 = 444 decimal. Then 444 ÷ 16 = 27, remainder C; 27 ÷ 16 = 1, remainder B; 1 ÷ 16 = 0, remainder 1. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"A1-20","unit":1,"num":29,"title":"Convert (2D7) base 16 to base 8.","easy":"Answer: (1327) base 8.","points":["2×16^2 + 13×16^1 + 7×16^0 = 727 decimal. Then 727 ÷ 8 = 90, remainder 7; 90 ÷ 8 = 11, remainder 2; 11 ÷ 8 = 1, remainder 3; 1 ÷ 8 = 0, remainder 1. Read remainders from last to first."],"tip":"Assignment 1 • Part A. Show working.","diagram":"","code":""},{"id":"X0","unit":2,"title":"Prove De Morgan’s first theorem with a truth table.","easy":"(AB)′=A′+B′.","points":["For AB inputs 00,01,10,11 both expression columns are 1,1,1,0."],"tip":"Exam practice derived from syllabus/notes.","diagram":"kmap","code":""},{"id":"X1","unit":2,"title":"Prove identity law using truth table.","easy":"A+0=A and A·1=A.","points":["For A=0 both expressions are 0; for A=1 both are 1."],"tip":"Exam practice derived from syllabus/notes.","diagram":"kmap","code":""},{"id":"X2","unit":2,"title":"Compare SOP and POS.","easy":"SOP ORs AND terms; POS ANDs OR terms.","points":["SOP uses output-1 rows; POS uses output-0 rows. Minterm zero is complemented, maxterm zero is normal."],"tip":"Exam practice derived from syllabus/notes.","diagram":"kmap","code":""},{"id":"X3","unit":2,"title":"Simplify Σm(0,2,8,10) using four-variable K-map.","easy":"B′D′.","points":["Place 1 in four corner cells. A and C vary; B and D stay zero."],"tip":"Exam practice derived from syllabus/notes.","diagram":"kmap","code":""},{"id":"X4","unit":3,"title":"Compare combinational and sequential circuits.","easy":"Combinational output depends only on present input; sequential also depends on stored state.","points":["Combinational: adders, MUX. Sequential: flip-flops, counters. Sequential commonly uses clock and feedback."],"tip":"Exam practice derived from syllabus/notes.","diagram":"ff","code":""},{"id":"X5","unit":3,"title":"Design 4:1 MUX for XOR.","easy":"Use A,B as selectors.","points":["Connect I0=0,I1=1,I2=1,I3=0. Output is A⊕B."],"tip":"Exam practice derived from syllabus/notes.","diagram":"ff","code":""},{"id":"X6","unit":3,"title":"Compare ripple and synchronous counters.","easy":"Ripple stages are clocked by previous stage; synchronous stages share clock.","points":["Ripple accumulates propagation delay, synchronous has more logic but avoids ripple clock delay."],"tip":"Exam practice derived from syllabus/notes.","diagram":"ff","code":""},{"id":"X7","unit":3,"title":"Explain four types of shift registers.","easy":"SISO, SIPO, PISO, PIPO.","points":["Serial means one bit at a time; parallel means multiple bits simultaneously."],"tip":"Exam practice derived from syllabus/notes.","diagram":"ff","code":""},{"id":"X8","unit":1,"title":"Compare TTL, ECL and CMOS.","easy":"TTL uses BJTs, ECL uses non-saturated BJTs, CMOS uses complementary MOSFETs.","points":["Traditional ECL fastest/high power; CMOS low static power and high noise immunity; TTL intermediate. Values depend on family."],"tip":"Exam practice derived from syllabus/notes.","diagram":"families","code":""},{"id":"X9","unit":1,"title":"Draw CMOS inverter and explain.","easy":"PMOS at top, NMOS at bottom, gates tied as input, drains tied as output.","points":["Input low → PMOS ON, NMOS OFF → high. Input high reverses this."],"tip":"Exam practice derived from syllabus/notes.","diagram":"families","code":""},{"id":"U4Q1","unit":4,"num":1,"title":"Differentiate between microprocessor and microcontroller (any four points).","easy":"A microprocessor is mainly the CPU. A microcontroller is almost a complete mini-computer inside one chip.","points":["Microprocessor: CPU only; usually needs external RAM, ROM and I/O chips.","Microcontroller: CPU, RAM, ROM/Flash, I/O and timers are mostly built in.","Microprocessor systems are generally bigger and consume more power; microcontrollers suit compact control tasks.","Examples: Intel 8085 / PC processor versus 8051 / washing-machine controller."],"code":"","tip":"Unit Test 2 study hub • Memory trick: Microprocessor = brain only; microcontroller = brain + memory + hands.","diagram":"processor"},{"id":"U4Q2","unit":4,"num":2,"title":"State the meaning of RISC and CISC processors.","easy":"RISC means Reduced Instruction Set Computer. CISC means Complex Instruction Set Computer.","points":["RISC uses a smaller set of simpler instructions.","CISC uses a larger set with more complex instructions.","RISC examples include ARM/AVR; the 8051 is commonly taught as CISC-like."],"code":"","tip":"Unit Test 2 study hub • R = Reduced; C = Complex.","diagram":""},{"id":"U4Q3","unit":4,"num":3,"title":"Differentiate between RISC and CISC processors.","easy":"RISC keeps instructions simple; CISC provides more complex instructions.","points":["Instruction set: RISC smaller/simple; CISC larger/complex.","Instruction format: RISC often fixed-length; CISC often variable-length.","Execution: RISC designed for simple/faster operations; CISC instructions may need multiple cycles.","Hardware: RISC simpler control; CISC more complex.","Example: ARM/AVR versus 8051/x86 (traditional classifications)."],"code":"","tip":"Unit Test 2 study hub • Write any four contrasting rows for 4 marks.","diagram":"risc"},{"id":"U4Q4","unit":4,"num":4,"title":"Draw and explain Harvard architecture.","easy":"Harvard architecture has one memory for the program and a separate memory for data.","points":["Program instructions are kept in program memory.","Variables and working data are kept in data memory.","Separate address spaces / paths allow code and data to be accessed independently in principle.","The 8051 uses Harvard-style separate program and data spaces."],"code":"","tip":"Unit Test 2 study hub • Harvard = two memory rooms. Draw TWO boxes above CPU.","diagram":"harvard"},{"id":"U4Q5","unit":4,"num":5,"title":"Draw and explain Von Neumann architecture.","easy":"Von Neumann architecture stores program and data in the same memory.","points":["Single memory/address space contains instructions as well as data.","A common path/bus is used for instruction and data transfers.","Simple memory organization; shared path can become a bottleneck.","Draw one combined Code + Data memory linked to CPU."],"code":"","tip":"Unit Test 2 study hub • Von Neumann = one shared memory room.","diagram":"vonneumann"},{"id":"U4Q6","unit":4,"num":6,"title":"Compare Harvard and Von Neumann architectures.","easy":"Harvard uses separate program/data memory; Von Neumann uses a common memory.","points":["Memory: separate for Harvard, shared for Von Neumann.","Address space: separate code and data spaces versus one common space.","Transfers: separate access paths in Harvard principle versus shared bus in Von Neumann.","Design: Harvard is more specialized; Von Neumann conceptually simpler.","8051 uses Harvard-style memory organization."],"code":"","tip":"Unit Test 2 study hub • Exam diagram: two memory blocks vs one memory block.","diagram":"harvard"},{"id":"U4Q7","unit":4,"num":7,"title":"Describe the following memory types: (i) PROM (ii) EPROM (iii) EEPROM (iv) FLASH.","easy":"All four are non-volatile memories: they retain stored information after power is off.","points":["PROM: programmed only once.","EPROM: electrically programmed, erased by ultraviolet (UV) light, then reused.","EEPROM: electrically erased/reprogrammed byte by byte.","FLASH: electrically erased/reprogrammed in blocks or sectors; useful for program memory."],"code":"","tip":"Unit Test 2 study hub • PROM once → EPROM UV → EEPROM electrically per byte → Flash per block.","diagram":"memorytypes"},{"id":"U4Q8","unit":4,"num":8,"title":"Differentiate between EEPROM and FLASH memory.","easy":"Both EEPROM and Flash can be electrically rewritten; the main difference is erase granularity.","points":["EEPROM normally allows byte-by-byte erase or write.","Flash is normally erased in blocks/sectors.","Flash makes large program updates efficient and is common as MCU program memory.","EEPROM is convenient for a few settings/values that change individually."],"code":"","tip":"Unit Test 2 study hub • EEPROM = byte; Flash = block.","diagram":"memorytypes"},{"id":"U4Q9","unit":4,"num":9,"title":"Draw the pin diagram of the 8051 microcontroller and explain the functions of any four pins.","easy":"The standard 8051 is a 40-pin chip. Ports P0, P1, P2, P3 each have eight pins.","points":["Pins 1–8: Port 1 (P1.0–P1.7).","Pin 9: RST resets the chip; pins 18/19: XTAL2/XTAL1 crystal; pin 20: GND.","Pin 40: VCC (+5 V in the classic 8051).","Pins 32–39: Port 0; pins 21–28: Port 2.","Pins 29/30/31: PSEN, ALE, EA for external program memory.","Pins 10–17: Port 3 with alternate serial, interrupt, timer, RD/WR functions."],"code":"","tip":"Unit Test 2 study hub • Pin groups: 1–8 P1, 10–17 P3, 21–28 P2, 32–39 P0.","diagram":"pins"},{"id":"U4Q10","unit":4,"num":10,"title":"Draw and explain the architecture of the 8051 microcontroller.","easy":"The 8051 contains a CPU, memory, four I/O ports, timers, a serial port and interrupt control.","points":["CPU: ALU performs arithmetic/logic; accumulator A, B, PSW and registers hold data/status.","PC keeps next program address; DPTR is a 16-bit pointer; SP manages stack.","Classic 8051: 4 KB internal ROM, 128 bytes internal RAM.","Four 8-bit ports P0–P3 give 32 I/O lines.","Two 16-bit timers/counters, serial UART, oscillator and interrupt controller.","All blocks communicate using internal bus/control signals."],"code":"","tip":"Unit Test 2 study hub • Architecture drawing: CPU in centre; memory left, ports right, timers/serial below.","diagram":"architecture"},{"id":"U4Q11","unit":4,"num":11,"title":"Explain the register banks of the 8051 microcontroller with their memory addresses.","easy":"The first 32 bytes of internal RAM contain four banks, with eight registers per bank.","points":["Bank 0: 00H–07H (default); PSW RS1 RS0 = 00.","Bank 1: 08H–0FH; RS1 RS0 = 01.","Bank 2: 10H–17H; RS1 RS0 = 10.","Bank 3: 18H–1FH; RS1 RS0 = 11.","Only one bank is active at a time, selected by PSW bits RS1/RS0."],"code":"","tip":"Unit Test 2 study hub • 4 banks × 8 registers = 32 bytes.","diagram":"banks"},{"id":"U4Q12","unit":4,"num":12,"title":"Draw and explain the Program Status Word (PSW) register of the 8051 microcontroller.","easy":"PSW (Program Status Word) is an 8-bit register that stores status flags and selects the register bank.","points":["Bit layout D7→D0: CY | AC | F0 | RS1 | RS0 | OV | – | P.","CY = carry/borrow; AC = auxiliary carry; OV = signed overflow.","F0 is user flag; RS1 and RS0 select a register bank.","P indicates odd parity of accumulator A; D1 is reserved/user-definable on variants.","PSW is an SFR at address D0H."],"code":"","tip":"Unit Test 2 study hub • Memorize the exact eight boxes: CY AC F0 RS1 RS0 OV – P.","diagram":"psw"},{"id":"U4Q13","unit":4,"num":13,"title":"Explain the internal RAM organization of the 8051 microcontroller with a neat diagram.","easy":"Internal data RAM of the classic 8051 is 128 bytes: addresses 00H to 7FH.","points":["00H–1FH (32 bytes): four register banks.","20H–2FH (16 bytes): bit-addressable region (128 bits).","30H–7FH (80 bytes): general-purpose RAM, often includes stack.","SFRs occupy direct addresses 80H–FFH in a separate address space; not part of those 128 bytes.","After reset, SP = 07H, so first PUSH normally uses 08H."],"code":"","tip":"Unit Test 2 study hub • 32 + 16 + 80 = 128 bytes.","diagram":"ram"},{"id":"U4Q14","unit":4,"num":14,"title":"Explain the internal and external memory organization of the 8051 microcontroller.","easy":"The 8051 keeps code (program) memory and data memory as separate address spaces.","points":["Classic internal program ROM = 4 KB; internal data RAM = 128 bytes.","External program memory space can reach 64 KB; external data memory space also can reach 64 KB.","External program read uses PSEN; external data RAM uses MOVX with RD/WR.","Port 0 multiplexes low address/data; Port 2 supplies high address; ALE separates address/data.","EA chooses internal program code when enabled, or external when low."],"code":"","tip":"Unit Test 2 study hub • Code uses MOVC; external DATA uses MOVX.","diagram":"ram"},{"id":"U4Q15","unit":4,"num":15,"title":"Compare the specifications and features of 8051 and 8951 microcontrollers.","easy":"8051 and AT89C51/8951 behave very similarly; their program-memory technology differs.","points":["8051 (original Intel): 4 KB factory-programmed masked ROM.","8951/AT89C51: 4 KB electrically erasable/reprogrammable Flash program memory.","Both: 8-bit CPU, 128 B RAM, four 8-bit ports, two timers, 40 pins, same instruction set.","Flash makes 8951 more suitable for development and reprogramming."],"code":"","tip":"Unit Test 2 study hub • Same 8051 core + different code storage: ROM vs Flash.","diagram":"processor"},{"id":"U5Q1","unit":5,"num":1,"title":"Explain the functions of Editor, Assembler, Linker and Debugger in assembly language program development.","easy":"These are the four basic tools used to make and test an assembly program.","points":["Editor: write and save the .ASM source code.","Assembler: translate assembly mnemonics into object/machine code and report syntax errors.","Linker: combine object modules/libraries into a final program.","Debugger: run/step through code, check registers and memory, find logical errors."],"code":"","tip":"Unit Test 2 study hub • Editor → Assembler → Linker → Debugger.","diagram":"workflow"},{"id":"U5Q2","unit":5,"num":2,"title":"State the purpose of ADD, INC, DEC, ORG, EQU and END assembler directives with examples.","easy":"ADD/INC/DEC are executable instructions; ORG/EQU/END are assembler directives.","points":["ADD: adds a value to A, e.g. ADD A,#05H.","INC: increases a register/byte by 1, e.g. INC R0.","DEC: decreases it by 1, e.g. DEC A.","ORG: sets start address, e.g. ORG 0000H.","EQU: names a fixed constant, e.g. COUNT EQU 05H.","END: marks end of the source file."],"code":"COUNT EQU 05H\nORG 0000H\nMOV A,#COUNT\nINC A\nDEC A\nADD A,#02H\nEND","tip":"Unit Test 2 study hub • Exam detail: only ORG/EQU/END are directives.","diagram":""},{"id":"U5Q3","unit":5,"num":3,"title":"Explain decimal, hexadecimal and binary data representation in 8051 assembly language with examples.","easy":"8051 source can represent numbers in base 10, base 16 and base 2.","points":["Decimal (base 10): digits 0–9; MOV A,#25.","Hexadecimal (base 16): digits 0–9,A–F; suffix H, e.g. MOV A,#19H.","Binary (base 2): digits 0/1; suffix B, e.g. MOV A,#00011001B.","25 decimal = 19H = 00011001B.","A leading 0 is commonly used for hex literals starting with A–F: 0FFH."],"code":"","tip":"Unit Test 2 study hub • 25 decimal is NOT equal to 25H. (25H = 37 decimal.)","diagram":"number"},{"id":"U5Q4","unit":5,"num":4,"title":"Explain the use of loop instructions in 8051 assembly language with an example.","easy":"A loop means doing the same set of instructions again and again.","points":["DJNZ = Decrement and Jump if Not Zero.","It first reduces the selected register by 1, then jumps while the result is not zero.","Initialize R0 to 05H to repeat the body five times."],"code":"ORG 0000H\nMOV R0,#05H\nLOOP: INC A\n      DJNZ R0,LOOP\nHERE: SJMP HERE\nEND","tip":"Unit Test 2 study hub • DJNZ is the easiest 8051 loop for the exam.","diagram":"loop"},{"id":"U5Q5","unit":5,"num":5,"title":"Differentiate between conditional and unconditional jump instructions with examples.","easy":"Unconditional jump always jumps; conditional jump jumps only if a test succeeds.","points":["Unconditional examples: SJMP, AJMP and LJMP.","Conditional examples: JZ, JNZ, JC, JNC, JB, JNB, CJNE, DJNZ.","SJMP LOOP always transfers control to LOOP.","JZ ZERO transfers control only when accumulator A is zero."],"code":"MOV A,#00H\nJZ ZERO\nMOV R0,#01H\nZERO: MOV R0,#00H","tip":"Unit Test 2 study hub • Always vs only if a condition is true.","diagram":""},{"id":"U5Q6","unit":5,"num":6,"title":"Explain the functions of SJMP, LJMP and AJMP instructions with examples.","easy":"SJMP, AJMP and LJMP are unconditional jump instructions with different reach.","points":["SJMP: short relative jump within −128 to +127 bytes from the next instruction.","AJMP: absolute jump within the same 2 KB code-memory page.","LJMP: long jump anywhere within the 64 KB code address space.","All three transfer execution without automatically returning."],"code":"SJMP LOOP\nAJMP START\nLJMP FAR_LABEL","tip":"Unit Test 2 study hub • S = short; A = page; L = long.","diagram":""},{"id":"U5Q7","unit":5,"num":7,"title":"Describe PUSH and POP operations of the stack in the 8051 microcontroller with suitable examples.","easy":"The stack is a Last-In, First-Out (LIFO) storage area in internal RAM.","points":["PUSH direct: SP increases, then a byte is placed on the stack.","POP direct: top byte is copied to the destination, then SP decreases.","The stack is used to save temporary values and return addresses for CALL/RET.","After reset SP=07H in classic 8051; it is wise to move it if using register banks."],"code":"MOV 30H,#25H\nPUSH 30H\nPOP 40H\n; 40H now contains 25H","tip":"Unit Test 2 study hub • PUSH = put on pile; POP = take last thing off.","diagram":"stack"},{"id":"U5Q8","unit":5,"num":8,"title":"Write an 8051 assembly language program to add subtract 8-bit numbers.","easy":"Store the first number in A, then use ADD and SUBB (clear carry before subtraction).","points":["Take two numbers: 25H and 15H.","ADD gives 3AH; store it at 30H.","SUBB uses the carry flag as borrow, so CLR C first; subtraction gives 10H; store at 31H."],"code":"ORG 0000H\nMOV A,#25H\nADD A,#15H\nMOV 30H,A      ; sum = 3AH\nMOV A,#25H\nCLR C\nSUBB A,#15H\nMOV 31H,A      ; diff = 10H\nHERE: SJMP HERE\nEND","tip":"Unit Test 2 study hub • SUBB means A − number − carry, so CLR C before normal subtraction.","diagram":""},{"id":"U5Q9","unit":5,"num":9,"title":"Write an 8051 assembly language program to find the cube of an 8-bit number.","easy":"Cube means multiplying the same number three times: N × N × N.","points":["MUL AB multiplies two 8-bit numbers, returning a 16-bit result in B (high) and A (low).","For an arbitrary 8-bit input, the cube can need 24 bits.","The following example keeps all 24 bits in R6:R5:R4 (high:middle:low), not just the low byte."],"code":"ORG 0000H\nMOV R0,#05H    ; N = 5\nMOV A,R0\nMOV B,R0\nMUL AB        ; N^2 = B:A\nMOV R2,A      ; square low\nMOV R3,B      ; square high\nMOV A,R2\nMOV B,R0\nMUL AB        ; low square byte * N\nMOV R4,A      ; cube low\nMOV R5,B\nMOV A,R3\nMOV B,R0\nMUL AB        ; high square byte * N\nADD A,R5      ; combine middle bytes\nMOV R5,A\nMOV A,B\nADDC A,#00H   ; carry into top byte\nMOV R6,A      ; 24-bit cube = R6:R5:R4\nHERE: SJMP HERE\nEND","tip":"Unit Test 2 study hub • Small example 5³ = 125 = 00007DH. Two MULs and an ADDC protect the high bytes.","diagram":""},{"id":"U5Q10","unit":5,"num":10,"title":"Write an 8051 assembly language program using a loop to execute an operation five times.","easy":"Put a counter in a register and repeat an instruction exactly five times.","points":["MOV R0,#05H initializes the counter.","The body (INC A) increases A once each repetition.","DJNZ R0,LOOP decrements R0 and continues until it is zero.","Start A at 00H to make the final value 05H."],"code":"ORG 0000H\nMOV A,#00H\nMOV R0,#05H\nLOOP: INC A\n      DJNZ R0,LOOP\nHERE: SJMP HERE\nEND","tip":"Unit Test 2 study hub • Final A=05H and R0=00H.","diagram":"loop"},{"id":"U5Q11","unit":5,"num":11,"title":"Write an 8051 assembly language program using conditional jump instructions to compare two 8-bit numbers.","easy":"CJNE checks whether two numbers are different and branches if they are.","points":["Load the first 8-bit value into A.","CJNE compares it with the second number and jumps if not equal.","Choose different result flags for equal and not equal cases."],"code":"ORG 0000H\nMOV A,#25H\nCJNE A,#15H,NOTEQ\nMOV R0,#00H    ; equal\nSJMP DONE\nNOTEQ: MOV R0,#01H ; not equal\nDONE: SJMP DONE\nEND","tip":"Unit Test 2 study hub • CJNE = Compare and Jump if Not Equal.","diagram":""},{"id":"U5Q12","unit":5,"num":12,"title":"Explain CALL and RET instructions with suitable examples.","easy":"CALL runs a reusable mini-program; RET brings execution back.","points":["ACALL: call within the permitted 2 KB page; LCALL: call anywhere in 64 KB.","The return address is saved on stack automatically.","RET uses the saved address to continue from the instruction after CALL.","Unlike a JMP, a CALL is designed to return."],"code":"ACALL ADD5\n; resumes here after RET\nADD5: ADD A,#05H\n      RET","tip":"Unit Test 2 study hub • CALL = visit, RET = come back.","diagram":"call"},{"id":"U5Q13","unit":5,"num":13,"title":"Write an 8051 assembly language program to demonstrate the use of a subroutine using CALL and RET instructions.","easy":"A subroutine avoids repeating the same code several times.","points":["Main program loads A with 10H.","ACALL ADD5 transfers to the routine.","ADD A,#05H makes A=15H.","RET returns to main; the final loop prevents falling into the routine again."],"code":"ORG 0000H\nMOV A,#10H\nACALL ADD5\nSTOP: SJMP STOP\nADD5: ADD A,#05H\n      RET\nEND","tip":"Unit Test 2 study hub • Place an endless stop loop before routine code when needed.","diagram":"call"},{"id":"U5Q14","unit":5,"num":14,"title":"Define machine cycle and calculate the machine cycle time of a standard 12-clock 8051 microcontroller operating at 12 MHz.","easy":"One machine cycle is a basic instruction-timing unit of the standard 12-clock 8051.","points":["Standard original 8051: one machine cycle = 12 oscillator periods.","Formula: Tmc = 12 / fosc.","At 12 MHz: 12 / 12,000,000 second = 1 microsecond.","Some modern 8051 derivatives use different cycle ratios; this is for standard 12-clock 8051."],"code":"","tip":"Unit Test 2 study hub • At 12 MHz, remember 1 cycle = 1 μs.","diagram":"timing"},{"id":"U5Q15","unit":5,"num":15,"title":"Write an 8051 assembly language program to generate a time delay using a loop and calculate the delay for a given clock frequency.","easy":"A delay can be produced by repeating DJNZ until a counter reaches zero.","points":["MOV R0,#05H takes 1 machine cycle (standard 8051).","DJNZ R0,LOOP executes 5 times, taking 2 machine cycles each.","Total = 1 + (5 × 2) = 11 machine cycles.","At 12 MHz, 1 machine cycle = 1 μs, so example delay = 11 μs.","Count any surrounding CALL/RET when the whole subroutine delay is requested."],"code":"ORG 0000H\nMOV R0,#05H\nLOOP: DJNZ R0,LOOP\nHERE: SJMP HERE\nEND","tip":"Unit Test 2 study hub • For 12 MHz: delay in μs = counted machine cycles.","diagram":"timing"},{"id":"U6Q1","unit":6,"num":1,"title":"List the different addressing modes of the 8051 microcontroller.","easy":"Addressing mode tells the 8051 WHERE an instruction finds its data.","points":["Seven modes in your notes: Immediate, Register, Direct, Register-Indirect, Indexed, Relative and Bit.","Examples: #25H; R0; 30H; @R0; @A+DPTR; JNZ LOOP; P1.0."],"code":"","tip":"Unit Test 2 study hub • Remember: I R D I I R B (Immediate, Register, Direct, Indirect, Indexed, Relative, Bit).","diagram":"addressing"},{"id":"U6Q2","unit":6,"num":2,"title":"Explain immediate, register and register-indirect addressing modes with examples.","easy":"Immediate = value is written in the instruction; Register = value is inside a CPU register; Indirect = a register points to a memory address.","points":["Immediate example MOV A,#25H: A receives number 25H.","Register example MOV A,R0: A receives the current value inside R0.","Register-indirect example MOV A,@R0: R0 holds a RAM address and A receives its contents.","Only R0 and R1 are used for this classic 8051 internal-RAM indirect form."],"code":"MOV R0,#30H\nMOV 30H,#55H\nMOV A,@R0    ; A = 55H","tip":"Unit Test 2 study hub • # value; R0 value in register; @R0 value in memory pointed to by register.","diagram":"addressing"},{"id":"U6Q3","unit":6,"num":3,"title":"Explain direct and indexed addressing modes with suitable examples.","easy":"Direct = the memory address is written plainly; Indexed = table address is calculated.","points":["MOV A,30H reads the byte at direct address 30H.","MOV 40H,A writes A into direct memory 40H.","MOVC A,@A+DPTR reads program (code) memory using DPTR + A as an index.","Indexed addressing is useful for lookup tables stored in program memory."],"code":"MOV A,30H\nMOV DPTR,#TABLE\nMOV A,#02H\nMOVC A,@A+DPTR","tip":"Unit Test 2 study hub • Direct = a fixed address; Indexed = base + offset.","diagram":"addressing"},{"id":"U6Q4","unit":6,"num":4,"title":"Differentiate between immediate and register addressing modes with examples.","easy":"Immediate provides a literal constant; register addressing reads another register.","points":["Immediate: MOV A,#25H. Data is 25H, and # identifies the constant.","Register: MOV A,R0. Data is whatever value is currently held in R0.","Immediate source is part of instruction encoding; register source changes as the program runs."],"code":"","tip":"Unit Test 2 study hub • A,#25H ≠ A,R0: the first copies a number; the second copies a register value.","diagram":"addressing"},{"id":"U6Q5","unit":6,"num":5,"title":"Explain the functions of MOV, MOVC and MOVX instructions with examples.","easy":"All three transfer data, but from different memory spaces.","points":["MOV: ordinary transfers between registers, accumulator, and internal RAM/SFRs, e.g. MOV A,#25H.","MOVC: reads a byte from CODE/program memory into A, e.g. MOVC A,@A+DPTR.","MOVX: transfers via external DATA memory, e.g. MOVX A,@DPTR."],"code":"MOV A,#25H\nMOVC A,@A+DPTR\nMOVX A,@DPTR","tip":"Unit Test 2 study hub • MOVC = Code; MOVX = eXternal data.","diagram":"addressing"},{"id":"U6Q6","unit":6,"num":6,"title":"State the functions of ADD, SUBB and DEC instructions with examples.","easy":"ADD increases A by a number; SUBB subtracts a number and borrow; DEC decreases by one.","points":["ADD A,#05H: A ← A + 05H.","SUBB A,#05H: A ← A − 05H − Carry flag.","DEC R0: R0 ← R0 − 1.","Use CLR C before SUBB if no incoming borrow is intended."],"code":"MOV A,#20H\nADD A,#05H     ; 25H\nCLR C\nSUBB A,#05H    ; 20H\nDEC R0","tip":"Unit Test 2 study hub • SUBB depends on Carry; always check C.","diagram":""},{"id":"U6Q7","unit":6,"num":7,"title":"Write an 8051 assembly language program to perform addition and subtraction of two 8-bit numbers.","easy":"Use ADD and SUBB in two separate operations and keep both results.","points":["Example input numbers 25H and 15H.","Sum: 25H + 15H = 3AH.","Difference: 25H − 15H = 10H after CLR C.","Store results to 30H (sum) and 31H (difference)."],"code":"ORG 0000H\nMOV A,#25H\nADD A,#15H\nMOV 30H,A\nMOV A,#25H\nCLR C\nSUBB A,#15H\nMOV 31H,A\nHERE: SJMP HERE\nEND","tip":"Unit Test 2 study hub • Same as the Unit 5 add/subtract program — learn once for two questions.","diagram":""},{"id":"U6Q8","unit":6,"num":8,"title":"Explain the functions of ANL, ORL and XRL logical instructions with examples.","easy":"ANL = AND; ORL = OR; XRL = XOR.","points":["AND returns 1 only if both input bits are 1: 0FH AND 03H = 03H.","OR returns 1 when either bit is 1: 0FH OR 30H = 3FH.","XOR returns 1 when bits are different: 0FH XOR 03H = 0CH."],"code":"MOV A,#0FH\nANL A,#03H ; A = 03H\nORL A,#30H ; A = 33H\nXRL A,#03H ; A = 30H","tip":"Unit Test 2 study hub • ANL = both; ORL = either; XRL = different.","diagram":"logic"},{"id":"U6Q9","unit":6,"num":9,"title":"Explain the use of CJNE and DJNZ instructions with suitable examples.","easy":"CJNE compares two values; DJNZ makes a counted loop.","points":["CJNE A,#20H,NE: jump when A ≠ 20H.","DJNZ R0,LOOP: subtract 1 from R0 then jump while R0 ≠ 0.","CJNE is good for comparing; DJNZ is good for repeating operations."],"code":"CJNE A,#20H,NE\nMOV R0,#05H\nLOOP: INC A\n      DJNZ R0,LOOP","tip":"Unit Test 2 study hub • CJNE = compare; DJNZ = countdown.","diagram":"loop"},{"id":"U6Q10","unit":6,"num":10,"title":"Explain the functions of rotate and swap instructions (RL, RR, RLC, RRC and SWAP) with examples.","easy":"Rotate moves the bits of accumulator A around; SWAP exchanges its two four-bit halves.","points":["RL A: rotate left without carry flag.","RR A: rotate right without carry flag.","RLC A: rotate left THROUGH Carry; RRC A: rotate right THROUGH Carry.","SWAP A: exchanges high and low nibbles; 25H becomes 52H.","For A=81H, RL A gives 03H and RR A gives C0H."],"code":"MOV A,#25H\nSWAP A     ; 52H\nMOV A,#81H\nRL A       ; 03H","tip":"Unit Test 2 study hub • SWAP 25H → 52H. RL/RR do not use C; RLC/RRC do.","diagram":"rotate"},{"id":"U6Q11","unit":6,"num":11,"title":"Differentiate between BCD and ASCII codes with suitable examples.","easy":"BCD represents decimal digits as binary nibbles; ASCII represents characters.","points":["Packed BCD 25: 0010 0101 = 25H (2 and 5 are separate 4-bit digits).","ASCII character '2' = 32H; character '5' = 35H.","BCD is used for decimal arithmetic/displays; ASCII for storing/transmitting characters.","For a single digit 0–9, ASCII digit code = BCD value + 30H."],"code":"","tip":"Unit Test 2 study hub • BCD numeric 5 = 05H; ASCII character \"5\" = 35H.","diagram":"number"},{"id":"U6Q12","unit":6,"num":12,"title":"Write an 8051 assembly language program to convert a single-digit BCD number into its ASCII equivalent.","easy":"For one decimal digit 0–9, add 30H to get its ASCII code.","points":["Suppose BCD digit = 05H.","ADD A,#30H changes 05H to 35H.","35H is the ASCII code of character '5'.","This simple method works for a SINGLE valid decimal digit only."],"code":"ORG 0000H\nMOV A,#05H\nADD A,#30H    ; ASCII 35H = '5'\nMOV 30H,A\nHERE: SJMP HERE\nEND","tip":"Unit Test 2 study hub • BCD → ASCII: +30H. ASCII → number: −30H.","diagram":""},{"id":"U6Q13","unit":6,"num":13,"title":"Explain the bit manipulation instructions SETB, CLR and CPL with examples.","easy":"These commands work on single bits, such as one pin of an I/O port.","points":["SETB P1.0 sets pin/bit P1.0 to 1.","CLR P1.0 clears the bit to 0.","CPL P1.0 toggles it: 0→1 or 1→0.","JB/JNB test whether a bit is 1 or 0; JBC tests 1, clears it and jumps."],"code":"SETB P1.0\nCLR P1.0\nCPL P1.0","tip":"Unit Test 2 study hub • SETB = 1; CLR = 0; CPL = flip.","diagram":"ports"},{"id":"U6Q14","unit":6,"num":14,"title":"Write an 8051 assembly language program to toggle all the bits of Port 1 continuously.","easy":"CPL P1 flips every bit of Port 1: 0 becomes 1 and 1 becomes 0.","points":["Initialize P1 to 00H (all low).","CPL P1 complements all eight bits simultaneously.","SJMP START repeats the operation forever.","Without a delay the toggling is far too fast to see on a normal LED."],"code":"ORG 0000H\nMOV P1,#00H\nSTAR
