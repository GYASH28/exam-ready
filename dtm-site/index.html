T: CPL P1\n       SJMP START\nEND","tip":"Unit Test 2 study hub • CPL P1 toggles the WHOLE port, whereas CPL P1.0 toggles one pin.","diagram":"ports"},{"id":"U6Q15","unit":6,"num":15,"title":"Write an 8051 assembly language program to read the status of a switch connected to P1.0 and control an LED connected to P2.0.","easy":"Continuously read the switch and choose LED ON or OFF based on P1.0.","points":["Assumption for this example: switch is active-low (pressed = P1.0=0) and LED is active-high (P2.0=1 means ON).","SETB P1.0 releases the P1.0 port latch for input on a classic 8051.","JNB tests whether P1.0 is 0 and jumps to LEDON.","SETB P2.0 lights LED when pressed; CLR P2.0 turns it off otherwise.","Actual ON/OFF polarity depends on LED and switch wiring."],"code":"ORG 0000H\nSETB P1.0        ; prepare P1.0 as input\nCHECK: JNB P1.0,LEDON\n       CLR P2.0  ; switch open: OFF\n       SJMP CHECK\nLEDON: SETB P2.0 ; pressed: ON\n       SJMP CHECK\nEND","tip":"Unit Test 2 study hub • Label wiring assumption in the exam if a circuit is not supplied.","diagram":"ports"}],"quiz":[{"id":"AC0","unit":1,"prompt":"Convert (25) base 10 to base 2.","options":["11011","11001","11010","11101"],"correct":1,"why":"2×10^1 + 5×10^0 = 25 decimal. Then 25 ÷ 2 = 12, remainder 1; 12 ÷ 2 = 6, remainder 0; 6 ÷ 2 = 3, remainder 0; 3 ÷ 2 = 1, remainder 1; 1 ÷ 2 = 0, remainder 1. Read remainders from last to first."},{"id":"AC1","unit":1,"prompt":"Convert (101101) base 2 to base 10.","options":["49","45","47","46"],"correct":1,"why":"1×2^5 + 0×2^4 + 1×2^3 + 1×2^2 + 0×2^1 + 1×2^0 = 45 decimal."},{"id":"AC2","unit":1,"prompt":"Convert (725) base 8 to base 10.","options":["470","471","473","469"],"correct":3,"why":"7×8^2 + 2×8^1 + 5×8^0 = 469 decimal."},{"id":"AC3","unit":1,"prompt":"Convert (3A) base 16 to base 10.","options":["62","58","60","59"],"correct":1,"why":"3×16^1 + 10×16^0 = 58 decimal."},{"id":"AC4","unit":1,"prompt":"Convert (100) base 10 to base 8.","options":["146","144","150","145"],"correct":1,"why":"1×10^2 + 0×10^1 + 0×10^0 = 100 decimal. Then 100 ÷ 8 = 12, remainder 4; 12 ÷ 8 = 1, remainder 4; 1 ÷ 8 = 0, remainder 1. Read remainders from last to first."},{"id":"AC5","unit":1,"prompt":"Convert (255) base 10 to base 16.","options":["FF","100","103","101"],"correct":0,"why":"2×10^2 + 5×10^1 + 5×10^0 = 255 decimal. Then 255 ÷ 16 = 15, remainder F; 15 ÷ 16 = 0, remainder F. Read remainders from last to first."},{"id":"AC6","unit":1,"prompt":"Convert (110101101) base 2 to base 8.","options":["661","657","656","655"],"correct":3,"why":"1×2^8 + 1×2^7 + 0×2^6 + 1×2^5 + 0×2^4 + 1×2^3 + 1×2^2 + 0×2^1 + 1×2^0 = 429 decimal. Then 429 ÷ 8 = 53, remainder 5; 53 ÷ 8 = 6, remainder 5; 6 ÷ 8 = 0, remainder 6. Read remainders from last to first."},{"id":"AC7","unit":1,"prompt":"Convert (101111001101) base 2 to base 16.","options":["BD1","BCE","BCD","BCF"],"correct":2,"why":"1×2^11 + 0×2^10 + 1×2^9 + 1×2^8 + 1×2^7 + 1×2^6 + 0×2^5 + 0×2^4 + 1×2^3 + 1×2^2 + 0×2^1 + 1×2^0 = 3021 decimal. Then 3021 ÷ 16 = 188, remainder D; 188 ÷ 16 = 11, remainder C; 11 ÷ 16 = 0, remainder B. Read remainders from last to first."},{"id":"AC8","unit":1,"prompt":"Convert (753) base 8 to base 2.","options":["111101011","111101101","111101111","111101100"],"correct":0,"why":"7×8^2 + 5×8^1 + 3×8^0 = 491 decimal. Then 491 ÷ 2 = 245, remainder 1; 245 ÷ 2 = 122, remainder 1; 122 ÷ 2 = 61, remainder 0; 61 ÷ 2 = 30, remainder 1; 30 ÷ 2 = 15, remainder 0; 15 ÷ 2 = 7, remainder 1; 7 ÷ 2 = 3, remainder 1; 3 ÷ 2 = 1, remainder 1; 1 ÷ 2 = 0, remainder 1. Read remainders from last to first."},{"id":"AC9","unit":1,"prompt":"Convert (9F) base 16 to base 2.","options":["10011111","10100000","10100001","10100011"],"correct":0,"why":"9×16^1 + 15×16^0 = 159 decimal. Then 159 ÷ 2 = 79, remainder 1; 79 ÷ 2 = 39, remainder 1; 39 ÷ 2 = 19, remainder 1; 19 ÷ 2 = 9, remainder 1; 9 ÷ 2 = 4, remainder 1; 4 ÷ 2 = 2, remainder 0; 2 ÷ 2 = 1, remainder 0; 1 ÷ 2 = 0, remainder 1. Read remainders from last to first."},{"id":"AC10","unit":1,"prompt":"Convert (156) base 10 to base 2.","options":["10100000","10011110","10011101","10011100"],"correct":3,"why":"1×10^2 + 5×10^1 + 6×10^0 = 156 decimal. Then 156 ÷ 2 = 78, remainder 0; 78 ÷ 2 = 39, remainder 0; 39 ÷ 2 = 19, remainder 1; 19 ÷ 2 = 9, remainder 1; 9 ÷ 2 = 4, remainder 1; 4 ÷ 2 = 2, remainder 0; 2 ÷ 2 = 1, remainder 0; 1 ÷ 2 = 0, remainder 1. Read remainders from last to first."},{"id":"AC11","unit":1,"prompt":"Convert (11111111) base 2 to base 10.","options":["255","256","257","259"],"correct":0,"why":"1×2^7 + 1×2^6 + 1×2^5 + 1×2^4 + 1×2^3 + 1×2^2 + 1×2^1 + 1×2^0 = 255 decimal."},{"id":"AC12","unit":1,"prompt":"Convert (457) base 8 to base 16.","options":["12F","131","130","133"],"correct":0,"why":"4×8^2 + 5×8^1 + 7×8^0 = 303 decimal. Then 303 ÷ 16 = 18, remainder F; 18 ÷ 16 = 1, remainder 2; 1 ÷ 16 = 0, remainder 1. Read remainders from last to first."},{"id":"AC13","unit":1,"prompt":"Convert (AF) base 16 to base 8.","options":["263","257","260","261"],"correct":1,"why":"10×16^1 + 15×16^0 = 175 decimal. Then 175 ÷ 8 = 21, remainder 7; 21 ÷ 8 = 2, remainder 5; 2 ÷ 8 = 0, remainder 2. Read remainders from last to first."},{"id":"AC14","unit":1,"prompt":"Convert (512) base 10 to base 8.","options":["1001","1004","1002","1000"],"correct":3,"why":"5×10^2 + 1×10^1 + 2×10^0 = 512 decimal. Then 512 ÷ 8 = 64, remainder 0; 64 ÷ 8 = 8, remainder 0; 8 ÷ 8 = 1, remainder 0; 1 ÷ 8 = 0, remainder 1. Read remainders from last to first."},{"id":"AC15","unit":1,"prompt":"Convert (2047) base 10 to base 16.","options":["803","801","7FF","800"],"correct":2,"why":"2×10^3 + 0×10^2 + 4×10^1 + 7×10^0 = 2047 decimal. Then 2047 ÷ 16 = 127, remainder F; 127 ÷ 16 = 7, remainder F; 7 ÷ 16 = 0, remainder 7. Read remainders from last to first."},{"id":"AC16","unit":1,"prompt":"Convert (111010101) base 2 to base 16.","options":["1D5","1D9","1D6","1D7"],"correct":0,"why":"1×2^8 + 1×2^7 + 1×2^6 + 0×2^5 + 1×2^4 + 0×2^3 + 1×2^2 + 0×2^1 + 1×2^0 = 469 decimal. Then 469 ÷ 16 = 29, remainder 5; 29 ÷ 16 = 1, remainder D; 1 ÷ 16 = 0, remainder 1. Read remainders from last to first."},{"id":"AC17","unit":1,"prompt":"Convert (110010101111) base 2 to base 8.","options":["6257","6261","6260","6263"],"correct":0,"why":"1×2^11 + 1×2^10 + 0×2^9 + 0×2^8 + 1×2^7 + 0×2^6 + 1×2^5 + 0×2^4 + 1×2^3 + 1×2^2 + 1×2^1 + 1×2^0 = 3247 decimal. Then 3247 ÷ 8 = 405, remainder 7; 405 ÷ 8 = 50, remainder 5; 50 ÷ 8 = 6, remainder 2; 6 ÷ 8 = 0, remainder 6. Read remainders from last to first."},{"id":"AC18","unit":1,"prompt":"Convert (674) base 8 to base 16.","options":["1BE","1C0","1BC","1BD"],"correct":2,"why":"6×8^2 + 7×8^1 + 4×8^0 = 444 decimal. Then 444 ÷ 16 = 27, remainder C; 27 ÷ 16 = 1, remainder B; 1 ÷ 16 = 0, remainder 1. Read remainders from last to first."},{"id":"AC19","unit":1,"prompt":"Convert (2D7) base 16 to base 8.","options":["1330","1333","1331","1327"],"correct":3,"why":"2×16^2 + 13×16^1 + 7×16^0 = 727 decimal. Then 727 ÷ 8 = 90, remainder 7; 90 ÷ 8 = 11, remainder 2; 11 ÷ 8 = 1, remainder 3; 1 ÷ 8 = 0, remainder 1. Read remainders from last to first."},{"id":"NEW0","unit":1,"prompt":"Which logic gate produces 1 only when both inputs are 1?","options":["AND","XOR","NOR","OR"],"correct":0,"why":"AND implements multiplication of Boolean bits."},{"id":"NEW1","unit":1,"prompt":"Which gate produces 1 for different inputs?","options":["XOR","XNOR","NOR","AND"],"correct":0,"why":"Exclusive OR tests inequality."},{"id":"NEW2","unit":1,"prompt":"Which pair are universal gates?","options":["NAND and NOR","NOT and AND only","XOR and XNOR","AND and OR"],"correct":0,"why":"Either NAND or NOR alone can realize any Boolean function."},{"id":"NEW3","unit":1,"prompt":"What is the 8-bit two’s complement of 00000101?","options":["11111010","11111011","00000110","10000101"],"correct":1,"why":"Invert all bits then add one."},{"id":"NEW4","unit":1,"prompt":"What is BCD for decimal 59?","options":["0011 1011","0101 1010","1111 1001","0101 1001"]," ."},{"id":"M63","unit":6,"prompt":"ORL stands for…","options":["XOR","Bitwise OR","Subtraction","Overflow reset"],"correct":1,"why":"ORL implements bitwise OR."},{"id":"M64","unit":6,"prompt":"XRL implements…","options":["NAND","XOR","ADD","SWAP"],"correct":1,"why":"XRL implements bitwise XOR."},{"id":"M65","unit":6,"prompt":"CJNE means…","options":["Jump always","Compare and jump if not equal","Compare if zero","Count jump"],"correct":1,"why":"Compare operands; if unequal, branch."},{"id":"M66","unit":6,"prompt":"DJNZ does which order?","options":["Jump then increment","Decrement, test, jump if nonzero","Compare carry","Swap then jump"],"correct":1,"why":"DJNZ decrements first and jumps if not zero."},{"id":"M67","unit":6,"prompt":"RLC A rotates accumulator through…","options":["PSW bank","Carry flag","Port 2","Stack pointer"],"correct":1,"why":"RLC includes carry in its rotation."},{"id":"M68","unit":6,"prompt":"SWAP A applied to 25H gives…","options":["25H","52H","05H","FFH"],"correct":1,"why":"Upper and lower nibbles exchange places."},{"id":"M69","unit":6,"prompt":"ASCII character 5 is…","options":["05H","35H","55H","50H"],"correct":1,"why":"ASCII '5' = hexadecimal 35H."},{"id":"M70","unit":6,"prompt":"Single BCD digit to ASCII: add…","options":["10H","0FH","30H","FFH"],"correct":2,"why":"ASCII digit codes are 30H above numeric values."},{"id":"M71","unit":6,"prompt":"SETB P1.0 does…","options":["Clears the bit","Sets bit 0 of P1 to 1","Sets all of P1","Moves A"],"correct":1,"why":"SETB = make bit 1."},{"id":"M72","unit":6,"prompt":"CLR P1.0 does…","options":["Makes bit zero","Sets bit one","Toggles all P1","Calls routine"],"correct":0,"why":"CLR resets a bit to 0."},{"id":"M73","unit":6,"prompt":"CPL P1.0 means…","options":["Compare","Complement/toggle bit","Carry","Copy register"],"correct":1,"why":"CPL makes 0→1 or 1→0."},{"id":"M74","unit":6,"prompt":"JNB P1.0,LABEL jumps when…","options":["Bit is 1","Bit is 0","A is zero","Carry is one"],"correct":1,"why":"JNB = jump if bit not set."},{"id":"M75","unit":6,"prompt":"Which is valid to flip every bit of Port 1?","options":["CPL P1","MOV A,P1; CPL A; MOV P1,A","SETB P1","CLR CY"],"correct":1,"why":"CPL A flips all 8 bits; P1 does not support byte-wise CPL instruction."},{"id":"M76","unit":6,"prompt":"05H × 04H equals…","options":["20H","14H","24H","05H"],"correct":1,"why":"5×4=20 decimal=14H (hex)."},{"id":"UTU4Q1","unit":4,"prompt":"Which is usually built into a microcontroller chip?","options":["CPU, RAM and I/O","Only the CPU","Only a keyboard","Only an external disk"],"correct":0,"why":"A microcontroller combines CPU, memory and I/O on one IC."},{"id":"UTU4Q2","unit":4,"prompt":"RISC stands for…","options":["Reduced Instruction Set Computer","Random Internal System Code","Repeated Instruction Storage Chip","Register Instruction Serial Controller"],"correct":0,"why":"RISC = Reduced Instruction Set Computer."},{"id":"UTU4Q3","unit":4,"prompt":"Which best describes CISC?","options":["Very few simple instructions only","A larger set of more complex instructions","No instructions","An external RAM chip"],"correct":1,"why":"CISC = Complex Instruction Set Computer."},{"id":"UTU4Q4","unit":4,"prompt":"Harvard architecture has…","options":["Only data memory","Separate program and data spaces","One shared code+data memory","No memory"],"correct":1,"why":"Harvard uses separate code and data memory spaces."},{"id":"UTU4Q5","unit":4,"prompt":"Von Neumann architecture uses…","options":["A common memory for code and data","No address bus","Only separate code memory","Four independent CPUs"],"correct":0,"why":"Von Neumann stores instructions and data in one memory."},{"id":"UTU4Q6","unit":4,"prompt":"An advantage of separate program/data paths is…","options":["It removes the CPU","Potential independent instruction/data access","It halves every program","It removes the need for RAM"],"correct":1,"why":"Separate paths reduce contention in the architectural model."},{"id":"UTU4Q7","unit":4,"prompt":"Which memory is erased using UV light?","options":["EEPROM","FLASH","EPROM","PROM"],"correct":2,"why":"EPROM is erased by ultraviolet light."},{"id":"UTU4Q8","unit":4,"prompt":"Typical FLASH erase operation is…","options":["Per pixel","Per block or sector","Always one bit only","Not possible"],"correct":1,"why":"FLASH erases blocks/sectors; EEPROM allows byte-level operations."},{"id":"UTU4Q9","unit":4,"prompt":"How many pins does a standard DIP 8051 have?","options":["20","28","40","64"],"correct":2,"why":"The classic 8051 is commonly packaged in a 40-pin DIP."},{"id":"UTU4Q10","unit":4,"prompt":"Classic 8051 internal RAM size is…","options":["128 bytes","4 KB","64 KB","1 MB"],"correct":0,"why":"Classic 8051: 128-byte internal RAM; 4 KB code ROM."},{"id":"UTU4Q11","unit":4,"prompt":"Register Bank 2 occupies…","options":["00H–07H","08H–0FH","10H–17H","30H–3FH"],"correct":2,"why":"Bank 2: 10H–17H."},{"id":"UTU4Q12","unit":4,"prompt":"Which PSW bits select the register bank?","options":["CY and AC","RS1 and RS0","OV and P","F0 and CY"],"correct":1,"why":"RS1 and RS0 determine bank 0–3."},{"id":"UTU4Q13","unit":4,"prompt":"Where is the bit-addressable internal RAM area?","options":["00H–1FH","20H–2FH","30H–7FH","80H–FFH"],"correct":1,"why":"20H–2FH is 16 bytes with 128 individually addressable bits."},{"id":"UTU4Q14","unit":4,"prompt":"Maximum separate external data memory address space on standard 8051 is…","options":["128 B","4 KB","64 KB","1 GB"],"correct":2,"why":"8051 supports up to 64 KB external data memory space."},{"id":"UTU4Q15","unit":4,"prompt":"Main difference between original 8051 and AT89C51?","options":["AT89C51 has no CPU","8051 uses factory ROM; AT89C51 uses Flash","AT89C51 lacks ports","Different instruction sets"],"correct":1,"why":"8951/AT89C51 is the Flash-memory member of the 8051 family."},{"id":"UTU5Q1","unit":5,"prompt":"Which tool converts .ASM into machine code?","options":["Editor","Linker","Assembler","Debugger"],"correct":2,"why":"Assembler translates source mnemonics into machine code."},{"id":"UTU5Q2","unit":5,"prompt":"Which of these is an assembler directive, not an executable CPU instruction?","options":["ADD","DEC","ORG","INC"],"correct":2,"why":"ORG positions program code; ADD/INC/DEC execute on CPU."},{"id":"UTU5Q3","unit":5,"prompt":"25 decimal equals…","options":["25H","19H","35H","10H"],"correct":1,"why":"25 base 10 = 19 hexadecimal."},{"id":"UTU5Q4","unit":5,"prompt":"What does DJNZ do?","options":["Divide, jump if zero","Decrease and jump if not zero","Jump unconditionally","Delete a register"],"correct":1,"why":"DJNZ decrements its operand and jumps unless it becomes zero."},{"id":"UTU5Q5","unit":5,"prompt":"Which is a conditional jump?","options":["LJMP","AJMP","SJMP","JZ"],"correct":3,"why":"JZ jumps only when A = 0."},{"id":"UTU5Q6","unit":5,"prompt":"Which jump can reach anywhere in the 64 KB 8051 program space?","options":["LJMP","SJMP","AJMP","DJNZ"],"correct":0,"why":"LJMP is the long jump instruction."},{"id":"UTU5Q7","unit":5,"prompt":"The 8051 stack follows…","options":["FIFO","LIFO","Random access only","Alphabetical order"],"correct":1,"why":"Last In First Out."},{"id":"UTU5Q8","unit":5,"prompt":"Before an ordinary subtraction with SUBB, what should you usually do?","options":["SETB C","CLR C","SWAP A","INC DPTR"],"correct":1,"why":"CLR C removes an unwanted incoming borrow."},{"id":"UTU5Q9","unit":5,"prompt":"How many bits might be needed to store the exact cube of an 8-bit unsigned number?","options":["8","12","16","24"],"correct":3,"why":"255³ = 16,581,375, which fits in 24 bits."},{"id":"UTU5Q10","unit":5,"prompt":"MOV R0,#05H followed by DJNZ R0,LOOP repeats the loop body…","options":["3 times","4 times","5 times","Forever"],"correct":2,"why":"DJNZ counts 05,04,03,02,01 then stops at 00."},{"id":"UTU5Q11","unit":5,"prompt":"CJNE jumps when…","options":["Values are equal","Values are not equal","Carry is always 0","Both inputs are 0 only"],"correct":1,"why":"CJNE = Compare and Jump if Not Equal."},{"id":"UTU5Q12","unit":5,"prompt":"Which instruction returns from a called subroutine?","options":["RET","SJMP","INC","NOP"],"correct":0,"why":"RET pops the saved return address and resumes the caller."},{"id":"UTU5Q13","unit":5,"prompt":"What is automatically saved when a subroutine is called?","options":["All port values","Return address","All 256 bytes RAM","Oscillator frequency"],"correct":1,"why":"CALL pushes the return address on the stack."},{"id":"UTU5Q14","unit":5,"prompt":"One machine cycle on standard 12-clock 8051 with 12 MHz crystal is…","options":["1 ns","1 μs","12 μs","1 ms"],"correct":1,"why":"12 / 12 MHz = 1 microsecond."},{"id":"UTU5Q15","unit":5,"prompt":"MOV R0,#05H (1 cycle) and 5 DJNZs (2 cycles each) take…","options":["5 cycles","10 cycles","11 cycles","50 cycles"],"correct":2,"why":"1 + 5 × 2 = 11 cycles; at 12 MHz, 11 μs."},{"id":"UTU6Q1","unit":6,"prompt":"How many addressing modes does your Unit 6 list?","options":["3","5","7","9"],"correct":2,"why":"Immediate, register, direct, register indirect, indexed, relative, bit."},{"id":"UTU6Q2","unit":6,"prompt":"MOV A,#25H uses which mode?","options":["Immediate","Direct","Indirect","Relative"],"correct":0,"why":"The # symbol means actual constant data is in the instruction."},{"id":"UTU6Q3","unit":6,"prompt":"MOV A,@R0 means…","options":["A receives R0 itself","A receives data at the RAM address inside R0","A becomes zero","R0 jumps"],"correct":1,"why":"@R0 dereferences the memory address stored in R0."},{"id":"UTU6Q4","unit":6,"prompt":"Which instruction uses register addressing?","options":["MOV A,#20H","MOV A,R0","MOV A,30H","MOV A,@R0"],"correct":1,"why":"MOV A,R0 copies the current R0 value."},{"id":"UTU6Q5","unit":6,"prompt":"Which instruction reads PROGRAM/code memory?","options":["MOVX","MOVC","PUSH","POP"],"correct":1,"why":"MOVC reads program/code memory, commonly a lookup table."},{"id":"UTU6Q6","unit":6,"prompt":"SUBB A,R0 subtracts…","options":["Only R0","R0 and the Carry bit","Only Carry","R0 then adds 1"],"correct":1,"why":"SUBB: A ← A − R0 − CY."},{"id":"UTU6Q7","unit":6,"prompt":"25H + 15H in hexadecimal equals…","options":["30H","35H","3AH","40H"],"correct":2,"why":"0x25 + 0x15 = 0x3A."},{"id":"UTU6Q8","unit":6,"prompt":"Which is XOR in 8051 assembly?","options":["ANL","ORL","XRL","CLR"],"correct":2,"why":"XRL is exclusive-OR."},{"id":"UTU6Q9","unit":6,"prompt":"What does CJNE mean?","options":["Compare and Jump if Not Equal","Carry Jump Never Ends","Clear Jump Nonzero","Call Jump Near Entry"],"correct":0,"why":"CJNE branches if two operands are different."},{"id":"UTU6Q10","unit":6,"prompt":"SWAP A with A=25H produces…","options":["25H","52H","2AH","00H"],"correct":1,"why":"SWAP exchanges upper/lower 4-bit nibbles."},{"id":"UTU6Q11","unit":6,"prompt":"ASCII code for character 5 is…","options":["05H","15H","35H","50H"],"correct":2,"why":"ASCII digit codes are numeric digit + 30H."},{"id":"UTU6Q12","unit":6,"prompt":"To convert valid single-digit BCD 06H to ASCII, add…","options":["06H","20H","30H","40H"],"correct":2,"why":"06H + 30H = 36H, ASCII character 6."},{"id":"UTU6Q13","unit":6,"prompt":"Which instruction toggles a bit?","options":["SETB","CLR","CPL","MOVC"],"correct":2,"why":"CPL complements (flips) 0↔1."},{"id":"UTU6Q14","unit":6,"prompt":"Which instruction toggles all eight bits of Port 1?","options":["CPL P1.0","CPL P1","CLR P1.0","SETB P1.0"],"correct":1,"why":"CPL P1 complements all eight port bits."},{"id":"UTU6Q15","unit":6,"prompt":"For the example active-low switch at P1.0, pressed means…","options":["P1.0 = 1","P1.0 = 0","P2.0 = 1","The CPU is off"],"correct":1,"why":"Active-low input is low (0) when the switch is pressed."}],"programs":[{"unit":5,"name":"Add two numbers","goal":"A = 38H when 25H + 13H","code":"ORG 0000H\nMOV A,#25H\nADD A,#13H\nSTOP: SJMP STOP\nEND","explain":"Line 1 sets origin. Load A with 25H; add 13H; the final value is 38H. (Hexadecimal addition.)","trace":[{"line":2,"a":"25H","r0":"—","note":"MOV loads the first value into A."},{"line":3,"a":"38H","r0":"—","note":"ADD performs hexadecimal 25H + 13H = 38H."},{"line":4,"a":"38H","r0":"—","note":"SJMP STOP loops here to hold the result."}]},{"unit":5,"name":"Subtract two numbers","goal":"A = 12H when 25H − 13H","code":"ORG 0000H\nCLR C\nMOV A,#25H\nSUBB A,#13H\nSTOP: SJMP STOP\nEND","explain":"Clear carry first, otherwise SUBB also subtracts the previous carry (borrow).","trace":[{"line":2,"a":"—","cy":"0","note":"CLR C resets the carry/borrow bit."},{"line":3,"a":"25H","cy":"0","note":"Load 25H into A."},{"line":4,"a":"12H","cy":"0","note":"Subtract 13H, resulting in 12H."}]},{"unit":5,"name":"Five-time loop","goal":"Increment accumulator exactly 5 times","code":"ORG 0000H\nMOV A,#00H\nMOV R0,#05H\nLOOP:\n    INC A\n    DJNZ R0,LOOP\nSTOP: SJMP STOP\nEND","explain":"Five passes through INC A; R0 counts 5→4→3→2→1→0; final A = 05H.","trace":[{"line":3,"a":"00H","r0":"05H","note":"Initialize loop counter to five."},{"line":5,"a":"01H","r0":"05H","note":"1st increment; counter decrements at next instruction."},{"line":6,"a":"01H","r0":"04H","note":"DJNZ leaves R0=4; go back."},{"line":5,"a":"02H","r0":"04H","note":"2nd increment."},{"line":6,"a":"02H","r0":"03H","note":"DJNZ leaves R0=3."},{"line":5,"a":"03H","r0":"03H","note":"3rd increment."},{"line":6,"a":"03H","r0":"02H","note":"DJNZ leaves R0=2."},{"line":5,"a":"04H","r0":"02H","note":"4th increment."},{"line":6,"a":"04H","r0":"01H","note":"DJNZ leaves R0=1."},{"line":5,"a":"05H","r0":"01H","note":"5th increment."},{"line":6,"a":"05H","r0":"00H","note":"DJNZ reaches zero and exits."}]},{"unit":5,"name":"CJNE compare","goal":"R0=01H when values equal","code":"ORG 0000H\nMOV A,#25H\nCJNE A,#25H,NOT_EQUAL\nMOV R0,#01H\nSJMP STOP\nNOT_EQUAL: MOV R0,#00H\nSTOP: SJMP STOP\nEND","explain":"CJNE means compare and jump when not equal. For equal values it does not jump, so R0=01H.","trace":[{"line":2,"state":"A=25H","note":"Load accumulator."},{"line":3,"state":"CY=0","note":"Equal; do not branch."},{"line":4,"state":"R0=01H","note":"Equality result."},{"line":5,"state":"R0=01H","note":"Jump to STOP."}]},{"unit":5,"name":"CALL and RET","goal":"A changes from 10H to 15H","code":"ORG 0000H\nMOV A,#10H\nACALL PLUS5\nSJMP STOP\nPLUS5:\n    ADD A,#05H\n    RET\nSTOP: SJMP STOP\nEND","explain":"ACALL enters the PLUS5 subroutine, which adds 5 then returns using RET.","trace":[{"line":2,"state":"A=10H","note":"Load A."},{"line":3,"state":"SP=09H","note":"Push return address (assuming reset SP=07H), branch to PLUS5."},{"line":6,"state":"A=15H","note":"Add 05H."},{"line":7,"state":"SP=07H","note":"RET restores return address."},{"line":4,"state":"A=15H","note":"Continue to STOP."}]},{"unit":5,"name":"Delay loop (12 MHz)","goal":"Count 11 μs of instruction cycles","code":"ORG 0000H\nMOV R0,#05H\nLOOP:\n    DJNZ R0,LOOP\nSTOP: SJMP STOP\nEND","explain":"Excluding STOP loop: MOV = 1 cycle + DJNZ ×5 ×2 cycles = 11 machine cycles = 11 μs at 12 MHz for classic 12-clock 8051.","trace":[{"line":2,"state":"R0=05H","note":"MOV takes one machine cycle."},{"line":4,"state":"R0=04H; cycles=3","note":"DJNZ takes two machine cycles; repeat until zero."},{"line":4,"state":"R0=03H; cycles=5","note":"DJNZ takes two machine cycles; repeat until zero."},{"line":4,"state":"R0=02H; cycles=7","note":"DJNZ takes two machine cycles; repeat until zero."},{"line":4,"state":"R0=01H; cycles=9","note":"DJNZ takes two machine cycles; repeat until zero."},{"line":4,"state":"R0=00H; cycles=11","note":"DJNZ takes two machine cycles; repeat until zero."}]},{"unit":5,"name":"Cube of 8-bit number","goal":"Correct 24-bit cube, n=5 gives R6:R5:R4=00:00:7D","code":"ORG 0000H\nMOV R0,#05H\nMOV A,R0\nMOV B,R0\nMUL AB\nMOV R2,A\nMOV R3,B\nMOV A,R2\nMOV B,R0\nMUL AB\nMOV R4,A\nMOV R5,B\nMOV A,R3\nMOV B,R0\nMUL AB\nMOV R6,B\nADD A,R5\nMOV R5,A\nMOV A,R6\nADDC A,#00H\nMOV R6,A\nSTOP: SJMP STOP\nEND","explain":"(n² low × n) gives low/middle bytes. (n² high × n) is shifted one byte and added with carry; resulting 24-bit cube is R6:R5:R4.","trace":[{"line":2,"state":"R0=05H","note":"Set n=5."},{"line":3,"state":"A=05H","note":"Load n."},{"line":4,"state":"B=05H","note":"Load multiplier."},{"line":5,"state":"B:A=00:19H","note":"Square n = 25 decimal."},{"line":6,"state":"R2=19H","note":"Save square low byte."},{"line":7,"state":"R3=00H","note":"Save high byte."},{"line":8,"state":"A=19H","note":"Reload low byte."},{"line":9,"state":"B=05H","note":"Multiply by n."},{"line":10,"state":"B:A=00:7DH","note":"Low partial product 125 decimal."},{"line":11,"state":"R4=7DH","note":"Store low byte."},{"line":12,"state":"R5=00H","note":"Store middle byte."},{"line":13,"state":"A=00H","note":"Load upper byte of square."},{"line":14,"state":"B=05H","note":"Load n."},{"line":15,"state":"B:A=00:00H","note":"Upper partial product zero."},{"line":16,"state":"R6=00H","note":"Save upper byte."},{"line":17,"state":"A=00H; CY=0","note":"Add middle bytes."},{"line":18,"state":"R5=00H","note":"Save middle."},{"line":19,"state":"A=00H","note":"Load top."},{"line":20,"state":"A=00H","note":"Add carry."},{"line":21,"state":"R6:R5:R4=00:00:7D","note":"Store final cube."}]},{"unit":6,"name":"MOV and MOVC (code memory)","goal":"Compare immediate, direct and code-memory access","code":"ORG 0000H\nMOV A,#25H\nMOV 30H,A\nMOV DPTR,#TABLE\nMOV A,#00H\nMOVC A,@A+DPTR\nSJMP STOP\nTABLE: DB 55H\nSTOP: SJMP STOP\nEND","explain":"MOV copies data within internal memory or registers. MOVC reads code memory at A+DPTR (or A+PC). MOVX accesses external data memory; not executed in this particular example.","trace":[{"line":2,"state":"A=25H","note":"Immediate load."},{"line":3,"state":"RAM[30H]=25H","note":"Direct store."},{"line":4,"state":"DPTR=TABLE","note":"Load table address."},{"line":5,"state":"A=00H","note":"Set index zero."},{"line":6,"state":"A=55H","note":"Fetch code memory byte at TABLE."},{"line":7,"state":"A=55H","note":"Skip over table data."}]},{"unit":6,"name":"BCD digit to ASCII","goal":"05H becomes 35H = ASCII character 5","code":"ORG 0000H\nMOV A,#05H\nANL A,#0FH\nADD A,#30H\nMOV 30H,A\nSTOP: SJMP STOP\nEND","explain":"Each decimal digit 0–9 can be converted to its ASCII character code by adding 30H.","trace":[{"line":2,"state":"A=05H","note":"Load BCD digit."},{"line":3,"state":"A=05H","note":"Mask upper nibble."},{"line":4,"state":"A=35H","note":"Add ASCII offset."},{"line":5,"state":"RAM[30H]=35H","note":"Save ASCII character 5."}]},{"unit":6,"name":"Toggle all Port 1 pins","goal":"Repeated 00H ↔ FFH on P1","code":"ORG 0000H\nMOV A,#00H\nAGAIN:\n    CPL A\n    MOV P1,A\n    ACALL DELAY\n    SJMP AGAIN\nDELAY:\n    MOV R0,#0FFH\nD1:\n    DJNZ R0,D1\n    RET\nEND","explain":"Complement A to flip all 8 bits (do not write invalid CPL P1), copy A into P1 and loop. Delay helps make changing output visible.","trace":[{"line":2,"state":"A=00H","note":"Initialize."},{"line":4,"state":"A=FFH","note":"Complement all bits."},{"line":5,"state":"P1=FFH","note":"Write port."},{"line":6,"state":"P1=FFH","note":"Call delay."},{"line":9,"state":"R0=FFH","note":"Load delay counter."},{"line":11,"state":"R0=00H","note":"After 255 DJNZ executions."},{"line":12,"state":"P1=FFH","note":"Return."},{"line":7,"state":"P1=FFH","note":"Jump to AGAIN."},{"line":4,"state":"A=00H","note":"Complement again."},{"line":5,"state":"P1=00H","note":"Write port low."}]},{"unit":6,"name":"Switch controls LED","goal":"Active-low switch at P1.0, active-high LED at P2.0","code":"ORG 0000H\nSETB P1.0\nCHECK:\n    JNB P1.0,ON\n    CLR P2.0\n    SJMP CHECK\nON:\n    SETB P2.0\n    SJMP CHECK\nEND","explain":"If the pressed switch pulls P1.0 to zero, JNB jumps to ON and turns P2.0 high. Wiring assumptions matter.","trace":[{"line":2,"state":"P1.0=1","note":"Release quasi-bidirectional input."},{"line":4,"state":"P1.0=0","note":"Example assumes switch pressed; jump ON."},{"line":8,"state":"P2.0=1","note":"Turn active-high LED on."},{"line":9,"state":"P2.0=1","note":"Return to CHECK."},{"line":4,"state":"P1.0=1","note":"Example switch released; do not jump."},{"line":5,"state":"P2.0=0","note":"Turn LED off."},{"line":6,"state":"P2.0=0","note":"Continue polling."}]},{"unit":6,"name":"ANL, ORL, XRL examples","goal":"Logic operations with 0FH, 03H and 30H","code":"ORG 0000H\nMOV A,#0FH\nANL A,#03H     ; 03H\nMOV A,#0FH\nORL A,#30H     ; 3FH\nMOV A,#0FH\nXRL A,#03H     ; 0CH\nEND","explain":"AND retains shared 1-bits, OR combines 1-bits, XOR retains differing bits.","trace":[{"line":2,"state":"A=0FH","note":"Initialize."},{"line":3,"state":"A=03H","note":"Bitwise AND."},{"line":4,"state":"A=0FH","note":"Reload."},{"line":5,"state":"A=3FH","note":"Bitwise OR."},{"line":6,"state":"A=0FH","note":"Reload."},{"line":7,"state":"A=0CH","note":"Bitwise XOR."}]}],"extras":[{"unit":4,"front":"4 KB, 128 bytes, 32 pins — what do these mean?","back":"Classic 8051 ROM = 4 KB; internal RAM = 128 bytes; 32 I/O lines across four ports."},{"unit":4,"front":"What are the four 8051 ports?","back":"P0, P1, P2 and P3; each is 8 bits wide."},{"unit":4,"front":"Name 8051 timers.","back":"Timer 0 and Timer 1, each 16-bit."},{"unit":4,"front":"External code memory vs external data memory?","back":"Separate address spaces up to 64 KB each. PSEN for code, MOVX for data."},{"unit":4,"front":"What is the default stack pointer?","back":"SP = 07H after reset on standard 8051; first PUSH goes to 08H."},{"unit":4,"front":"What is the PSW bit order D7→D0?","back":"CY AC F0 RS1 RS0 OV – P."},{"unit":4,"front":"8051 Reset pin?","back":"Pin 9."},{"unit":4,"front":"Which pins power the standard DIP 8051?","back":"VCC pin 40, GND pin 20."},{"unit":4,"front":"8051 vs 8951 in one line?","back":"8051 uses mask ROM; AT89C51 (8951) uses reprogrammable Flash."},{"unit":4,"front":"Describe Harvard with 5 words.","back":"Separate code and data memory."},{"unit":5,"front":"What does EQU do?","back":"It defines a symbolic constant for the assembler, e.g. COUNT EQU 05H."},{"unit":5,"front":"ORG vs END?","back":"ORG sets start address; END finishes source program."},{"unit":5,"front":"Does CALL save the return address?","back":"Yes, on the stack; RET later returns using it."},{"unit":5,"front":"R0 starts at 05H: DJNZ loop runs how many times?","back":"Five times; R0 decrements 5 to 0."},{"unit":5,"front":"At 12 MHz how long is standard 8051 machine cycle?","back":"1 microsecond because it takes 12 oscillator periods."},{"unit":5,"front":"Syntax to check A is zero?","back":"JZ LABEL."},{"unit":5,"front":"Syntax for a 2 KB page subroutine call?","back":"ACALL LABEL."},{"unit":5,"front":"Data on stack is removed by which command?","back":"POP direct."},{"unit":5,"front":"Formula for a standard 8051 machine cycle?","back":"T = 12 / f_osc."},{"unit":5,"front":"What is 25H in decimal?","back":"37 decimal; 2×16 + 5."},{"unit":6,"front":"Three most-confused MOV forms?","back":"MOV A,#30H = immediate 30H; MOV A,30H = RAM[30H]; MOV A,@R0 = RAM[address stored in R0]."},{"unit":6,"front":"Difference MOVC and MOVX?","back":"MOVC = program/code memory; MOVX = external data memory."},{"unit":6,"front":"What does ANL do?","back":"Bitwise AND; output 1 only if both bits are 1."},{"unit":6,"front":"What does XRL do?","back":"Bitwise XOR; output 1 if bits differ."},{"unit":6,"front":"What does JBC do?","back":"If specified bit is set, jump and clear that bit."},{"unit":6,"front":"What is the ASCII code of character 0?","back":"30H."},{"unit":6,"front":"Convert BCD digit 9 to ASCII.","back":"09H + 30H = 39H = ASCII character 9."},{"unit":6,"front":"What does SWAP A do to 25H?","back":"Changes it into 52H by swapping two 4-bit nibbles."},{"unit":6,"front":"What is the correct 5H×4H in hex?","back":"14H, since 5×4 = 20 decimal."},{"unit":6,"front":"How do you toggle the whole P1 port?","back":"CPL A; MOV P1,A in a repeated loop (not CPL P1)."},{"unit":6,"front":"Active-low switch: pressed reads which bit?","back":"0 on the input bit, so JNB detects the press."}],"sources":[{"name":"Assignment_4_8051_Answers_with_Diagrams.pdf","text":"8051 comparisons, architecture, pins, registers and memory; used for Unit 4.","kind":"Prior study / practical material"},{"name":"CWIT_DTM_Practical_1_to_6_Complete_Medium_Answers_with_Diagrams.pdf","text":"Gate circuits and combinational logic with diagrams; used for Units 1–3.","kind":"Prior study / practical material"},{"name":"DTM UT1 Answer Model.pdf","text":"Teacher model answer: exam-style conversions and workings; Unit 1.","kind":"Teacher material"},{"name":"DTM assignment 1.docx","text":"Original 20 conversion exercises, with worked solutions incorporated into the question bank.","kind":"Teacher material"},{"name":"IOTR23_ALL_Curriculam-FINALV (2).pdf","text":"Official CWIT R23 semester III curriculum: six units and theory weightage.","kind":"Curriculum"},{"name":"Practical_6_Logic_Gates_Compact_Handout.pdf","text":"Logic gates implemented using 8051 instructions; Units 5–6.","kind":"Prior study / practical material"},{"name":"Unit 2 2.1.docx","text":"Boolean laws and truth-table proofs; Unit 2.","kind":"Teacher material"},{"name":"unit 1.3.docx","text":"Logic-family properties and comparisons; Unit 1.","kind":"Teacher material"},{"name":"DTM_Unit_Test_2_Interactive_Study_Hub.html","text":"Previous study compilation with Unit 4–6 exam practice.","kind":"Prior interactive study hub"},{"name":"DTM_Academy_Interactive_Exam_Prep_PRO.html","text":"Previous DTM Academy study explanations and questions.","kind":"Prior interactive study hub"},{"name":"DTM_Keil_Practicals_8-11_Fixed_Print.pdf","kind":"Prior study / practical material","text":"Assembly practical examples; earlier screen illustrations are not verified live Keil captures."},{"name":"CWIT_DTM_Practical_1_to_6_Corrected_Answers.pdf","kind":"Prior study / practical material","text":"Supplementary gate and logic practical answers."},{"name":"CWIT_Semester_3_to_6_YouTube_Lecture_Links.pdf","kind":"Prior study / practical material","text":"Lecture resource guide; used for topic mapping."},{"name":"Practical_11_Cleaned.docx","kind":"Prior study / practical material","text":"Square of a number using 8051 arithmetic."},{"name":"Practical_07_Cleaned.docx","kind":"Prior study / practical material","text":"Flip-flop verification exercise."}]}</script><script>

const labnames=[['gates','Logic gates'],['convert','Number converter'],['adder','Full adder'],['mux','MUX / DEMUX'],['ff','Flip-flops'],['counter','Counter'],['register','Shift register'],['kmap','K-map']];function bits(n=2){return `<div class="row">${S.labBits.slice(0,n).map((v,i)=>`<div><div class="small">${['A / S / J','B / R / K','Cin'][i]}</div><button class="bit ${v?'on':''}" data-act="bit" data-n="${i}">${v}</button></div>`).join('')}</div>`}function convertResult(){let val=S.convert.trim().toUpperCase(),base=S.srcBase,dst=S.dstBase;if(!val||!new RegExp('^[0-'+(base===2?'1':base===8?'7':'9')+(base===16?'A-F':'')+']+$').test(val))return '<div class="note">Enter valid unsigned digits for the selected base.</div>';let x=0n;for(let c of val)x=x*BigInt(base)+BigInt(parseInt(c,16));let rem=x,steps=[];while(rem>0n&&steps.length<160){let q=rem/BigInt(dst),r=rem%BigInt(dst);steps.push([rem.toString(),q.toString(),r.toString(dst).toUpperCase()]);rem=q}return `<div class="out">${x.toString(dst).toUpperCase()}<sub>${dst}</sub></div><p>Decimal value: ${x}</p>${val.length<40?`<p class="mono">${[...val].map((c,i)=>`${parseInt(c,16)}×${base}^${val.length-i-1}`).join(' + ')}</p>`:''}${dst===10?'':table(['Dividend','Quotient','Remainder'],steps.length?steps:[['0','0','0']])+'<p>Read remainders from bottom to top.</p>'}`}

function solveK(vals){let ones=vals.reduce((m,v,i)=>v===1?m|(1<<i):m,0);if(!ones)return '0';let zero=vals.reduce((m,v,i)=>v===0?m|(1<<i):m,0),candidates=[];for(let code=0;code<81;code++){let n=code,pat=[],cover=0;for(let k=0;k<4;k++){pat.unshift(n%3);n=Math.floor(n/3)}for(let i=0;i<16;i++)if(pat.every((v,k)=>v===2||v===(i>>(3-k)&1)))cover|=1<<i;if(!(cover&zero)&&(cover&ones)){let term=pat.map((v,k)=>v===2?'':'ABCD'[k]+(v===0?'′':'')).join('')||'1';candidates.push({cover:cover&ones,term,cost:pat.filter(v=>v!==2).length})}}let best=null,seen=new Map();function rec(covered,chosen,cost){if(covered===ones){let score=chosen.length*100+cost;if(!best||score<best.score)best={score,chosen};return}let score=chosen.length*100+cost;if(best&&score>=best.score)return;if((seen.get(covered)??Infinity)<=score)return;seen.set(covered,score);let remain=ones&~covered,first=remain&-remain;for(let t of candidates)if(t.cover&first)rec(covered|t.cover,[...chosen,t.term],cost+t.cost)}rec(0,[],0);return best?.chosen.join(' + ')||'0'}
function assembly(){let p=D.programs[S.program],tr=p.trace||[],cur=tr[Math.min(S.trace,tr.length-1)]||{};return head('8051 code lab.','Step through precomputed traces. These are guided examples, not a full Keil emulator.')+`<div class="cols"><div class="card"><label><b>Choose a program</b><br><select id="program" style="width:100%">${D.programs.map((p,i)=>`<option value="${i}" ${S.program===i?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><p style="margin-top:10px">${esc(p.goal)}</p><pre>${p.code.split('\n').map((line,i)=>`<div class="simline ${cur.line===i+1?'active':''}">${String(i+1).padStart(2,'0')}  ${esc(line)}</div>`).join('')}</pre><div class="row"><button data-act="trace" data-n="-1" ${S.trace===0?'disabled':''}>← Back</button><button class="primary" data-act="trace" data-n="1" ${S.trace>=tr.length-1?'disabled':''}>Step →</button><button data-act="traceReset">Reset</button><button data-act="copycode">Copy code</button></div><div class="note" style="margin-top:14px"><b>Step ${Math.min(S.trace+1,tr.length)}/${tr.length}</b><p>${esc(cur.note||'No trace available.')}</p><div class="row">${Object.entries(cur).filter(([k,v])=>!['line','note'].includes(k)).map(([k,v])=>`<span class="pill">${esc(k.toUpperCase())} = ${esc(v)}</span>`).join('')}</div></div><p style="margin-top:14px">${esc(p.explain)}</p></div><aside class="card"><h3>Instruction survival kit</h3>${diag('addressing')}${diag('rotate')}<div class="note">Classic 8051: 12 oscillator clocks per machine cycle. MOV A,#25H loads an immediate value; MOV A,25H loads from direct address 25H.</div></aside></div>`}
const examWeight=[10,10,15,10,15,10];function makeExam(){let items=[];for(let u=1;u<=6;u++){let q=shuffle(D.questions.filter(x=>x.unit===u));let weights=examWeight[u-1]===15?[3,4,4,4]:[2,4,4];weights.forEach((m,i)=>items.push({q:q[i],marks:m,answer:'',score:0}))}S.exam={items,submitted:false};render()}
function mock(){let e=S.exam;return head('The final boss.','70-mark, unit-weighted practice paper. This is generated practice, not an official past paper.')+`<div class="card"><div class="row spread"><div><h3>DTM / R23CI2603</h3><p>Suggested duration 3 hours · 70 marks</p></div><button class="primary" data-act="makeExam">${e?'Generate new paper':'Generate mock paper'}</button></div>${table(['Unit','Suggested marks'],examWeight.map((m,i)=>['Unit '+(i+1),m]))}</div>${e?`<div class="section"><h2>${e.submitted?'Self-check your paper':'Write your answers'}</h2><button data-act="print">Print</button></div>${e.items.map((o,i)=>`<article class="card question"><div class="row spread"><span class="pill">U${o.q.unit}</span><b>${o.marks} marks</b></div><h3>Q${i+1}. ${esc(o.q.title)}</h3><textarea data-exam="${i}" placeholder="Write your exam answer here…" ${e.submitted?'readonly':''}>${esc(o.answer)}</textarea>${e.submitted?`<div class="note"><b>Model answer</b><p>${esc(o.q.easy)}</p><ul>${o.q.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>${o.q.code?`<pre>${esc(o.q.code)}</pre>`:''}</div><label>Self-awarded marks <select data-score="${i}">${Array.from({length:o.marks+1},(_,n)=>`<option ${o.score===n?'selected':''}>${n}</option>`).join('')}</select></label>`:''}</article>`).join('')}<div class="card"><div class="row spread">${e.submitted?`<b class="out" id="examScore">${e.items.reduce((s,x)=>s+x.score,0)} / 70</b>`:'<p>Submit when you finish. Reveal model answers and grade yourself.</p><button class="primary" data-act="submitExam">Submit & reveal answers</button>'}</div></div>`:''}`}
const quick=[['Unit 1','Base conversions; complement subtraction; BCD/Gray; universal NAND/NOR; TTL/ECL/CMOS; fan-in/out, delay, noise margin.'],['Unit 2','Boolean laws and De Morgan; canonical SOP/POS; K-map groups 1,2,4,8,16; wrap edges; use X only when useful.'],['Unit 3','HA S=A⊕B, C=AB; FA Cout=AB+Cin(A⊕B); HS borrow=A′B; 4:1 MUX; 3:8 decoder; SR and JK truth/excitation tables; counters; SISO/SIPO/PISO/PIPO.'],['Unit 4','Classic 8051: 8-bit, 4KB ROM, 128B RAM, 32 I/O, 2 timers, 40 pins; PSW, register banks, memory map, Harvard vs Von Neumann.'],['Unit 5','Editor→assembler→linker→debugger; ORG/EQU/END; DJNZ, jumps, PUSH/POP, ACALL/LCALL/RET; 12T clock cycle; delay numericals.'],['Unit 6','Immediate #, register Rn, direct 30H, indirect @R0, indexed MOVC; ADD/ADDC/SUBB; MUL/DIV; ANL/ORL/XRL; rotates/SWAP; BCD and I/O.']];function revision(){let weak=D.quiz.filter(q=>S.wrong[q.id]);let starred=[...D.lessons,...D.questions].filter(x=>S.stars[x.id]);return head('Emergency revision.','A suggested 120-minute route, not a prediction of the exam.')+`<div class="grid">${quick.map(([t,d],i)=>`<div class="card"><div class="row spread"><span class="tag">${t}</span><b>${i===2||i===4?30:15} min</b></div><h3>${unitname(i+1)}</h3><p>${d}</p><button data-act="go" data-view="learn" data-n="${i+1}">Review chapter →</button></div>`).join('')}</div><div class="section"><h2>Weak spots & saved items</h2></div><div class="grid"><div class="card"><h3>Quiz mistakes (${weak.length})</h3>${weak.slice(0,20).map(x=>`<p>${esc(x.prompt)}<br><b>${esc(x.options[x.correct])}</b></p>`).join('')||'<p>No mistakes recorded yet.</p>'}<button data-act="retryAll">Retry mistakes</button></div><div class="card"><h3>Saved for later (${starred.length})</h3>${starred.map(x=>`<p>${esc(x.title)}</p>`).join('')||'<p>Star lessons and questions to revisit them here.</p>'}</div></div><div class="section"><h2>Draw these before the paper.</h2></div><div class="grid">${['gates','kmap','adder','ff','pins','ram','psw','addressing'].map(d=>`<div class="card"><h3>${d.toUpperCase()}</h3>${diag(d)}</div>`).join('')}</div>`}
function notes(){return head('Your notebook.','Notes autosave locally. Export them before switching devices.')+`<div class="card"><h3>General notes</h3><textarea data-note="general" placeholder="Write your own cheat sheet…">${esc(S.notes.general||'')}</textarea><button data-act="exportNotes">Export notes (.txt)</button></div><div class="section"><h2>Chapter notes</h2></div>${D.lessons.filter(x=>S.notes[x.id]).map(x=>`<div class="card question"><h3>U${x.unit} · ${esc(x.title)}</h3><textarea data-note="${x.id}">${esc(S.notes[x.id])}</textarea></div>`).join('')||'<div class="card">Chapter notes will show here when you write them.</div>'}`}
function sources(){let o=D.sources[S.source];return head('The source library.','Study source index. Original private documents are not published; relevant study material is incorporated in lessons and questions.')+`<div class="cols"><div class="card source"><span class="tag">${esc(o.kind)}</span><h3>${esc(o.name)}</h3><pre>${esc(o.text)}</pre></div><div class="card chapterlist"><h3>${D.sources.length} source files</h3>${D.sources.map((x,i)=>`<button class="${S.source===i?'selected':''}" data-act="source" data-n="${i}">${esc(x.name)}<br><small>${esc(x.kind)}</small></button>`).join('')}</div></div>`}
function search(q){q=q.trim().toLowerCase();if(!q){render();return}let includes=x=>JSON.stringify(x).toLowerCase().includes(q),ls=D.lessons.filter(includes),qs=D.questions.filter(includes),ps=D.programs.map((x,i)=>({...x,i})).filter(includes),ss=D.sources.map((x,i)=>({...x,i})).filter(includes);$('#app').innerHTML=head('Search results',`${ls.length+qs.length+ps.length+ss.length} matches for “${esc(q)}”`)+[...ls.map(x=>`<div class="sr"><button data-act="searchChapter" data-id="${x.id}">Chapter · U${x.unit} · ${esc(x.title)}</button></div>`),...qs.map(x=>`<div class="sr"><button data-act="searchQuestion" data-id="${x.id}">Question · U${x.unit} · ${esc(x.title)}</button></div>`),...ps.map(x=>`<div class="sr"><button data-act="searchProgram" data-n="${x.i}">Program · ${esc(x.name)}</button></div>`),...ss.map(x=>`<div class="sr"><button data-act="searchSource" data-n="${x.i}">Source · ${esc(x.name)}</button></div>`)].join('')}
function render(){document.body.classList.toggle('dark',!!S.theme);document.body.classList.toggle('focus',!!S.focus);$('#theme').textContent=S.theme?'☀':'☾';$('#nav').innerHTML=nav.map(([v,i,n])=>`<button data-act="go" data-view="${v}" class="${S.view===v?'active':''}"><span class="ico">${i}</span>${n}</button>`).join('');$('#crumb').textContent=nav.find(x=>x[0]===S.view)?.[2]||'Mission control';$('#app').innerHTML=({home,learn,bank,quiz,flash,labs,assembly,mock,revision,notes,sources}[S.view]||home)();progress()}
function startQuiz(n,wrong=false){let arr=shuffle(D.quiz.filter(x=>active(x.unit)&&(!wrong||S.wrong[x.id])));if(n)arr=arr.slice(0,n);if(!arr.length){toast('No matching questions yet.');return}S.quiz={items:arr,i:0,score:0,answers:[],finished:false};render();window.scrollTo(0,0)}function handle(b){let a=b.dataset.act,n=+b.dataset.n,id=b.dataset.id;switch(a){case'go':go(b.dataset.view,n||0);return;case'unit':S.unit=n;S.chapter=D.lessons.find(x=>active(x.unit))?.id;S.flashIndex=0;S.flip=false;break;case'chapter':S.chapter=id;window.scrollTo(0,0);break;case'done':S.done[id]=!S.done[id];toast(S.done[id]?'Chapter cleared! +1 brain cell.':'Chapter marked unread.');break;case'star':S.stars[id]=!S.stars[id];b.textContent=S.stars[id]?'★ Saved':'☆ Save';progress();return;case'known':S.known[id]=!S.known[id];b.textContent=S.known[id]?'✓ Mastered':'I know this ✓';progress();return;case'filter':S.filter=b.dataset.filter;break;case'quizStart':startQuiz(n);return;case'quizWrong':startQuiz(0,true);return;case'retryAll':go('quiz');startQuiz(0,true);return;case'quizReset':S.quiz=null;break;case'quizAnswer':{let z=S.quiz;if(!z||z.finished||z.answers[z.i]!==undefined)return;let q=z.items[z.i];z.answers[z.i]=n;if(n===q.correct){z.score++;delete S.wrong[q.id]}else S.wrong[q.id]=true;break}case'quizNext':{let z=S.quiz;if(z.answers[z.i]===undefined)return;if(z.i===z.items.length-1){z.finished=true;S.quizLog.push({score:z.score,total:z.items.length,date:Date.now()})}else z.i++;break}case'flip':S.flip=!S.flip;break;case'flashMove':S.flashIndex+=n;S.flip=false;break;case'flashMode':S.flashMode=b.dataset.filter;S.flashIndex=0;S.flip=false;break;case'flashGrade':S.known[id]=!!n;if(S.flashMode==='all'||!n)S.flashIndex++;S.flip=false;break;case'lab':S.lab=b.dataset.lab;break;case'bit':S.labBits[n]=1-S.labBits[n];break;case'gate':S.gate=b.dataset.gate;break;case'convert':S.convert=$('#convert').value;S.srcBase=+$('#srcBase').value;S.dstBase=+$('#dstBase').value;$('#convertResult').innerHTML=convertResult();return;case'ffType':S.ffType=b.dataset.type;break;case'clock':{let [a,b]=S.labBits;if(S.ffType==='SR'&&a&&b){toast('Invalid SR input. Q not updated.');return}S.ff=a&&b?1-S.ff:a?1:b?0:S.ff;break}case'resetFF':S.ff=0;break;case'count':S.counter=(S.counter+1)%8;break;case'resetCount':S.counter=0;break;case'shift':S.shift=[n,...S.shift.slice(0,3)];break;case'resetShift':S.shift=[0,0,0,0];break;case'kcell':S.kmap[n]=(S.kmap[n]+1)%3;break;case'kexample':S.kmap=Array.from({length:16},(_,i)=>+[0,2,8,10].includes(i));break;case'kreset':S.kmap=Array(16).fill(0);break;case'trace':S.trace=Math.max(0,Math.min(S.trace+n,(D.programs[S.program].trace||[]).length-1));break;case'traceReset':S.trace=0;break;case'copycode':{let code=D.programs[S.program].code;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(code).then(()=>toast('Copied code')).catch(()=>{window.prompt('Copy code:',code)});else window.prompt('Copy code:',code);return}case'makeExam':if(S.exam&&!confirm('Replace current practice paper?'))return;makeExam();return;case'submitExam':S.exam.submitted=true;break;case'print':window.print();return;case'exportNotes':{let str=Object.entries(S.notes).map(([k,v])=>(D.lessons.find(x=>x.id===k)?.title||'General notes')+'\n'+v).join('\n\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([str],{type:'text/plain'}));a.download='DTM-notes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}case'source':S.source=n;break;case'searchChapter':go('learn');S.chapter=id;break;case'searchQuestion':go('bank');requestAnimationFrame(()=>{let el=$('#q-'+id);if(el){el.open=true;el.scrollIntoView({block:'start'})}});return;case'searchProgram':go('assembly');S.program=n;S.trace=0;break;case'searchSource':go('sources');S.source=n;break;default:return}render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b&&!b.disabled)handle(b)});document.addEventListener('input',e=>{let t=e.target;if(t.dataset.note){S.notes[t.dataset.note]=t.value;save()}if(t.dataset.exam!==undefined&&S.exam)S.exam.items[+t.dataset.exam].answer=t.value;if(t.id==='search')search(t.value)});document.addEventListener('change',e=>{let t=e.target;if(t.id==='program'){S.program=+t.value;S.trace=0;render()}if(t.dataset.score!==undefined&&S.exam){S.exam.items[+t.dataset.score].score=+t.value;$('#examScore').textContent=S.exam.items.reduce((s,x)=>s+x.score,0)+' / 70'}});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='/'||e.key==='k'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('#search').focus();return}if(e.key==='Escape'){$('#side').classList.remove('open');return}if(e.key==='Enter'&&document.activeElement.matches('article[data-act]')){handle(document.activeElement);return}if(S.view==='flash'&&e.code==='Space'){e.preventDefault();S.flip=!S.flip;render()}if(S.view==='quiz'&&S.quiz&&!S.quiz.finished){if(/^[1-4]$/.test(e.key))handle({dataset:{act:'quizAnswer',n:+e.key-1}});if(e.key==='Enter')handle({dataset:{act:'quizNext'}})}});$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#theme').onclick=()=>{S.theme=!S.theme;render()};$('#focus').onclick=()=>{S.focus=!S.focus;render()};let remaining=1500,timerOn=false;$('#timerBtn').onclick=()=>{timerOn=!timerOn;drawTimer()};function drawTimer(){$('#timerBtn').textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')} ${timerOn?'Ⅱ':'▶'}`}setInterval(()=>{if(timerOn){remaining--;if(remaining<=0){timerOn=false;remaining=1500;toast('Focus session complete. Take a short break!')}drawTimer()}},1000);render();
</script></body></html>
