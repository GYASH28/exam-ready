operation; then a compact main  showing the operation on example values. Check boundary cases (full/empty, NULL or unsorted input) before giving the final output. For pointer code, trace what happens to the very first node and the very last node. A correct tiny program with a sensible explanation is more convincing than a long copied program you cannot explain.","k":"p"},{"t":"Reference provenance and differences from teacher\nmaterial","k":"h"},{"t":"Directly recovered from the Library: Unit 1 assignment; two Unit 2 assignment variants; Unit 3 lecture notes; Unit 4 lecture notes and assignment; Unit 5 teacher slide deck (attributed in the slide deck to A. C. Sarwade) and assignment; Unit 6 lecture notes and assignment; six-unit SLA problem statements; a student SLA compilation; 26 practical C-program sheets; and previously generated revision summaries. The supplied Winter 2026 timetable confirms the examination date and time printed in this study guide. These PDFs are included after the new study text in the complete edition.","k":"p"},{"t":"Editorial explanations in this edition: step-by-step dry runs, C99 implementations, expanded complexity discussions, exam question model answers, cautions about memory safety and implementation conventions, and simplified diagrams. They are educational additions, not teacher quotations or official marking-scheme answers. Some original source documents use inconsistent terminology or indexing conventions; the new text consistently states its assumptions. Preserve your instructor's conventions where explicitly required.","k":"p"}]},{"p":67,"unit":0,"chapter":"Revision & Source Notes","title":"COVERAGE LIMITATIONS","blocks":[{"t":"COVERAGE LIMITATIONS","k":"h"},{"t":"I did not locate a separate original Unit 1 or Unit 2 teacher lecture-note PDF, or a distinct Unit 3 assignment PDF,\namong the DS materials recovered for this edition. The Unit 1/2 assignments, Unit 3 notes and all six original SLA\nstatements supply that coverage; original documents are kept intact in the appendix.","k":"p"},{"t":"END OF NEW STUDY TEXT. The complete combined PDF continues with original assignments, teacher notes, PPT exports,\nSLA instructions, practical-program sheets and prior revision guides. Content in that archive is reproduced for reference and\nmay contain source-specific errors or conventions.","k":"p"}]}];

const monthDays=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();

function touch(){const day=dateKey();if(db.lastActive!==day){const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);db.streak=db.lastActive===dateKey(yesterday)?db.streak+1:1;db.lastActive=day;}db.activity[day]=(db.activity[day]||0)+1;persist();}

function toast(msg){const r=$('toast-root');r.innerHTML=`<div class="toast" role="status">${escapeHtml(msg)}</div>`;setTimeout(()=>{if(r)r.innerHTML='';},3100);}
function celebrate(){const colors=['#fb7749','#2a9f91','#f4c252','#8171d0','#db7991'];$('confetti-root').innerHTML=`<div class="confetti">${Array.from({length:35},(_,i)=>`<i style="left:${(i*73)%100}%;top:-30px;background:${colors[i%colors.length]};animation-delay:${(i%7)*.08}s;transform:rotate(${i*21}deg)"></i>`).join('')}</div>`;setTimeout(()=>$('confetti-root').innerHTML='',2400);}
function beep(freq=620){if(!db.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.04,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);osc.start();osc.stop(ctx.currentTime+.17);setTimeout(()=>ctx.close(),300);}catch(e){}}
function src(p){return `<a class="source-link" target="_blank" rel="noopener" href="DS_Textbook.pdf#page=${p}">↗ Textbook p.${p}</a>`;}
function unit(id){return UNITS.find(x=>x.id===Number(id))||UNITS[0];}

function accuracy(){const entries=Object.values(db.quizStats);const right=entries.reduce((n,s)=>n+(s.right||0),0);const all=attempted();return all?Math.round(right/all*100):0;}
function mastery(u){const lessons=LESSONS.filter(l=>l.unit===u);return Math.round(lessons.filter(l=>db.read[l.id]).length/lessons.length*100);}
function totalMastery(){return Math.round(LESSONS.filter(l=>db.read[l.id]).length/LESSONS.length*100);}

function render(){renderTop();$('nav').innerHTML=navHtml();document.title=(NAV.find(n=>n[0]===view.name)?.[2]||'Study')+' · STACK ATTACK!';let html='';switch(view.name){case'dashboard':html=dashboard();break;case'learn':html=learn();break;case'quiz':html=quiz();break;case'cards':html=cards();break;case'lab':html=lab();break;case'code':html=codePage();break;case'notes':html=notes();break;case'exam':html=exam();break;case'progress':html=progress();break;case'reference':html=reference();break;case'settings':html=settings();break;} $('page').innerHTML=html+`<footer class="footer">STACK ATTACK! © 2026 · Built for CWIT R23CI2602 · Grounded in the uploaded 67-page DS Study Edition · All progress stays in your browser. 💛</footer>`;renderFocus();}

function unitTabs(active,action){return `<div class="unit-tabs">${UNITS.map(u=>`<button class="unit-tab ${active===u.id?'active':''}" data-action="${action}" data-unit="${u.id}">${u.emoji} ${u.short}</button>`).join('')}</div>`;}
function dashboard(){const p=totalMastery();const hours=Math.max(0,Math.ceil((new Date('2026-11-25T10:30:00+05:30')-new Date())/3600000));return `<div class="eyebrow">⚡ Your headquarters · November 2026</div><div class="hero"><div><span class="sticker">ONE EXAM. SIX BOSSES.</span><h1>Make Data Structures<br>your side quest.</h1><p>Learn concepts like a human, destroy quizzes like a gamer, and walk into the exam with a brain full of actual logic—not copied definitions.</p><div class="row"><button class="btn orange" data-nav="learn">📖 Keep learning</button><button class="btn cream" data-nav="quiz">🎯 Start a quiz</button></div></div><div class="hero-illustration" aria-hidden="true">🧠<span style="font-size:.5em">⚔️</span></div></div><div class="grid" style="margin-top:25px"><div class="card span-3"><div class="kpi">${p}%</div><div class="kpi-label">Lesson mastery</div><div class="meter" style="margin-top:13px"><i style="width:${p}%"></i></div></div><div class="card span-3"><div class="kpi">${attempted()}</div><div class="kpi-label">Questions answered</div><div class="muted sm" style="margin-top:10px">${accuracy()}% accurate</div></div><div class="card span-3"><div class="kpi">${db.streak} 🔥</div><div class="kpi-label">Day study streak</div><div class="muted sm" style="margin-top:10px">Keep showing up.</div></div><div class="card span-3"><div class="kpi">${hours?hours+'h':'—'}</div><div class="kpi-label">Until exam starts</div><div class="muted sm" style="margin-top:10px">25 Nov · 10:30 AM IST</div></div></div><div class="grid" style="margin-top:23px"><div class="card span-7"><div class="section-head" style="margin-top:0"><div><span class="eyebrow">Your journey</span><h3>Six stages. Six boss fights.</h3></div><span class="pill">${LESSONS.length} lessons</span></div>${UNITS.map(u=>`<div class="unit-row"><div class="unit-avatar" style="background:${u.color}36">${u.emoji}</div><div class="unit-info"><b>${u.id.toString().padStart(2,'0')} · ${u.name}</b><small>${escapeHtml(u. function traceBuild(){const raw=view.labInput.split(',').map(s=>Number(s.trim()));if(!raw.length||raw.length>15||raw.some(n=>!Number.isFinite(n)||Math.abs(n)>10000)){view.labSteps=[];toast('Enter 1–15 valid numbers, comma-separated.');return;}const a=raw.slice(),type=view.labType,key=Number(view.labKey);if(!Number.isFinite(key)){toast('Enter a valid target/value.');return;}const steps=[];const add=(arr,desc,active=[],meta={})=>steps.push({arr:arr.slice(),desc,active:[...active],meta});

else if(type==='array-delete'){const pos=a.indexOf(key);add(a,`Starting array. Search for value ${key} to delete.`);if(pos<0)add(a,`Value ${key} is not present, so the array stays unchanged.`);else{add(a,`Found ${key} at index ${pos}.`,[pos]);a.splice(pos,1);add(a,`Removed value ${key}. Every later element shifted one position left.`,[Math.min(pos,a.length-1)]);}}

else if(type==='binary'){a.sort((x,y)=>x-y);let lo=0,hi=a.length-1;add(a,'Binary search requires sorted input, so the array has been sorted. Search for '+key+'.');let found=false;while(lo<=hi){const mid=lo+Math.floor((hi-lo)/2);add(a,`low=${lo}, high=${hi}, mid=${mid}, a[mid]=${a[mid]}. ${a[mid]===key?'Found!':key<a[mid]?'Key smaller: discard right half.':'Key larger: discard left half.'}`,[mid],{low:lo,high:hi,match:a[mid]===key});if(a[mid]===key){found=true;break;}if(key<a[mid])hi=mid-1;else lo=mid+1;}if(!found)add(a,`Search range became empty. ${key} is not present.`,[],{low:lo,high:hi});}
else if(type==='bubble'){add(a,'Bubble sort: compare adjacent neighbors and push larger values to the right.');for(let i=0;i<a.length-1;i++){let swaps=0;for(let j=0;j<a.length-i-1;j++){const bad=a[j]>a[j+1];add(a,`Pass ${i+1}: compare ${a[j]} and ${a[j+1]}. ${bad?'Out of order—swap.':'Already in order.'}`,[j,j+1]);if(bad){[a[j],a[j+1]]=[a[j+1],a[j]];swaps++;add(a,'Swap complete. The greater element has moved one spot right.',[j,j+1]);}}add(a,`End of pass ${i+1}: biggest remaining item is fixed at the right.`,[a.length-i-1]);if(!swaps){add(a,'No swaps occurred: the array is sorted. Stop early.');break;}}}
else if(type==='selection'){add(a,'Selection sort fixes one position per pass by finding the smallest remaining item.');for(let i=0;i<a.length-1;i++){let mi=i;for(let j=i+1;j<a.length;j++){add(a,`Pass ${i+1}: compare current minimum ${a[mi]} with ${a[j]}.`,[mi,j]);if(a[j]<a[mi]){mi=j;add(a,`New minimum found: ${a[mi]} at index ${mi}.`,[mi]);}}[a[i],a[mi]]=[a[mi],a[i]];add(a,`Put smallest remaining value at fixed position ${i}.`,[i]);}}
else if(type==='insertion'){add(a,'Insertion sort starts with first element sorted and grows the sorted prefix.');for(let i=1;i<a.length;i++){let item=a[i],j=i-1;add(a,`Save key ${item} from index ${i}.`,[i]);while(j>=0&&a[j]>item){a[j+1]=a[j];add(a,`Shift ${a[j]} one place right to make room for key ${item}.`,[j,j+1]);j--;}a[j+1]=item;add(a,`Insert key ${item} at index ${j+1}; prefix [0..${i}] is now sorted.`,[j+1]);}}
else if(type==='stack'){let st=[];add(st,'Empty stack: TOP = -1. Push inserts at the top.');for(const x of a){st.push(x);add(st,`Push ${x}: it becomes the new TOP.`,[st.length-1]);}while(st.length){const x=st.pop();add(st,`Pop ${x}: most recently pushed item leaves first. TOP moves down.`,[st.length-1]);}}
else if(type==='queue'){let qu=[];add(qu,'Empty queue. Enqueue at rear, dequeue at front.');for(const x of a){qu.push(x);add(qu,`Enqueue ${x} at REAR. The oldest value remains at FRONT.`,[qu.length-1]);}while(qu.length){const x=qu.shift();add(qu,`Dequeue ${x} from FRONT. Arrival order is preserved.`,[0]);}}
else if(type==='circular'){const cap=clamp(a.length+2,5,12);let slots=Array(cap).fill('·'),front=-1,rear=-1;add(slots,`Capacity ${cap}; front=-1 and rear=-1 means empty.`,[],{front,rear});for(const x of a){if((rear+1)%cap===front)break;rear=(rear+1)%cap;slots[rear]=x;if(front===-1)front=rear;add(slots,`Enqueue ${x} at rear=${rear}.`,[rear],{front,rear});}let shift=Math.min(3,a.length);for(let i=0;i<shift;i++){const v=slots[front],old=front;slots[front]='·';if(front===rear){front=rear=-1;}else front=(front+1)%cap;add(slots,`Dequeue ${v} at index ${old}; front moves to ${front}.`,[Math.max(0,front)],{front,rear});}for(const x of [91,92,93]){if((rear+1)%cap===front)break;rear=(rear+1)%cap;slots[rear]=x;if(front===-1)front=rear;add(slots,`Wrap and enqueue ${x} at rear=${rear}. Look at reused slots!`,[rear],{front,rear});}}
else if(type==='bst'){const inserted=[];add(inserted,'Start with empty tree. Each insert follows smaller → left; larger → right.',[],{tree:true});for(const x of a){let path='';if(inserted.length)path='Compare against existing BST nodes and follow correct branch. ';inserted.push(x);add(inserted,`${path}Insert ${x}.`,[x],{tree:true});}add(inserted,`BST inorder traversal yields sorted keys: ${Array.from(new Set(inserted)).sort((x,y)=>x-y).join(', ')}.`,[],{tree:true});}

function diagramTree(vals,active){const uniq=[];for(let v of vals)if(!uniq.includes(v))uniq.push(v);let root=null;for(const v of uniq){if(!root){root={v,left:null,right:null};continue;}let p=root;while(true){if(v<p.v){if(!p.left){p.left={v,left:null,right:null};break;}p=p.left;}else if(v>p.v){if(!p.right){p.right={v,left:null,right:null};break;}p=p.right;}else break;}}
let shapes=[];const walk=(n,x,y,width)=>{if(!n)return;if(n.left){const xx=x-width;shapes.push(`<path d="M${x},${y+14} L${xx},${y+80-14}" stroke="#5b7869" stroke-width="2"/>`);walk(n.left,xx,y+80,width*.56);}if(n.right){const xx=x+width;shapes.push(`<path d="M${x},${y+14} L${xx},${y+80-14}" stroke="#5b7869" stroke-width="2"/>`);walk(n.right,xx,y+80,width*.56);}shapes.push(`<circle cx="${x}" cy="${y}" r="19" fill="${active.includes(n.v)?'#f8be6a':'#d6e8d8'}" stroke="#26312a" stroke-width="2"/><text x="${x}" y="${y+5}" font-size="13" font-weight="800" text-anchor="middle" fill="#273329">${n.v}</text>`);};if(root)walk(root,400,32,175);return `<svg viewBox="0 0 800 350" style="width:100%;max-height:390px" role="img" aria-label="Binary search tree diagram">${shapes.join('')}</svg>`;}

const CHEATS=[
{unit:1,title:'Big O memory ladder',body:'O(1) direct access · O(log n) halve repeatedly · O(n) one scan · O(n log n) divide & combine · O(n²) double nested loops.',tip:'Insertion in middle of array shifts right (from end). Deletion shifts left.'},
{unit:2,title:'Search and sort speeds',body:'Linear O(n) worst; Binary O(log n) worst on SORTED data. Bubble optimized O(n)/O(n²); Selection O(n²) always; Insertion O(n) best and O(n²) worst; Merge O(n log n) always; Quick average O(n log n), worst O(n²).',tip:'For sorting answers, write ALL passes, not only final order.'},
{unit:3,title:'Pointer survival guide',body:'Node = data + next. Head is first. NULL ends singly list. Insert at head: new->next=head; head=new. Delete head: temp=head; head=head->next; free(temp).',tip:'Save a link before changing it; reconnect before freeing a node.'},
{unit:4,title:'Stack magic',body:'LIFO. top=-1 is empty; top==MAX-1 is full. Push at top, pop from top. Infix A+B*C → postfix ABC*+. Recursion requires a base case.',tip:'Postfix subtraction: pop right operand FIRST, then left operand.'},
{unit:5,title:'Queue pointers',body:'FIFO. Enqueue REAR; dequeue FRONT. Circular queue: wrap with %CAP; full when (rear+1)%CAP==front; empty sentinel front==-1.',tip:'Circular wrapping reuses slots; linked queue sets rear=NULL after deleting final node.'},

function prettyNotesMarkdown(source){
 const lines=escapeHtml(source||'').split('\n');let fenced=false;const out=[];
 const inline=t=>t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
 for(const line of lines){if(line.trim()==='```'){out.push(fenced?'</code></pre>':'<pre><code>');fenced=!fenced;continue;}if(fenced){out.push(line+'\n');continue;}if(/^### /.test(line))out.push('<h4>'+inline(line.slice(4))+'</h4>');else if(/^## /.test(line))out.push('<h3>'+inline(line.slice(3))+'</h3>');else if(/^# /.test(line))out.push('<h2>'+inline(line.slice(2))+'</h2>');else if(/^[-*] /.test(line))out.push('<div class="md-bullet">• '+inline(line.slice(2))+'</div>');else if(/^> /.test(line))out.push('<blockquote>'+inline(line.slice(2))+'</blockquote>');else if(!line.trim())out.push('<div style="height:12px"></div>');else out.push('<p>'+inline(line)+'</p>');}
 if(fenced)out.push('</code></pre>');return out.join('');
}

 case 'order-reset':initOrder();render();return;
 case 'bug-answer':{if(view.bugChoice!==null)return;view.bugChoice=i;const b=BUG_PUZZLES[view.bugIndex];const good=i===b.a;if(good){if(!db.challengeStats['bug'+view.bugIndex]){db.challengeStats['bug'+view.bugIndex]=true;addXp(20,'C bug squashed');}}else{db.bugMistakes=db.bugMistakes||{};db.bugMistakes[view.bugIndex]=(db.bugMistakes[view.bugIndex]||0)+1;touch();}render();return;}
 case 'bug-next':view.bugIndex=(view.bugIndex+1)%BUG_PUZZLES.length;view.bugChoice=null;render();return;
 case 'bug-restart':view.bugIndex=0;view.bugChoice=null;render();return;
 case 'lightning-start':initLightning();render();return;
 case 'lightning-answer':finishLightningChoice(i);return;
 case 'journal-bug':view.gameMode='bug';view.bugIndex=Number(el.dataset.index);view.bugChoice=null;goto('games');return;
 case 'journal-retry':launchExactQuestion(QUESTIONS.find(x=>x.id===el.dataset.qid));return;
 case 'journal-note':{const q=QUESTIONS.find(x=>x.id===el.dataset.qid);if(q){addNote(q.unit,`### Mistake Clinic · p.${q.page}\nQuestion: ${q.q}\nCorrect: ${q.opts[q.a]}\nWHY: ${q.why}\nMy mistake was: `);toast('Answer and explanation sent to Notes Studio.');}return;}
 case 'map-unit':view.mapUnit=Number(el.dataset.unit);render();return;
 case 'map-lesson':{const l=LESSONS.find(x=>x.id===el.dataset.lesson);if(l){view.unit=l.unit;view.lesson=l.id;goto('learn');}return;}
 case 'map-glossary':{const g=GLOSSARY.find(x=>x.id===Number(el.dataset.word));if(g)toast(`${g.term}: ${g.meaning}`);return;}
 case 'map-quiz':view.quizSettings={unit:String(view.mapUnit),count:20,difficulty:'all',type:'all'};startQuiz('practice');return;
 case 'note-preview':view.notePreview=!view.notePreview;render();return;
 default:return nativeAction(el);
 }
};
document.addEventListener('input',e=>{const x=e.target;
 if(x.id==='tb-search'){view.tbQuery=x.value;const results=$('tb-search-results');if(results)results.innerHTML=tbResultMarkup(x.value);}
 if(x.id==='tb-page-note'){db.pageNotes[view.tbPage]=x.value;db.noteEdits['p'+view.tbPage]=Date.now();touch();}
 if(x.id==='unit-notes'){db.noteEdits['u'+view.noteUnit]=Date.now();persist();}
});
document.addEventListener('change',e=>{const x=e.target;
 if(x.id==='match-unit'){initMatch(Number(x.value));render();}
 if(x.id==='order-puzzle'){initOrder(Number(x.value));render();}
 if(x.id==='journal-unit'){view.errorsUnit=x.value;render();}
});
document.addEventListener('keydown',e=>{if(e.altKey && view.name==='textbook'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){
 if(e.key==='ArrowLeft'){e.preventDefault();goTextbookPage(view.tbPage-1);}if(e.key==='ArrowRight'){e.preventDefault();goTextbookPage(view.tbPage+1);}}
});

touch();render();

</script></body></html>
