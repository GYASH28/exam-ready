    Node *p = head;\n        head = head->next;\n        free(p);\n    }\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"10 20 30\n10 30","k":"h"},{"t":"How the program works. Node **head  is the address of the head pointer: the function can change the caller’s actual head when it inserts or deletes the first node. The removal function checks p  before reading p->data , distinguishes head deletion from middle deletion, and frees only the removed node. At the end, a loop releases the remaining nodes. This is a complete example of the SLA Unit III pattern, which asks for a dynamically changing student waiting list.","k":"p"}]},{"p":26,"unit":3,"chapter":"Linked Lists","title":"3.5 Singly, doubly and circular lists","blocks":[{"t":"3.5 Singly, doubly and circular lists","k":"h"},{"t":"Doubly linked list","k":"h"},{"t":"A doubly linked list has prev  and next  pointers on each node. It supports movement in both directions and can simplify deletion when a pointer to the target node is known. In return, it consumes extra memory per node and requires more pointer updates. When inserting X between nodes A and B, update X->prev=A , X->next=B , then connect A->next=X  and B->prev=X  (checking for missing endpoints). An inconsistent update can break forward or backward traversal.","k":"p"},{"t":"Doubly linked operation\nLinks that change","k":"h"},{"t":"Insert X after A (B = A.next)\nX.prev = A, X.next = B, A.next = X, and B.prev = X if B exists","k":"p"},{"t":"Delete X between A and B\nA.next = B and B.prev = A; then free(X)","k":"h"},{"t":"Delete first node\nhead = oldHead.next; if head exists, head.prev = NULL","k":"p"},{"t":"Circular linked list","k":"h"},{"t":"In a circular singly linked list, the last node points back to the first node rather than to NULL . This suits repeated cycles, such as rotating jobs or turn-based games. However, a traversal cannot simply wait for NULL ; it needs a stopping rule, such as stopping when the current node returns to the head. For an empty circular list, head == NULL ; a one-node circular list has head->next == head . A doubly circular list has both forward and backward circular links.","k":"p"},{"t":"F I G U R E  —  C I R C U L A R  S I N G LY L I S T:  T H E  L A S T L I N K  R E T U R N S  TO  H E A D","k":"p"},{"t":"head","k":"h"},{"t":"1\nnext\n2\nnext\n3\nnext","k":"p"},{"t":"HEAD","k":"h"},{"t":"For circular traversal, make a full cycle exactly once; a NULL-terminated loop would not stop.","k":"p"},{"t":"3.6 Array versus linked list","k":"h"},{"t":"Question\nArray\nLinked list","k":"p"},{"t":"Memory layout\nElements adjacent in memory\nNodes allocated separately","k":"p"}]},{"p":27,"unit":3,"chapter":"Linked Lists","title":"A SUBTLE BUT IMPORTANT EXAM POINT","blocks":[{"t":"Question\nArray\nLinked list","k":"p"},{"t":"Random indexing\nO(1)\nO(n) to reach a position","k":"p"},{"t":"Head insertion\nO(n) shifting\nO(1) with head pointer","k":"p"},{"t":"Search by value\nO(n) unsorted\nO(n)","k":"p"},{"t":"Extra pointer memory\nNone per element\nOne or more pointers per node","k":"p"},{"t":"Resize\nMay require allocating/copying new array\nAdd or delete nodes dynamically","k":"p"},{"t":"A SUBTLE BUT IMPORTANT EXAM POINT","k":"h"},{"t":"It is incorrect to claim linked-list insertion is always O(1). Inserting at the head is O(1), but appending without a tail\npointer or searching for the correct position can be O(n). State the conditions attached to a complexity claim.","k":"p"},{"t":"Exam answers: Unit 3","k":"h"},{"t":"Q1. Define linked list and explain its representation with a diagram.","k":"h"},{"t":"A linked list is a linear structure in which each element is a node containing data and a link to another node. In a singly linked list, head  refers to the first node, each next  pointer refers to its successor, and the last next  is NULL . The nodes need not be contiguous in memory. Example: head → [10|next] → [20|next] → [30|NULL] . It supports dynamic growth but direct access to an arbitrary position takes sequential traversal.","k":"p"},{"t":"Examiner expects: Draw HEAD, data/link compartments, arrows and NULL.","k":"p"},{"t":"Q2. Explain malloc and free in linked-list operations.","k":"h"},{"t":"malloc(sizeof(Node))  reserves memory for a node during execution and returns its address, or NULL","k":"code"},{"t":"on failure. After initialization, links connect the new node into the list. free(p)  releases a removed node's dynamically allocated storage. Before freeing, reconnect neighboring links so the remainder of the list stays reachable. Failing to free unused nodes can cause memory leaks; using a pointer after freeing can cause undefined behavior.","k":"p"},{"t":"Examiner expects: `stdlib.h`, failed allocation, free after unlinking.","k":"p"}]},{"p":28,"unit":3,"chapter":"Linked Lists","title":"Q3. Write the steps to insert or delete a node at the beginning.","blocks":[{"t":"Q3. Write the steps to insert or delete a node at the beginning.","k":"h"},{"t":"Insertion: allocate X, assign the new value, set X->next = head , and update head = X . Deletion: if head == NULL , report empty; otherwise store the old head in temp , advance head = head->next , and free(temp) . Both operations are O(1)  because no search or traversal is needed.","k":"p"},{"t":"Examiner expects: Include the empty-list case and order of pointer assignments.","k":"p"},{"t":"Q4. Differentiate singly, doubly and circular linked lists.","k":"h"},{"t":"A singly list has one link ( next ) per node and generally traverses forward. A doubly list has prev  and next , allowing bidirectional traversal at extra storage cost. A circular singly list links the last node back to the first, forming a cycle; traversal must stop on return to the start, not on NULL . A doubly circular list combines backward links with circularity.","k":"p"},{"t":"Examiner expects: Specify how the last pointer behaves in each case.","k":"p"},{"t":"Q5. Explain why a linked list may be preferred to an array.","k":"h"},{"t":"When records are inserted or removed frequently, linked nodes can avoid shifting all later elements in memory. The list can also grow by allocating nodes as needed. However, each node consumes pointer storage, and arbitrary indexing takes a traversal. Therefore it is suitable for a changing waiting list or playlist, but an array may be better for frequent index-based access.","k":"p"},{"t":"Examiner expects: Show both advantage and limitation rather than calling one universally better.","k":"p"},{"t":"Pointer check","k":"h"},{"t":"If you delete the head, what must happen to HEAD? If you insert after node P, which link is changed first? If the list","k":"p"},{"t":"is circular, why is while (p != NULL)  dangerous?","k":"code"}]},{"p":29,"unit":4,"chapter":"Stacks & Recursion","title":"Stacks & recursion","blocks":[{"t":"Stacks & recursion","k":"h"},{"t":"Why the most recent item must be handled first.","k":"p"},{"t":"COURSE R23CI2602 \n·\n PRIMARY SOURCE: 18-PAGE UNIT 4 NOTES & ASSIGNMENT 4","k":"p"},{"t":"T H E  C E N T R A L I D E A","k":"h"},{"t":"Think about Undo in a text editor. You type A, then B, then C. When you press Undo once, C\ndisappears—not A. That is the Last In, First Out rule. The Unit 4 assignment goes beyond basic\nPush and Pop: it asks for overflow, underflow, linked implementations, infix/postfix notation,\npostfix evaluation and recursion. These topics all connect through the same idea: the latest\nunfinished work sits on top.","k":"p"},{"t":"4.1 Stack as an ADT: one accessible end","k":"h"},{"t":"A stack is a linear data structure that follows LIFO: the last item added is the first removed. Its main operations are push(x)  (add to top), pop()  (remove top), peek()  or top()  (read top without removing), isEmpty()  and, for a fixed-capacity implementation, isFull() .","k":"p"},{"t":"Unlike a queue, a stack performs insertion and deletion at the same end, called TOP. The order of stored items is not automatically sorted. You can implement the stack using an array or a linked list; both must obey the same LIFO behavior. The ADT is the promise of behavior, not the choice of memory layout.","k":"p"}]},{"p":30,"unit":4,"chapter":"Stacks & Recursion","title":"F I G U R E  —  TO P CO N T R O L S  B OT H  E N T RY A N D  E X I T","blocks":[{"t":"F I G U R E  —  TO P CO N T R O L S  B OT H  E N T RY A N D  E X I T","k":"h"},{"t":"TOP\npush ↓/ pop ↑","k":"h"},{"t":"After push(10), push(20), push(30), a pop returns 30 first.","k":"p"},{"t":"4.2 Array implementation: top = −1 means empty","k":"h"},{"t":"For an array stack of capacity MAX , initialize top = -1 . The first push increases top  from −1 to 0, then stores the item at index 0. Before any push, check top == MAX-1 : there is no free array position, so an additional push causes overflow. Before pop, check top == -1 : there is no item to remove, so pop causes underflow.","k":"p"},{"t":"A subtle point: if top=2 , the top item is stack[2] , not stack[3] ; there are three items in the stack. peek  reads stack[top]  without changing top . A successful push or pop uses constant time O(1) , because no traversal is needed.","k":"p"},{"t":"Action\ntop before\ntop after\nStack bottom → top","k":"p"},{"t":"Initialize\n—\n−1\nempty","k":"p"},{"t":"push(10)\n−1\n0\n10","k":"p"},{"t":"push(20)\n0\n1\n10, 20","k":"p"},{"t":"push(30)\n1\n2\n10, 20, 30","k":"p"},{"t":"peek()\n2\n2\n10, 20, 30; returns 30","k":"p"},{"t":"pop()\n2\n1\n10, 20; returns 30","k":"p"}]},{"p":31,"unit":4,"chapter":"Stacks & Recursion","title":"PROGRAM 11 / C99","blocks":[{"t":"PROGRAM 11 / C99\nArray stack with overflow and underflow","k":"h"},{"t":"#include <stdio.h>\n#define MAX 3\nint stack[MAX], top = -1;\nvoid push(int x) {\n    if (top == MAX - 1) {\n        puts(\"Overflow\"); return;\n    }\n    stack[++top] = x;\n}\nvoid pop(void) {\n    if (top == -1) {\n        puts(\"Underflow\"); return;\n    }\n    printf(\"Removed %d\\n\", stack[top--]);\n}\nint main(void) {\n    push(10); push(20); push(30);\n    push(40);\n    pop(); pop(); pop(); pop();\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"Overflow\nRemoved 30\nRemoved 20\nRemoved 10\nUnderflow","k":"p"},{"t":"How the program works. ++top  increments before storage, ensuring the first item goes to index 0. top--  reads the existing top item before decrementing the index. Attempts to exceed capacity or remove from an empty stack print an error and leave the valid elements unchanged. Output also demonstrates that 30 leaves before 20 or 10.","k":"p"},{"t":"4.3 Linked stack: the head acts as top","k":"h"},{"t":"A linked stack has a node pointer called top . To push a new node X, set X->next = top , then update top = X . To pop, save the current top in temp , advance top = top->next , read the old value and free temp . Both are O(1)  because we operate only at the first node. A linked stack does not have a fixed declared array capacity, but allocation can still fail if memory is exhausted.","k":"p"},{"t":"An array stack has predictable storage and simple indexing. A linked stack grows node by node but spends extra pointer memory per item and uses dynamic allocation. The correct comparison is not just 'fixed versus dynamic'; state how overflow differs, why both push and pop are constant time, and which implementation has better memory locality.","k":"p"}]},{"p":32,"unit":4,"chapter":"Stacks & Recursion","title":"PROGRAM 12 / C99","blocks":[{"t":"PROGRAM 12 / C99\nLinked-list stack","k":"h"},{"t":"#include <stdio.h>\n#include <stdlib.h>\ntypedef struct Node {\n    int data;\n    struct Node *next;\n} Node;\nNode *top = NULL;\nvoid push(int x) {\n    Node *p = malloc(sizeof(Node));\n    if (p == NULL) exit(1);\n    p->data = x;\n    p->next = top;\n    top = p;\n}\nvoid pop(void) {\n    if (top == NULL) { puts(\"Empty\"); return; }\n    Node *p = top;\n    printf(\"Popped %d\\n\", p->data);\n    top = top->next;\n    free(p);\n}\nint main(void) {\n    push(7); push(8); push(9);\n    pop(); pop(); pop(); pop();\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"Popped 9\nPopped 8\nPopped 7\nEmpty","k":"p"},{"t":"How the program works. top  points to the newest node. push  links the newcomer ahead of the former top, so it becomes the first node. pop  frees the former top only after saving the next address. Because neither operation scans to the end, each is O(1)  time. This is the linked implementation requested in the Unit 4 assignment.","k":"p"},{"t":"4.4 Infix, prefix and postfix notation","k":"h"},{"t":"A mathematical expression can be written in three major notations. Infix places an operator between operands: A + B . Prefix (Polish notation) puts the operator before operands: + A B . Postfix (Reverse Polish) puts the operator after: A B + . Prefix and postfix express the operation order without needing brackets when operators have known arities. A stack makes conversions and postfix evaluation convenient.","k":"p"},{"t":"Meaning\nInfix\nPrefix\nPostfix","k":"p"},{"t":"Add two values\nA + B\n+ A B\nA B +","k":"p"},{"t":"Multiply A and B, then add C\n(A × B) + C\n+ × A B C\nA B × C +","k":"p"}]},{"p":33,"unit":4,"chapter":"Stacks & Recursion","title":"Converting infix to postfix: decision rules","blocks":[{"t":"Meaning\nInfix\nPrefix\nPostfix","k":"p"},{"t":"Add B and C, then multiply A\nA × (B + C)\n× A + B C\nA B C + ×","k":"p"},{"t":"Converting infix to postfix: decision rules","k":"h"},{"t":"Read an infix expression from left to right. Send an operand directly to output. Push an opening bracket onto the operator stack. On a closing bracket, pop operators until the matching opening bracket. When an operator arrives, pop operators already on the stack that have higher precedence—or equal precedence for typical left-associative operators—then push the new operator. At the end, pop the remaining operators. These rules depend on precedence and associativity; ^  is commonly treated as right-associative, unlike + , - , *  and / .","k":"p"},{"t":"Example: A+B*C . The output begins with A; +  is pushed; B goes to output; *  has higher precedence than + , so it is pushed; C goes to output; finally the stack is popped to give A B C * + .","k":"p"},{"t":"Read token\nOperator stack (bottom → top)\nOutput","k":"p"},{"t":"A\nempty\nA","k":"p"},{"t":"+\n+\nA","k":"p"},{"t":"B\n+\nA B","k":"p"},{"t":"*\n+ *\nA B","k":"p"},{"t":"C\n+ *\nA B C","k":"p"},{"t":"End\nempty\nA B C * +","k":"p"},{"t":"Postfix evaluation using a stack","k":"h"},{"t":"Scan a postfix expression from left to right. If the token is a number, push it. If it is an operator, pop two operands: the first popped value is the right operand, and the second popped value is the left operand. Compute left operator right  and push the answer. At the end, exactly one result should remain. Order matters: for 9 4 - , the result is 9 - 4 = 5 , not 4 - 9 .","k":"p"},{"t":"Token\nOperation\nStack bottom → top","k":"p"},{"t":"2\nPush 2\n2","k":"p"},{"t":"3\nPush 3\n2, 3","k":"p"},{"t":"1\nPush 1\n2, 3, 1","k":"p"},{"t":"*\n3 × 1 = 3\n2, 3","k":"p"},{"t":"+\n2 + 3 = 5\n5","k":"p"}]},{"p":34,"unit":4,"chapter":"Stacks & Recursion","title":"PROGRAM 13 / C99","blocks":[{"t":"Token\nOperation\nStack bottom → top","k":"p"},{"t":"9\nPush 9\n5, 9","k":"p"},{"t":"-\n5 − 9 = −4\n−4","k":"p"},{"t":"PROGRAM 13 / C99\nEvaluate a single-digit postfix expression","k":"h"},{"t":"#include <stdio.h>\n#include <ctype.h>\nint main(void) {\n    char expr[] = \"231*+9-\";\n    int st[30], top = -1;\n    for (int i = 0; expr[i] != '\\0'; i++) {\n        char c = expr[i];\n        if (isdigit((unsigned char)c)) {\n            st[++top] = c - '0';\n        } else {\n            int right = st[top--];\n            int left = st[top--];\n            int result = 0;\n            if (c == '+') result = left + right;\n            if (c == '-') result = left - right;\n            if (c == '*') result = left * right;\n            st[++top] = result;\n        }\n    }\n    printf(\"Answer = %d\\n\", st[top]);\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"Answer = -4","k":"h"},{"t":"How the program works. Characters '0'  through '9'  represent digits; subtracting '0'  converts a digit character to its integer value. The code handles a valid postfix expression made of single-digit operands and + , - , * ; it is a teaching implementation rather than a general parser. The pop order is right then left. The worked expression equals 2 + (3 × 1) - 9 = -4 .","k":"p"},{"t":"WHEN CODE MUST BE MODIFIED","k":"h"},{"t":"For multi-digit numbers, input must be tokenized instead of reading one character at a time. For division, check that\nthe right operand is not zero. For invalid postfix input, check stack size before each pop. Those checks matter in\nproduction code, but the small example above isolates the stack principle.","k":"p"},{"t":"4.5 Recursion and the call stack","k":"h"},{"t":"Recursion occurs when a function solves a smaller version of its own problem by calling itself. Every recursive solution needs a base case that stops further calls and a recursive step that moves toward that base case. When the function is called, its local variables and return information are held in a call frame","k":"p"}]},{"p":35,"unit":4,"chapter":"Stacks & Recursion","title":"Call on the way down","blocks":[{"t":"on the program's call stack. The last call completes first; then the previous waiting call resumes. This is LIFO behavior again.","k":"p"},{"t":"Take factorial 4! = 4 × 3 × 2 × 1 = 24 . fact(4)  waits for fact(3) , which waits for fact(2) , which waits for fact(1) . At fact(1)  the base case returns 1; then the waiting calls complete in reverse order: fact(2)=2 , fact(3)=6 , fact(4)=24 . If the argument never moves closer to a base case, recursion can continue until stack space is exhausted.","k":"p"},{"t":"Call on the way down\nReturn on the way up","k":"h"},{"t":"fact(4) calls fact(3)\nfact(1) returns 1","k":"h"},{"t":"fact(3) calls fact(2)\nfact(2) returns 2 × 1 = 2","k":"h"},{"t":"fact(2) calls fact(1)\nfact(3) returns 3 × 2 = 6","k":"h"},{"t":"fact(1) is the base case\nfact(4) returns 4 × 6 = 24","k":"h"},{"t":"PROGRAM 14 / C99\nRecursive factorial and base case","k":"h"},{"t":"#include <stdio.h>\nlong long fact(int n) {\n    if (n <= 1) return 1;\n    return n * fact(n - 1);\n}\nint main(void) {\n    printf(\"4! = %lld\\n\", fact(4));\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"4! = 24","k":"h"},{"t":"How the program works. fact(n-1)  is a smaller instance of the same problem. The base case n <= 1 stops the chain, and each waiting multiplication completes as control returns. The number of active call frames is proportional to n , giving O(n)  stack space and O(n)  time for this straightforward implementation. The program assumes a small nonnegative input; factorial rapidly overflows fixed-width integer types.","k":"p"},{"t":"Where stacks and recursion are used","k":"h"},{"t":"The source notes identify expression handling, recursion, function calls, Undo/Redo, backtracking and depth-first search as key uses. In a web browser, a Back-history can be modeled with a stack; in a maze, backtracking saves unfinished choices; in parsing, operators wait on a stack until precedence rules allow them to be processed. When answering, name the LIFO reason, not only the application name.","k":"p"}]},{"p":36,"unit":4,"chapter":"Stacks & Recursion","title":"Exam answers: Unit 4","blocks":[{"t":"Exam answers: Unit 4","k":"h"},{"t":"Q1. Define a stack and explain Push, Pop, Peek and Display.","k":"h"},{"t":"A stack is a linear ADT that permits insertion and deletion from one end, TOP, and follows LIFO. push(x)  inserts x at TOP; pop()  removes and returns TOP; peek()  reads TOP without removing it; display()  visits stored items for presentation. In an array stack, top  starts at −1; pushing increments it and popping decrements it. The basic updates are O(1) ; displaying all n  items is O(n) .","k":"p"},{"t":"Examiner expects: Show a labelled top arrow and one push/pop example.","k":"p"},{"t":"Q2. What are overflow and underflow?","k":"h"},{"t":"Overflow occurs when the program tries to push into a full fixed-capacity stack; the array test is top == MAX-1 . Underflow occurs when it tries to pop from an empty stack; the test is top == -1 . Operations must check these conditions before changing the stack, otherwise they may read or write invalid memory.","k":"p"},{"t":"Examiner expects: Mention the exact C array conditions.","k":"p"},{"t":"Q3. Explain infix to postfix conversion for A+B*C.","k":"h"},{"t":"Send operands directly to output and temporarily hold operators on a stack. A higher-precedence operator, such as multiplication, waits above a lower-precedence addition operator. With A+B*C, output A, push +, output B, push *, output C, then pop * and + at the end. The resulting postfix expression is ABC*+ , which represents A+(B*C) .","k":"p"},{"t":"Examiner expects: Show operator stack and output for several steps.","k":"p"},{"t":"Q4. Evaluate postfix 2 3 1 * + 9 - using a stack.","k":"h"},{"t":"Push 2, 3 and 1. On * , pop 1 and 3, compute 3×1=3 , push 3, leaving [2,3] . On + , pop 3 and 2, compute 5, push it. Push 9. On - , pop right operand 9 and left operand 5, compute 5−9=−4 . The final answer is −4. A valid complete expression leaves exactly one result.","k":"p"},{"t":"Examiner expects: Reverse pop order is a common lost mark.","k":"p"},{"t":"Q5. Explain recursion and how it uses the stack.","k":"h"},{"t":"Recursion means a function calls itself on a smaller problem. Each call creates an activation record with local state and return information on the call stack. The most recent call completes first and returns to its caller, following LIFO. A correct recursive function has a base case and a step toward it. For factorial, fact(4)  depends on fact(3)  until fact(1)  returns; the outstanding multiplications then finish in reverse order.","k":"p"},{"t":"Examiner expects: Base case, recursive step, nested calls, return unwind.","k":"p"}]},{"p":37,"unit":4,"chapter":"Stacks & Recursion","title":"Stack check","blocks":[{"t":"Stack check","k":"h"},{"t":"What is the value of TOP after three pushes from an empty array stack? Why must postfix subtraction pop right operand first? What happens if a recursive function never reaches its base case?","k":"p"}]},{"p":38,"unit":5,"chapter":"Queues","title":"T H E  C E N T R A L I D E A","blocks":[{"t":"Queues","k":"h"},{"t":"When arrival order—not recency—decides who receives service\nnext.","k":"p"},{"t":"COURSE R23CI2602 \n·\n PRIMARY SOURCE: UNIT 5 TEACHER PPT & ASSIGNMENT 5","k":"p"},{"t":"T H E  C E N T R A L I D E A","k":"h"},{"t":"A canteen should serve the student who joined the line first. A printer processes the oldest waiting\njob first. Both are examples of First In, First Out (FIFO). A queue adds at the rear and removes\nfrom the front. That is the central rule behind every implementation in the Unit 5 teacher\npresentation: array queues, linked queues, circular queues, priority queues and deques.","k":"p"},{"t":"5.1 The queue ADT and its two ends","k":"h"},{"t":"A queue is a linear ADT whose ordinary behavior follows FIFO. The supported operations include enqueue(x)  or insert (add x at REAR), dequeue()  or delete (remove FRONT), front() / peek()  (read first item), and isEmpty() . Depending on implementation, isFull()  checks capacity.","k":"p"},{"t":"The distinction from stacks is not merely the number of arrows in a drawing. In a stack, both updates happen at the same end, giving LIFO. In a queue, updates happen at opposite ends: later arrivals must not overtake earlier arrivals in an ordinary FIFO queue.","k":"p"}]},{"p":39,"unit":5,"chapter":"Queues","title":"FRONT / REMOVE","blocks":[{"t":"F I G U R E  —  Q U E U E :  N E W  E L E M E N T S  E N T E R  F R O M  R E A R ,  O L D  E L E M E N T S  L E AV E  F R O M  F R O N T","k":"p"},{"t":"FRONT / REMOVE\nREAR / ADD","k":"h"},{"t":"11\n22\n33\n44","k":"p"},{"t":"11 is the oldest entry. It is removed before 22, 33 or 44.","k":"p"},{"t":"5.2 Linear array queue: front and rear","k":"h"},{"t":"A simple linear array queue stores values in a fixed array and tracks the first and last occupied indexes using front  and rear . Initially front = rear = -1 . On the first insertion, set front = 0  and increment rear to store the new value. On deletion, advance front. When the last element is removed, reset both indexes to −1, marking the queue empty.","k":"p"},{"t":"For a linear queue with size MAX , overflow is typically tested by rear == MAX-1 . Empty condition is front == -1  in the implementation below. Enqueue and dequeue take O(1)  time because they update a constant number of indexes. However, a linear queue can suffer false overflow: even after several front elements are deleted, the unused positions at the beginning cannot be reused until the queue is reset or elements are shifted.","k":"p"},{"t":"Step\nfront\nrear\nPhysical array of size 5","k":"p"},{"t":"empty\n−1\n−1\n_, _, _, _, _","k":"p"},{"t":"add 10, 20, 30\n0\n2\n10, 20, 30, _, _","k":"p"},{"t":"delete twice\n2\n2\n10, 20, 30, _, _ (only 30 active)","k":"p"},{"t":"add 40, 50\n2\n4\n10, 20, 30, 40, 50","k":"p"},{"t":"try add 60\n2\n4\nRejected: rear is already 4","k":"p"},{"t":"Notice the final row: indexes 0 and 1 are no longer logically occupied, yet the linear array implementation cannot reuse them. This is not because all five active slots are full—only three active items remain. A circular queue fixes that wasted-space problem.","k":"p"}]},{"p":40,"unit":5,"chapter":"Queues","title":"PROGRAM 15 / C99","blocks":[{"t":"PROGRAM 15 / C99\nLinear queue using an array","k":"h"},{"t":"#include <stdio.h>\n#define MAX 4\nint q[MAX], front = -1, rear = -1;\nvoid enqueue(int x) {\n    if (rear == MAX - 1) {\n        puts(\"Queue full\"); return;\n    }\n    if (front == -1) front = 0;\n    q[++rear] = x;\n}\nvoid dequeue(void) {\n    if (front == -1) {\n        puts(\"Queue empty\"); return;\n    }\n    printf(\"Served %d\\n\", q[front++]);\n    if (front > rear) front = rear = -1;\n}\nint main(void) {\n    enqueue(10); enqueue(20); enqueue(30);\n    dequeue(); dequeue(); dequeue(); dequeue();\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"Served 10\nServed 20\nServed 30\nQueue empty","k":"p"},{"t":"How the program works. On a new insertion, the first active element is established with front = 0 . On successful deletion, the front index increases. When the queue becomes empty, resetting both indexes allows the next batch of insertions to start from the beginning. This is a straightforward array implementation of the linear-queue operations in the teacher slides.","k":"p"},{"t":"5.3 Circular queue: reuse free slots","k":"h"},{"t":"A circular queue conceptually connects the last array slot back to the first. If the capacity is MAX , moving an index forward means (index + 1) % MAX . For example, with MAX=5 , moving after index 4 gives (4+1)%5 = 0 . That is the wrap-around operation.","k":"p"},{"t":"The implementation must distinguish empty from full. One common representation starts with front = rear = -1 : empty when front == -1 , and full when (rear + 1) % MAX == front . On the first insertion, set both to 0. During deletion, if front equals rear, removing that item empties the queue and both indexes reset to −1; otherwise advance front modulo MAX .","k":"p"},{"t":"Event\nfront\nrear\nActive order","k":"p"},{"t":"Insert A, B, C, D into size 5\n0\n3\nA → B → C → D","k":"p"},{"t":"Remove A and B\n2\n3\nC → D","k":"p"}]},{"p":41,"unit":5,"chapter":"Queues","title":"FORMULA TO MEMORIZE","blocks":[{"t":"Event\nfront\nrear\nActive order","k":"p"},{"t":"Insert E at slot 4\n2\n4\nC → D → E","k":"p"},{"t":"Insert F at wrapped slot 0\n2\n0\nC → D → E → F","k":"p"},{"t":"Next rear position is front?\n2\n0\nNo: `(0+1)%5=1` is free","k":"p"},{"t":"Insert G at slot 1\n2\n1\nC → D → E → F → G (full)","k":"p"},{"t":"FORMULA TO MEMORIZE","k":"h"},{"t":"Next array position = `(current + 1) % MAX`. Circular queue full = `(rear + 1) % MAX == front`. Circular queue\nempty = `front == -1` for the representation in this chapter. Alternative queue implementations use different sentinels;\nmatch the code and its stated conditions.","k":"p"},{"t":"PROGRAM 16 / C99\nCircular queue using an array","k":"h"},{"t":"#include <stdio.h>\n#define MAX 4\nint q[MAX], front = -1, rear = -1;\nint full(void) {\n    return front != -1 && (rear + 1) % MAX == front;\n}\nvoid enqueue(int x) {\n    if (full()) { puts(\"Full\"); return; }\n    if (front == -1) front = rear = 0;\n    else rear = (rear + 1) % MAX;\n    q[rear] = x;\n}\nvoid dequeue(void) {\n    if (front == -1) { puts(\"Empty\"); return; }\n    printf(\"Removed %d\\n\", q[front]);\n    if (front == rear) front = rear = -1;\n    else front = (front + 1) % MAX;\n}\nint main(void) {\n    enqueue(1); enqueue(2); enqueue(3);\n    dequeue(); dequeue();\n    enqueue(4); enqueue(5); enqueue(6);\n    dequeue(); dequeue(); dequeue(); dequeue();\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"Removed 1\nRemoved 2\nRemoved 3\nRemoved 4\nRemoved 5\nRemoved 6","k":"p"},{"t":"How the program works. A free front slot can be reused after the rear wraps from the final index to 0. Before insertion, full()  checks whether the next rear position would collide with the front. The single-","k":"p"}]},{"p":42,"unit":5,"chapter":"Queues","title":"5.4 Linked queue: use nodes rather than shifting","blocks":[{"t":"element case is handled by resetting both markers after deletion. All updates take O(1)  time; the queue stores at most MAX  values.","k":"p"},{"t":"5.4 Linked queue: use nodes rather than shifting","k":"h"},{"t":"A linked queue uses two pointers: front  to the oldest node and rear  to the newest node. Enqueue allocates a node and attaches it at rear->next . When adding the very first element, both front and rear point to that new node. Dequeue removes the front node, advances front to front->next , and frees the old node. If that was the last node, rear must also become NULL .","k":"p"},{"t":"With both pointers maintained, enqueue and dequeue are O(1) . This is the major reason to keep rear : without it, adding at the end would require a traversal. The nodes use extra pointer memory, and malloc  can fail even when the programmer has not declared a fixed queue capacity.","k":"p"},{"t":"PROGRAM 17 / C99\nLinked queue with front and rear pointers","k":"h"},{"t":"#include <stdio.h>\n#include <stdlib.h>\ntypedef struct Node {\n    int data;\n    struct Node *next;\n} Node;\nNode *front = NULL, *rear = NULL;\nvoid enqueue(int x) {\n    Node *p = malloc(sizeof(Node));\n    if (p == NULL) exit(1);\n    p->data = x;\n    p->next = NULL;\n    if (rear == NULL) front = rear = p;\n    else { rear->next = p; rear = p; }\n}\nvoid dequeue(void) {\n    if (front == NULL) { puts(\"Empty\"); return; }\n    Node *p = front;\n    printf(\"Served %d\\n\", p->data);\n    front = p->next;\n    if (front == NULL) rear = NULL;\n    free(p);\n}\nint main(void) {\n    enqueue(101); enqueue(102);\n    dequeue(); dequeue(); dequeue();\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"Served 101\nServed 102\nEmpty","k":"p"},{"t":"How the program works. front  points to the first element to be removed; rear  points to the last element where new nodes are linked. The first enqueue must initialize both pointers. The last dequeue resets rear to NULL  so that a later enqueue does not write through a dangling tail pointer. This addresses a common implementation bug.","k":"p"}]},{"p":43,"unit":5,"chapter":"Queues","title":"5.5 Priority queues and deques","blocks":[{"t":"5.5 Priority queues and deques","k":"h"},{"t":"Priority queue","k":"h"},{"t":"A priority queue serves elements according to a priority rule, not necessarily their arrival order. For example, a hospital triage system may process urgent cases before routine cases. If two items have the same priority, a design may preserve arrival order, but this is an additional rule, not guaranteed by the name priority queue itself. It can be implemented with arrays, linked lists or heaps. Unlike an ordinary FIFO queue, the next item is the one with highest/lowest designated priority rather than simply the oldest.","k":"p"},{"t":"Double-ended queue (deque)","k":"h"},{"t":"A deque supports insertion and removal at both front and rear. A normal queue limits insertion to rear and deletion to front; a deque relaxes both ends. An input-restricted deque limits insertion to one end but permits deletion at both. An output-restricted deque permits insertion at both ends but limits deletion to one end. The word deque is pronounced roughly \"deck\" and is distinct from a double queue consisting of two unrelated queues.","k":"p"},{"t":"Queue type\nWhere insert?\nWhere delete?\nMain use","k":"p"},{"t":"Linear FIFO\nRear\nFront\nService line","k":"p"},{"t":"Circular FIFO\nRear with wraparound\nFront with wraparound\nFixed-size reusable buffer","k":"p"},{"t":"Priority\nDepends on implementation\nHighest priority next\nUrgent tasks","k":"p"},{"t":"Deque\nBoth ends\nBoth ends\nFlexible front/back operations","k":"p"},{"t":"Exam answers: Unit 5","k":"h"},{"t":"Q1. Define queue as an ADT and explain operations.","k":"h"},{"t":"A queue is a linear ADT following FIFO. Insertion (enqueue) happens at REAR; deletion (dequeue) happens at FRONT. Peek examines the front element without removing it; isEmpty checks whether any item is present. In an array implementation, front and rear are integer indexes, while in a linked implementation they are pointers. The structure is useful for canteen lines, printer jobs and task scheduling.","k":"p"},{"t":"Examiner expects: Explain opposite ends and show FRONT/REAR in a diagram.","k":"p"}]},{"p":44,"unit":5,"chapter":"Queues","title":"Q2. What is false overflow in a linear array queue?","blocks":[{"t":"Q2. What is false overflow in a linear array queue?","k":"h"},{"t":"In a simple linear array queue, rear increases as elements are inserted and does not wrap around. After front elements are deleted, their old positions remain unused. If rear reaches MAX−1 , another enqueue may be rejected even though vacant positions exist before front. This is false overflow or wasted space. A circular queue reuses positions using modulo arithmetic.","k":"p"},{"t":"Examiner expects: Show a five-slot array with front advanced.","k":"p"},{"t":"Q3. Explain circular queue conditions and advantages.","k":"h"},{"t":"In a circular array queue with front=rear=-1  for empty, the queue is full when (rear+1)%MAX == front . The next rear position is (rear+1)%MAX , and the next front position is (front+1)%MAX . Wrapping back to zero reuses slots emptied by earlier dequeues, avoiding the wasted-space problem of a linear array queue. Enqueue/dequeue remain O(1)  time.","k":"p"},{"t":"Examiner expects: Write the exact modulo expressions and distinguish full from empty.","k":"p"},{"t":"Q4. Explain representation of queue using linked list.","k":"h"},{"t":"Each node stores data  and next . front  points to the oldest item, and rear  to the newest. Enqueue attaches a new node after rear; dequeue advances front and frees the old first node. When the queue has one item, both pointers refer to the same node. After deleting it, both become NULL . Maintaining rear makes enqueue O(1) ; deletion from front is also O(1) .","k":"p"},{"t":"Examiner expects: Explain both pointer updates for an empty or one-node queue.","k":"p"},{"t":"Q5. Differentiate normal queue, circular queue, priority queue and deque.","k":"h"},{"t":"A normal queue processes items in arrival order using FIFO. A circular queue preserves FIFO while using wraparound array indexing to reuse storage. A priority queue selects the item with the appropriate priority before lower-priority items, potentially breaking strict arrival order. A deque permits insertion and deletion at both ends. They solve different scheduling or storage problems; their behavior should be stated before implementation details.","k":"p"},{"t":"Examiner expects: Describe operation rules and give one application each.","k":"p"},{"t":"Queue check","k":"h"},{"t":"Which end changes on enqueue? Why can a linear queue report full with unused array cells? After removing the","k":"p"},{"t":"sole node from a linked queue, which pointers must be reset?","k":"h"}]},{"p":45,"unit":6,"chapter":"Trees","title":"T H E  C E N T R A L I D E A","blocks":[{"t":"Trees","k":"h"},{"t":"Hierarchies, search paths and three ways to walk through every\nnode.","k":"p"},{"t":"COURSE R23CI2602 \n·\n PRIMARY SOURCE: 28-PAGE UNIT 6 NOTES & ASSIGNMENT 6","k":"p"},{"t":"T H E  C E N T R A L I D E A","k":"h"},{"t":"A family tree, a folder hierarchy and an organization chart all have a root and branches. A tree\nrepresents such relationships. It is a non-linear structure: a node can have more than one child. A \nbinary tree limits each node to at most two children; a binary search tree adds an ordering rule that\ncan make searches much faster when the shape remains balanced. Unit 6 notes and assignment\nfocus on definitions, tree types, traversals, binary search trees, expression trees and heaps.","k":"p"}]},{"p":46,"unit":6,"chapter":"Trees","title":"6.1 Start with the vocabulary","blocks":[{"t":"6.1 Start with the vocabulary","k":"h"},{"t":"F I G U R E  —  B I N A RY T R E E  W I T H  S E V E N  N O D E S","k":"h"},{"t":"30\n70","k":"h"},{"t":"20\n40\n60\n80","k":"p"},{"t":"Root 50 has two child subtrees. The leaves are 20, 40, 60 and 80.","k":"p"},{"t":"Term\nMeaning in the example above","k":"h"},{"t":"Root\n50: node without a parent.","k":"p"},{"t":"Parent / child\n30 is parent of 20 and 40; 20 is a child of 30.","k":"p"},{"t":"Sibling\n20 and 40 have the same parent.","k":"p"},{"t":"Leaf / external node\n20, 40, 60 and 80 have no children.","k":"p"},{"t":"Internal node\n50, 30 and 70 have at least one child.","k":"p"},{"t":"Edge\nA connection such as 50–30.","k":"p"},{"t":"Subtree\n30 with descendants 20 and 40 forms a subtree.","k":"p"},{"t":"Ancestor / descendant\n50 is an ancestor of 20; 20 is a descendant of 50.","k":"p"},{"t":"Degree of node\nNumber of children: degree(50)=2, degree(20)=0.","k":"p"},{"t":"Depth of node\nNumber of edges from root: depth(40)=2.","k":"p"},{"t":"Height of tree\nLongest root-to-leaf path in edges: height=2 here.","k":"p"},{"t":"Level numbering varies by convention. In this book, the root has level 0, so its children are level 1. Some notes define the root as level 1; in an exam, write your chosen convention if necessary. Likewise, height can be measured in edges or nodes. We use the common edge-based definition, so a single-node tree has height 0. Avoid contradicting your own definition in calculations.","k":"p"}]},{"p":47,"unit":6,"chapter":"Trees","title":"6.2 Tree types: not every binary tree is a BST","blocks":[{"t":"For a connected tree containing n  nodes, there are exactly n−1  edges. The example has 7 nodes and 6 edges. Every node except the root has exactly one parent; a node may have zero or more children in a general tree. These simple properties help check whether a drawing is a valid tree.","k":"p"},{"t":"6.2 Tree types: not every binary tree is a BST","k":"h"},{"t":"A general tree allows any number of children. A binary tree allows at most two children per node, labelled left and right. A binary search tree (BST) is a binary tree with an order rule: for every node, all values in its left subtree are smaller, and all values in its right subtree are larger, assuming distinct keys.","k":"p"},{"t":"A full/strict binary tree has nodes with either zero or exactly two children (no node has one child). A complete binary tree fills every level except perhaps the final one, with final-level nodes packed from left to right. A perfect binary tree fills every internal node with two children and all leaves at the same depth. A degenerate/skewed tree resembles a chain. A height-balanced tree keeps the subtree heights sufficiently close according to its balancing rule; a general BST does not automatically remain balanced.","k":"p"},{"t":"Type\nHow to recognize it\nCommon mistake","k":"p"},{"t":"Full / strict\nEvery node has either 0 or 2 children\nIt does not require all leaves at one depth.","k":"p"},{"t":"Complete\nLast level filled from left to right\nNot all levels must be completely full.","k":"p"},{"t":"Perfect\nAll levels completely filled\nA perfect tree is also full and complete.","k":"p"},{"t":"Degenerate\nEvery internal node has one child\nSearch can degrade to O(n).","k":"p"},{"t":"BST\nAll keys in each left subtree smaller, right\nlarger\nRule applies to entire subtrees, not just immediate\nchildren.","k":"p"},{"t":"6.3 Binary tree representations in memory","k":"h"},{"t":"Linked representation","k":"h"},{"t":"A linked binary-tree node stores data , left  and right  pointers. If a child does not exist, that pointer is NULL . A program accesses the tree through a root pointer and follows child links. Linked representation is flexible for irregular tree shapes because missing nodes need not occupy fixed array positions.","k":"p"},{"t":"Array representation","k":"h"},{"t":"An array can represent a complete or nearly complete binary tree efficiently. With zero-based indexing, a node at index i  has left child 2i+1 , right child 2i+2 , and parent (i−1)/2  (integer division for i>0 ). With one-based indexing, the equivalent children are 2i  and 2i+1 . The teacher's notes show a one- based representation; the formulas must match the indexing convention. Sparse trees may waste many array positions because absent nodes still leave conceptual gaps.","k":"p"}]},{"p":48,"unit":6,"chapter":"Trees","title":"6.4 Traversal: the same tree, different visiting order","blocks":[{"t":"Indexing convention\nRoot index\nLeft child\nRight child","k":"p"},{"t":"0-based C array\n0\n2i + 1\n2i + 2","k":"p"},{"t":"1-based textbook array\n1\n2i\n2i + 1","k":"p"},{"t":"6.4 Traversal: the same tree, different visiting order","k":"h"},{"t":"To traverse a tree is to visit every node systematically. For the tree in Figure above, three depth-first","k":"p"},{"t":"orders matter:","k":"h"},{"t":"Preorder (Root–Left–Right, NLR): visit a node before traversing its subtrees. Result: 50, 30, 20, 40, 70, 60, 80 .","k":"p"},{"t":"Inorder (Left–Root–Right, LNR): traverse left subtree, visit root, traverse right subtree. Result: 20, 30, 40, 50, 60, 70, 80 . For a BST with unique values, this sequence is ascending.","k":"p"},{"t":"Postorder (Left–Right–Root, LRN): visit the node only after both subtrees. Result: 20, 40, 30, 60, 80, 70, 50 . It is useful for deleting subtrees or evaluating expression trees.","k":"p"},{"t":"Traversal\nRule\nOutput for example","k":"p"},{"t":"Preorder\nN–L–R\n50 30 20 40 70 60 80","k":"p"},{"t":"Inorder\nL–N–R\n20 30 40 50 60 70 80","k":"p"},{"t":"Postorder\nL–R–N\n20 40 30 60 80 70 50","k":"p"},{"t":"HOW TO TRACE ON PAPER","k":"h"},{"t":"Circle the root. For preorder, write it before doing the left branch. For inorder, write it between left and right branches.\nFor postorder, write it only after both branches are finished. Apply the same rule recursively to every subtree.","k":"p"}]},{"p":49,"unit":6,"chapter":"Trees","title":"PROGRAM 18 / C99","blocks":[{"t":"PROGRAM 18 / C99\nPreorder, inorder and postorder in C","k":"h"},{"t":"#include <stdio.h>\n#include <stdlib.h>\ntypedef struct Node {\n    int data;\n    struct Node *left, *right;\n} Node;\nNode *make(int x) {\n    Node *p = malloc(sizeof(Node));\n    if (p == NULL) exit(1);\n    p->data = x;\n    p->left = p->right = NULL;\n    return p;\n}\nvoid preorder(Node *p) {\n    if (!p) return;\n    printf(\"%d \", p->data);\n    preorder(p->left);\n    preorder(p->right);\n}\nvoid inorder(Node *p) {\n    if (!p) return;\n    inorder(p->left);\n    printf(\"%d \", p->data);\n    inorder(p->right);\n}\nvoid postorder(Node *p) {\n    if (!p) return;\n    postorder(p->left);\n    postorder(p->right);\n    printf(\"%d \", p->data);\n}\nvoid clear(Node *p) {\n    if (!p) return;\n    clear(p->left); clear(p->right); free(p);\n}\nint main(void) {\n    Node *r = make(2);\n    r->left = make(1);\n    r->right = make(3);\n    printf(\"Pre: \"); preorder(r); puts(\"\");\n    printf(\"In: \"); inorder(r); puts(\"\");\n    printf(\"Post: \"); postorder(r); puts(\"\");\n    clear(r);\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"Pre: 2 1 3\nIn: 1 2 3\nPost: 1 3 2","k":"p"},{"t":"How the program works. Each traversal has the same base case: a NULL pointer represents an empty subtree and requires no work. What changes is where the print statement appears relative to the left and right recursive calls. Each visits all n  nodes in O(n)  time. The recursion stack uses O(h)  extra space, where h  is the tree height in nodes along the deepest path. clear  frees children before parents, a postorder-style operation.","k":"p"}]},{"p":50,"unit":6,"chapter":"Trees","title":"6.5 Binary search trees: search and insertion","blocks":[{"t":"6.5 Binary search trees: search and insertion","k":"h"},{"t":"In a BST, the ordering rule lets us ignore one subtree at each comparison. To insert 60 into a tree rooted at 50 with right child 70, compare 60 with 50: go right; compare with 70: go left; if that child is empty, place 60 there. To search for a key, use the same comparisons until you find it or reach NULL .","k":"p"},{"t":"A balanced BST has height approximately log₂ n , so lookup/insertion is often O(log n) . But if values [10,20,30,40]  are inserted into an ordinary BST in ascending order, the result is a rightward chain: height grows with n , and searches can take O(n). An ordinary BST does not automatically rebalance itself. This distinction matters in complexity answers.","k":"p"},{"t":"Worked construction from the Unit 6 assignment","k":"h"},{"t":"Insert 45, 15, 79, 90, 10, 55, 12, 20, 50  in the given order. Begin with root 45. Place 15 to its left, 79 to its right, and 90 to the right of 79. Place 10 to the left of 15 and 55 to the left of 79. Place 12 to the right of 10, 20 to the right of 15, and 50 to the left of 55. The final tree is shown below in a compact","k":"p"},{"t":"text representation:","k":"h"},{"t":"45\n                /    \\\n              15      79\n             /  \\    /  \\\n           10   20  55   90\n             \\      /\n             12     50","k":"p"},{"t":"Check each branch against the full BST rule: 50 is greater than 45, but smaller than 79 and 55, so it belongs to the left of 55, not directly under 45. Traversing this constructed BST inorder gives 10,12,15,20,45,50,55,79,90 . The sorted output is a useful self-check for your drawing.","k":"p"}]},{"p":51,"unit":6,"chapter":"Trees","title":"PROGRAM 19 / C99","blocks":[{"t":"PROGRAM 19 / C99\nBuild and search a binary search tree","k":"h"},{"t":"#include <stdio.h>\n#include <stdlib.h>\ntypedef struct Node {\n    int key;\n    struct Node *left, *right;\n} Node;\nNode *insert(Node *p, int key) {\n    if (p == NULL) {\n        p = malloc(sizeof(Node));\n        if (p == NULL) exit(1);\n        p->key = key;\n        p->left = p->right = NULL;\n        return p;\n    }\n    if (key < p->key) p->left = insert(p->left, key);\n    else if (key > p->key) p->right = insert(p->right, key);\n    return p;\n}\nint search(Node *p, int key) {\n    while (p != NULL) {\n        if (key == p->key) return 1;\n        p = (key < p->key) ? p->left : p->right;\n    }\n    return 0;\n}\nvoid inorder(Node *p) {\n    if (p == NULL) return;\n    inorder(p->left);\n    printf(\"%d \", p->key);\n    inorder(p->right);\n}\nvoid clear(Node *p) {\n    if (p == NULL) return;\n    clear(p->left); clear(p->right); free(p);\n}\nint main(void) {\n    int v[] = {50, 30, 70, 20, 40, 60, 80};\n    Node *root = NULL;\n    for (int i = 0; i < 7; i++) root = insert(root, v[i]);\n    inorder(root); puts(\"\");\n    printf(\"Find 60: %s\\n\", search(root, 60) ? \"Yes\" : \"No\");\n    clear(root);\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"20 30 40 50 60 70 80\nFind 60: Yes","k":"h"},{"t":"How the program works. insert  returns the root pointer of the subtree it modifies. Assigning p->left = insert(p->left, key)  or p->right = ...  preserves the link to any new node. The code ignores duplicate keys by design; a BST allowing duplicates needs an explicit rule. search  follows left/right comparisons iteratively. Inorder prints keys in sorted order. Average time depends on tree shape; the worst case of an unbalanced BST is O(n) .","k":"p"}]},{"p":52,"unit":6,"chapter":"Trees","title":"6.6 Expression trees: operators become parents","blocks":[{"t":"6.6 Expression trees: operators become parents","k":"h"},{"t":"An expression tree represents an arithmetic expression structurally. Internal nodes hold operators and leaf nodes hold operands. For (3+5)*(2-1) , the root is multiplication because it is the final operation. Its left child is addition with leaves 3 and 5; its right child is subtraction with leaves 2 and 1.","k":"p"},{"t":"Traversing this tree inorder (with parentheses added where needed) reconstructs infix notation: (3+5)*(2-1) . Preorder produces * + 3 5 - 2 1 . Postorder produces 3 5 + 2 1 - * . Postorder is useful for stack-based evaluation. Inorder alone without parentheses can lose the original grouping, so bracket the expression when you write its mathematical meaning.","k":"p"},{"t":"*\n             /   \\\n            +     -\n           / \\   / \\\n          3   5 2   1","k":"p"},{"t":"6.7 Heap trees: understand the difference from BSTs","k":"h"},{"t":"A binary heap is a complete binary tree satisfying a heap-order property. In a max-heap, every parent is at least as large as its children, so the root holds a maximum value. In a min-heap, every parent is at most as large as its children, so the root holds a minimum. The heap condition relates parents to children; it does not mean that a heap's inorder traversal is sorted.","k":"p"},{"t":"A heap is often stored in an array because its complete shape makes index formulas convenient. For a max heap [90,60,80,20,40,70,50] , parent 90 is greater than children 60 and 80, and the same rule holds at every internal node. Heaps are especially useful for priority queues, while BSTs are designed to support key-based ordered searching. Do not confuse these two properties.","k":"p"},{"t":"Property\nBST\nBinary heap","k":"p"},{"t":"Ordering rule\nAll left subtree keys < node < all right subtree keys\nParent ≤ children (min) or ≥ children (max)","k":"p"},{"t":"Shape rule\nNo automatic completeness\nMust be complete","k":"p"},{"t":"Root value\nNot necessarily min or max\nMin or max by heap type","k":"p"},{"t":"Inorder output\nSorted for distinct keys\nNot necessarily sorted","k":"p"}]},{"p":53,"unit":6,"chapter":"Trees","title":"Exam answers: Unit 6","blocks":[{"t":"Exam answers: Unit 6","k":"h"},{"t":"Q1. Differentiate binary tree and binary search tree.","k":"h"},{"t":"A binary tree permits at most two children for each node but places no numerical order restriction on the data. A binary search tree is a special binary tree in which all keys in the left subtree are smaller than the node and all keys in the right subtree are larger (with a consistent duplicate policy). BST ordering enables directional search; a general binary tree may require exploring many nodes. Neither is automatically balanced.","k":"p"},{"t":"Examiner expects: State the *full subtree* ordering rule.","k":"p"},{"t":"Q2. Explain preorder, inorder and postorder with a worked example.","k":"h"},{"t":"For the sample BST with root 50, left subtree 30 with children 20/40, and right subtree 70 with children 60/80: preorder (Root–Left–Right) gives 50 30 20 40 70 60 80 ; inorder (Left–Root–Right) gives 20 30 40 50 60 70 80 ; postorder (Left–Right–Root) gives 20 40 30 60 80 70 50 . Each method recursively follows the same rule at every node.","k":"p"},{"t":"Examiner expects: Show diagram, clear order rules, all three outputs.","k":"p"},{"t":"Q3. Give BST insertion and search rules and complexity.","k":"h"},{"t":"Start from root. For a new key smaller than the current node, move left; for larger, move right. Repeat until a vacant child pointer is reached, then insert a node. Searching uses the same comparisons and succeeds on equality or fails at NULL. Balanced BSTs typically perform in O(log n)  time, while highly skewed ordinary BSTs can take O(n)  time. Inorder traversal of a BST visits keys in sorted order.","k":"p"},{"t":"Examiner expects: Give both average/balanced and worst/skewed cases.","k":"p"},{"t":"Q4. Explain full, complete, perfect and degenerate binary trees.","k":"h"},{"t":"A full tree has zero or two children per node; a complete tree fills all levels except perhaps the bottom, where nodes appear left-to-right; a perfect tree has two children for every internal node with all leaves at the same depth; a degenerate tree is chain-like, with at most one child for each internal node. These terms describe tree shape and should not be confused with the BST value-ordering rule.","k":"p"},{"t":"Examiner expects: Definition plus one tiny sketch for each.","k":"p"}]},{"p":54,"unit":6,"chapter":"Trees","title":"Q5. Describe expression trees and provide three traversals of (3+5)*(2-1).","blocks":[{"t":"Q5. Describe expression trees and provide three traversals of (3+5)*(2-1).","k":"h"},{"t":"Expression trees place operators in internal nodes and operands at leaves. The root for (3+5)*(2-1)  is","k":"code"},{"t":"* , whose children are +  (leaves 3 and 5) and -  (leaves 2 and 1). Preorder is * + 3 5 - 2 1 ; inorder is (3+5)*(2-1)  when parentheses are shown; postorder is 3 5 + 2 1 - * . The postfix form can be evaluated with a stack.","k":"p"},{"t":"Examiner expects: Correct root operator, labelled leaves and traversal orders.","k":"p"},{"t":"Q6. Explain min heap and max heap.","k":"h"},{"t":"A binary heap is a complete binary tree maintaining a parent–child order rule. In a min heap, every parent value is no larger than its children, so the root is minimum. In a max heap, every parent value is no smaller than its children, so the root is maximum. Unlike a BST, it does not guarantee an ordered left subtree and right subtree. A heap is commonly stored in an array and used for priority queues.","k":"p"},{"t":"Examiner expects: Heap completeness plus parent-child condition; contrast with BST.","k":"p"},{"t":"Tree check","k":"h"},{"t":"What is the difference between a complete tree and a perfect tree? If a BST is built from ascending keys, why does it lose logarithmic search performance? Which traversal lists BST keys in ascending order?","k":"p"}]},{"p":55,"unit":0,"chapter":"Assignment Clinic","title":"PA RT I I  /  G U I D E D  P R AC T I C E","blocks":[{"t":"PA RT I I  /  G U I D E D  P R AC T I C E\nThe assignment clinic","k":"h"},{"t":"Harder questions, longer reasoning, corrected edge cases and writing drills.\nThe original teacher question sheets remain intact in the archive after the main\ntext.","k":"p"},{"t":"This section focuses on the questions students often lose marks on even after memorizing the definitions. Each problem follows a useful pattern: what the question wants, the correct procedure, and what makes the procedure safe or efficient. The examples are original worked solutions based on topics recurring in the supplied assignments, SLA problems and practical list—not official answer-key excerpts.","k":"p"},{"t":"Workshop A / Arrays and complexity","k":"h"},{"t":"A1. Explain how to analyze a nested loop using one concrete trace.","k":"h"},{"t":"Consider the algorithm:","k":"h"},{"t":"for (int i = 0; i < n; i++) {","k":"code"},{"t":"for (int j = 0; j < n; j++) {","k":"code"},{"t":"count++;","k":"h"},{"t":"}","k":"h"},{"t":"}","k":"h"},{"t":"For every one of the n  values of i , the inner loop runs n  times. The statement count++  therefore runs exactly n × n = n²  times: 16 times for n=4 , 100 for n=10 . We ignore the fixed overhead of loop checks when naming the highest-order growth class, so time is O(n²) . Only i , j  and count  are needed as extra variables, so auxiliary space is O(1) .","k":"p"},{"t":"Now change the inner condition to j < i . The number of increments is 0+1+2+...+(n-1) = n(n−1)/2 , still O(n²) . A triangular loop is quadratic even though it performs about half as many iterations as a square loop.","k":"p"},{"t":"Examiner expects: Calculate the count, then state the asymptotic class. Do not guess from two for-loops alone.","k":"p"}]},{"p":56,"unit":0,"chapter":"Assignment Clinic","title":"A2. Trace array deletion and distinguish logical length from physical capacity.","blocks":[{"t":"A2. Trace array deletion and distinguish logical length from physical capacity.","k":"h"},{"t":"Array storage: [8, 12, 17, 23, 45, _, _] , capacity 7, length 5. Delete the item at index 2 (value 17). For i=2 , copy value 23 from index 3 into index 2. For i=3 , copy 45 from index 4 into index 3. Decrement the logical length to 4. The active array is now [8,12,23,45] .","k":"p"},{"t":"The final slot may still contain an old value physically, but it is not part of the active sequence. If you display elements using the capacity instead of the logical length, you may show stale or uninitialized data. This is a standard error in array-operation programs. Deletion takes O(n)  worst-case time because items may need shifting; deleting the last active item requires only a length update.","k":"p"},{"t":"Examiner expects: Show each shift direction and the new length.","k":"p"},{"t":"A3. Define algorithm characteristics and illustrate them.","k":"h"},{"t":"An algorithm should have clearly described input, output, definite (unambiguous) steps, finiteness (it terminates) and effectiveness (steps are executable). For example, a linear search has an input array and a key; it compares one value at a time, returns a matching index or not-found result, and terminates after at most n  comparisons. Writing \"search until done\" is not sufficiently definite: it does not explain the comparison or stopping rule.","k":"p"},{"t":"When asked for an algorithm instead of a program, you may write numbered pseudocode steps. It is not","k":"p"},{"t":"necessary to include #include  statements or C syntax, but every operation must remain precise.","k":"code"},{"t":"Examiner expects: Input, output, finiteness, definiteness, effectiveness.","k":"p"},{"t":"Workshop B / Searching and sorting traces","k":"h"},{"t":"B1. Give a complete binary-search dry run for a missing value.","k":"h"},{"t":"Sorted array: [2, 6, 11, 15, 19, 24, 30, 36] , key 18. Start low=0 , high=7 . First midpoint is (0+7)/ 2=3 : a[3]=15 , so choose the larger half with low=4 . New midpoint is (4+7)/2=5 : a[5]=24 , so set high=4 . New midpoint is (4+4)/2=4 : a[4]=19 , so set high=3 . The condition low<=high  is now false, so the key is absent.","k":"p"},{"t":"The important part is not the number of comparisons, but the justified boundary updates: whenever the key is smaller than the midpoint value, every greater index can be safely discarded because the array is sorted.","k":"p"},{"t":"Examiner expects: Show low, mid, high and the decision at every iteration.","k":"p"},{"t":"Round\nlow / mid / high\nMidpoint value\nAction","k":"p"},{"t":"1\n0 / 3 / 7\n15\nlow ← 4","k":"p"},{"t":"2\n4 / 5 / 7\n24\nhigh ← 4","k":"p"}]},{"p":57,"unit":0,"chapter":"Assignment Clinic","title":"B2. Explain exactly what the pivot does in quick sort.","blocks":[{"t":"Round\nlow / mid / high\nMidpoint value\nAction","k":"p"},{"t":"3\n4 / 4 / 4\n19\nhigh ← 3","k":"p"},{"t":"Stop\n4 / — / 3\n—\nNot found","k":"p"},{"t":"B2. Explain exactly what the pivot does in quick sort.","k":"h"},{"t":"In quick sort, the pivot is a selected element used to divide the array. One common partition scheme places all elements <= pivot  before it and greater elements after it. The pivot reaches its final sorted position at the end of that partition, but the regions on either side may still be internally unsorted.","k":"p"},{"t":"For [24,9,29,14,19,27]  with pivot 27 (last element), scanning values <=27  puts 24, 9, 14 and 19 into the left region; 29 remains in the right. Swapping the pivot into its boundary position produces [24,9,14,19,27,29] . You then recursively sort [24,9,14,19] . A pivot that repeatedly creates almost- empty and nearly-full partitions can make recursion depth linear and cause O(n²)  time. Pivot selection impacts the shape of work, not the sorted result.","k":"p"},{"t":"Examiner expects: Final pivot position; two subproblems; average and worst cases.","k":"p"},{"t":"B3. Explain what happens during merging in merge sort.","k":"h"},{"t":"Suppose the two halves have already been sorted: L = [3,8,17]  and R = [2,9,15] . Compare 3 with 2; take 2 from R. Compare 3 with 9; take 3 from L. Compare 8 with 9; take 8. Compare 17 with 9; take 9. Compare 17 with 15; take 15. The right half is exhausted, so append the leftover 17. The final merged sequence is [2,3,8,9,15,17] .","k":"p"},{"t":"We do not compare every possible pair. We only compare the current front elements from each already sorted half, moving the chosen pointer ahead each time. Merging m  and k  items takes O(m+k)  time, which is why a whole level of merge sort takes O(n)  work.","k":"p"},{"t":"Examiner expects: Trace individual choices; mention already sorted halves.","k":"p"},{"t":"Step\nTake from\nResult so far","k":"p"},{"t":"1\nRight: 2\n2","k":"p"},{"t":"2\nLeft: 3\n2,3","k":"p"},{"t":"3\nLeft: 8\n2,3,8","k":"p"},{"t":"4\nRight: 9\n2,3,8,9","k":"p"},{"t":"5\nRight: 15\n2,3,8,9,15","k":"p"},{"t":"6\nRemaining left: 17\n2,3,8,9,15,17","k":"p"}]},{"p":58,"unit":0,"chapter":"Assignment Clinic","title":"B4. Explain advantages and disadvantages of the three elementary sorts.","blocks":[{"t":"B4. Explain advantages and disadvantages of the three elementary sorts.","k":"h"},{"t":"Bubble sort is easy to trace and swaps adjacent elements, but performs many comparisons and is generally unsuitable for large random datasets. An early-stop variant can be efficient on already sorted input. Selection sort makes relatively few swaps and uses only constant extra memory, but performs quadratic comparisons even on sorted input. Insertion sort is stable in its standard form, needs only constant extra memory, and works well on small or nearly sorted datasets, but can require many shifts on reverse-sorted data. Their worst-case comparison time is O(n²) ; the reasons and best-case behavior differ.","k":"p"},{"t":"Examiner expects: Give mechanism and a qualified advantage/limitation for each.","k":"p"},{"t":"Workshop C / Linked-list pointer clinic","k":"h"},{"t":"C1. Why does a singly linked list sometimes use Node **head?","k":"h"},{"t":"In C, arguments are passed by value. If a function receives Node *head , it gets a copy of the caller's pointer. Assigning a new pointer to that local copy does not change the original head in main . If a function needs to change which node is first, it can accept Node **head , the address of that pointer, and assign through *head . Another valid design is to return the new head pointer and write head = insertFront(head, x)  in the caller.","k":"p"},{"t":"This distinction matters when inserting at the beginning or deleting the first node. Merely changing the data inside a node does not require Node ** ; changing the variable that stores the first-node address does.","k":"p"},{"t":"Examiner expects: Explain pointer-to-pointer, not only copy a prototype.","k":"p"},{"t":"C2. Trace deletion of the first, middle and last node.","k":"h"},{"t":"Start head → 10 → 20 → 30 → NULL . To delete 10, save the original head, set head to node 20, then free the saved 10 node. To delete middle value 20 from the original list, let prev point to 10 and p point to 20. Set prev->next = p->next , which connects 10 directly to 30, then free p. To delete last value 30, let prev point to 20 and p point to 30, set prev->next = NULL , then free p.","k":"p"},{"t":"The key pattern is identical: preserve access to the rest of the list, reconnect links, free the target. If the list contains only one node, deleting it sets head to NULL. For deletion by value, a preliminary search takes O(n)  in the worst case.","k":"p"},{"t":"Examiner expects: Draw before/after and show one NULL or head edge case.","k":"p"}]},{"p":59,"unit":0,"chapter":"Assignment Clinic","title":"C3. Explain doubly linked-list insertion between two nodes.","blocks":[{"t":"C3. Explain doubly linked-list insertion between two nodes.","k":"h"},{"t":"Let A and B be adjacent in a doubly linked list with A->next=B  and B->prev=A . Allocate X. Set X->prev=A , X->next=B , then set A->next=X , B->prev=X . Afterward forward traversal sees A→X→B  and backward traversal sees B→X→A . If B does not exist, X becomes the new last node and no B.prev update is possible. If A does not exist, X becomes the new head.","k":"p"},{"t":"Before any deletion, reconnect both directions, not only next pointers. This is the main extra correctness burden compared with singly linked lists.","k":"p"},{"t":"Examiner expects: Both directions must remain consistent.","k":"p"},{"t":"C4. Why can circular-list traversal produce an infinite loop?","k":"h"},{"t":"In a normal singly linked list, the last node's next pointer is NULL, so while(p!=NULL)  eventually","k":"code"},{"t":"terminates. In a circular list, the last node leads back to head. A traversal that only checks for NULL therefore keeps repeating the same cycle indefinitely. For a nonempty singly circular list, use a do...while  loop that stops when the pointer returns to the starting node. Handle the empty case first, and avoid deleting the start node without updating the stopping reference.","k":"p"},{"t":"Examiner expects: Circular termination condition should refer to starting node.","k":"p"},{"t":"Workshop D / Stacks, notation and recursion","k":"h"},{"t":"D1. Convert (A+B)*C-D into postfix with operator precedence.","k":"h"},{"t":"Start with (A+B)*C-D . Read (  and push it. Send A to output, push +, send B to output, and process )  by popping + and removing ( . Output is now AB+ . Push * , send C, then read - ; because multiplication has higher precedence, pop *  into output before pushing - . Send D, then pop the final minus at end. The postfix expression is AB+C*D- . It represents (A+B)*C-D , with no explicit brackets required.","k":"p"},{"t":"Examiner expects: Show the operator stack when closing bracket and lower-priority operator appear.","k":"p"},{"t":"Token\nStack (bottom to top)\nOutput","k":"p"},{"t":"(\n(\n—","k":"p"},{"t":"A\n(\nA","k":"p"},{"t":"+\n( +\nA","k":"p"},{"t":"B\n( +\nAB","k":"p"},{"t":")\nempty\nAB+","k":"p"}]},{"p":60,"unit":0,"chapter":"Assignment Clinic","title":"D2. What are the steps for string reversal using a stack?","blocks":[{"t":"Token\nStack (bottom to top)\nOutput","k":"p"},{"t":"*\n*\nAB+","k":"p"},{"t":"C\n*\nAB+C","k":"p"},{"t":"-\n-\nAB+C*","k":"p"},{"t":"D\n-\nAB+C*D","k":"p"},{"t":"End\nempty\nAB+C*D-","k":"p"},{"t":"D2. What are the steps for string reversal using a stack?","k":"h"},{"t":"Read the characters of a word from left to right and push each character. Then pop and print the characters until the stack is empty. For CODE , pushes make the stack bottom-to-top C,O,D,E ; popping prints E, D, O, C, giving EDOC. The method uses O(n)  time and O(n)  stack storage for an n -character word. In an array implementation, check that the input fits capacity before pushing; otherwise the stack would overflow.","k":"p"},{"t":"Examiner expects: Explain why LIFO reverses the original order.","k":"p"},{"t":"PROGRAM 20 / C99\nReverse a word using an array stack","k":"h"},{"t":"#include <stdio.h>\n#include <string.h>\n#define MAX 30\nint main(void) {\n    char word[] = \"CODE\", st[MAX];\n    int n = (int)strlen(word), top = -1;\n    if (n > MAX) return 1;\n    for (int i = 0; i < n; i++)\n        st[++top] = word[i];\n    while (top >= 0) putchar(st[top--]);\n    putchar('\\n');\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"EDOC","k":"h"},{"t":"How the program works. strlen  determines how many characters must be pushed. Because the last character pushed becomes TOP, every pop prints characters in reverse order. The capacity test prevents overflowing the array. For a string supplied at runtime, additionally limit input length when reading it.","k":"p"}]},{"p":61,"unit":0,"chapter":"Assignment Clinic","title":"D3. Why is a base case essential in recursion?","blocks":[{"t":"D3. Why is a base case essential in recursion?","k":"h"},{"t":"A recursive function makes another call of itself. Without an exit condition, it can continue creating call frames and eventually exhaust available call-stack space. A base case handles the smallest problem directly, while each recursive step must reduce the problem toward that case. For example, factorial(1)=1 ; factorial(n)=n*factorial(n-1)  for n>1 . The sequence of calls descends until 1, then unwinds with returned values. In an exam answer, identify both the stopping case and the changing input; writing only \"function calls itself\" is incomplete.","k":"p"},{"t":"Examiner expects: Base case and progress toward it.","k":"p"},{"t":"D4. Compare stack using array and stack using linked list.","k":"h"},{"t":"An array stack stores data in contiguous slots and tracks an integer top index. It is simple and fast, but capacity must be chosen for the fixed array; pushing when top reaches MAX-1  causes overflow. A linked stack stores nodes allocated at runtime and uses a pointer to the newest node as top. It can grow as memory permits, but each node needs pointer overhead and allocation can fail. Both push and pop are O(1)  if implemented at the top; neither supports efficient arbitrary searching.","k":"p"},{"t":"Examiner expects: Memory layout, overflow, access and operations.","k":"p"},{"t":"Workshop E / Queue edge cases","k":"h"},{"t":"E1. Explain the difference between queue empty and queue full checks.","k":"h"},{"t":"In the chosen linear array representation, front=-1  marks empty and rear=MAX-1  marks full. These tests are not symmetric because they track different things: front=-1  means the logical queue has no elements, whereas rear=MAX-1  means the final physical slot has been used. In the circular representation, the next position wraps, so empty remains front=-1  but full is (rear+1)%MAX == front . In a linked queue, empty means front == NULL ; there is no fixed MAX  test, but dynamic allocation may fail.","k":"p"},{"t":"Examiner expects: State which implementation you are describing before giving the condition.","k":"p"},{"t":"E2. Show why circular queues have better storage reuse.","k":"h"},{"t":"Let a 5-slot linear queue contain A,B,C,D at indexes 0–3. Delete A and B, so front advances to 2. Insert E at index 4, so rear becomes 4. The queue can reject F even though indexes 0 and 1 are available, because rear cannot move past the array end. In a circular queue, enqueue after rear index 4 wraps to index 0. The active order remains C,D,E,F even though the physical array order is now F,_,C,D,E. Logical order is determined by front and modulo advancement, not by scanning from array index 0.","k":"p"},{"t":"Examiner expects: Physical versus logical order distinguishes strong answers.","k":"p"}]},{"p":62,"unit":0,"chapter":"Assignment Clinic","title":"E3. Why must a linked queue reset rear when the last item is dequeued?","blocks":[{"t":"E3. Why must a linked queue reset rear when the last item is dequeued?","k":"h"},{"t":"When a linked queue contains exactly one node, both front  and rear  point to it. Dequeue saves the node, moves front to front->next  (NULL), and frees the old node. If rear were left unchanged, it would point to freed memory. A later enqueue might assign through rear->next  and cause undefined behavior. Therefore after updating front, check if(front==NULL) rear=NULL . That extra line is required for a safe empty-state transition.","k":"p"},{"t":"Examiner expects: Describe dangling pointer, not merely \"set rear zero\".","k":"p"},{"t":"E4. Distinguish priority queues from FIFO behavior with a scenario.","k":"h"},{"t":"A printer's ordinary FIFO queue receives A, B and C and processes A first. A priority queue might receive A (low), B (high), C (medium) and process B first because its priority is higher, even though A arrived earlier. The queue implementation still needs an explicit rule for handling two jobs of equal priority. A binary heap can support efficient priority selection; a sorted or unsorted linked list is another possibility. Thus priority queue is an ADT rule about removal order, not one fixed array algorithm.","k":"p"},{"t":"Examiner expects: Order rule, sample and implementation choices.","k":"p"},{"t":"Workshop F / Tree reasoning and paper diagrams","k":"h"},{"t":"F1. How do you know a BST drawing is valid?","k":"h"},{"t":"A quick local check that each left child is smaller and each right child is larger is not sufficient. The rule must hold for entire subtrees. For example, if root is 50, any node in the left subtree must be smaller than 50, even if it is a right child of node 30. Putting 60 as the right child of 30 violates the BST rule because 60 belongs to the right subtree of 50. Validate every node against the bounds inherited from ancestors. An inorder traversal of a proper BST with distinct values must produce strictly increasing keys.","k":"p"},{"t":"Examiner expects: Global left-subtree and right-subtree rule.","k":"p"},{"t":"F2. Explain tree height and maximum number of nodes.","k":"h"},{"t":"Using edge-based height with root at level 0, a single-node tree has height 0. A perfect binary tree of height h  has 1+2+4+...+2^h = 2^(h+1)−1  nodes. So height 2 allows at most 1+2+4=7  nodes; height 3 allows 15. The minimum nodes for an arbitrary binary tree of height h is h+1 , achieved by a degenerate chain. These formulas assume the height is measured in edges; if a source counts levels from 1, translate the convention before substituting.","k":"p"},{"t":"Examiner expects: State indexing/height convention with the formula.","k":"p"}]},{"p":63,"unit":0,"chapter":"Assignment Clinic","title":"F3. Why does BST searching become slow in a skewed tree?","blocks":[{"t":"F3. Why does BST searching become slow in a skewed tree?","k":"h"},{"t":"Insert distinct sorted values [10,20,30,40,50]  into an ordinary BST. Each new value is greater than every value already present, so it becomes the right child of the current last node. The structure forms a five-node chain with height 4 edges. Searching for 50 visits 10→20→30→40→50, inspecting all five nodes— O(n)  time. A balanced BST would keep its height closer to log n , but an ordinary BST insertion algorithm does not perform rotations or balancing automatically.","k":"p"},{"t":"Examiner expects: Use the concrete skewed example and relate runtime to tree height.","k":"p"},{"t":"F4. Explain array representation of a binary tree with an example.","k":"h"},{"t":"In a zero-based C array, root is stored at index 0. For index i, left child is 2i+1 , right child is 2i+2 , and the parent of non-root node i is (i−1)/2 . If a complete tree contains level-order keys [50,30,70,20,40,60,80] , the root at index 0 has children at 1 and 2; node 30 at index 1 has children at 3 and 4. With one-based indexing, the formulas change to children 2i  and 2i+1 . Array storage works well for complete trees and heaps but can waste slots for sparse shapes.","k":"p"},{"t":"Examiner expects: Correct index formulas with the chosen convention.","k":"p"},{"t":"F5. Draw an expression tree for 3+((5+9)*2) and list all traversals.","k":"h"},{"t":"Root is the outer addition +  with left leaf 3 and a right multiplication subtree. That multiplication node has a left addition subtree with leaves 5 and 9, and right leaf 2. Thus:","k":"p"},{"t":"•","k":"h"},{"t":"Prefix / preorder: + 3 * + 5 9 2","k":"h"},{"t":"•","k":"h"},{"t":"Infix / inorder: 3 + ((5 + 9) * 2)  (parentheses preserve grouping)","k":"h"},{"t":"•","k":"h"},{"t":"Postfix / postorder: 3 5 9 + 2 * +","k":"h"},{"t":"The postfix evaluation is 5+9=14, 14×2=28, 3+28=31. The tree structure directly encodes which operation is performed first and which is last.","k":"p"},{"t":"Examiner expects: Correct root and three consistent traversal sequences.","k":"p"},{"t":"+\n              /   \\\n             3     *\n                  / \\\n                 +   2\n                / \\\n               5   9","k":"p"}]},{"p":64,"unit":0,"chapter":"Assignment Clinic","title":"F6. What is the difference between traversal and searching?","blocks":[{"t":"F6. What is the difference between traversal and searching?","k":"h"},{"t":"Traversal means visiting all nodes in a defined order, such as preorder, inorder or postorder, usually taking O(n)  time for n  nodes. Searching means trying to locate a specific key; it may stop early. In an ordinary BST, the key ordering allows search to follow only a left or right path, taking O(h)  time where h is tree height. An inorder traversal of a BST lists all keys in sorted order, but it is not the same as a single- key search.","k":"p"},{"t":"Examiner expects: Explain aim, stopping condition and time.","k":"p"},{"t":"Exam-writing drill","k":"h"},{"t":"Choose one question from each workshop. First explain it aloud without reading. Next draw or trace it. Then write the answer in 5–8 complete lines, with formulas or code conditions where appropriate. This develops recall instead of recognition.","k":"p"}]},{"p":65,"unit":0,"chapter":"Revision & Source Notes","title":"R E F E R E N C E  S H E E T S","blocks":[{"t":"R E F E R E N C E  S H E E T S\nAfter the six chapters","k":"h"},{"t":"Three quick ways to check whether you have actually learned the material.","k":"p"},{"t":"One-page operation cheat sheet","k":"h"},{"t":"Structure\nWhat it prioritizes\nFast operation\nTypical expensive operation","k":"p"},{"t":"Array\nDirect indexing\nRead/write at index O(1)\nInsert/delete near beginning O(n)","k":"p"},{"t":"Linked list\nChange local links\nInsert/delete at head O(1)\nLocate arbitrary position O(n)","k":"p"},{"t":"Stack\nLast in, first out\nPush/pop O(1)\nFind arbitrary item O(n)","k":"p"},{"t":"Queue\nFirst in, first out\nEnqueue/dequeue O(1)\nSearch for a value O(n)","k":"p"},{"t":"BST\nOrdered key relationships\nSearch O(log n) if balanced\nSearch O(n) if skewed","k":"p"},{"t":"Merge sort\nPredictable sorting\nO(n log n) total time\nUses O(n) extra storage","k":"p"},{"t":"Twenty-minute self-test — without notes","k":"h"},{"t":"UNIT 1 / Questions","k":"h"},{"t":"Define ADT with a stack example; insert 9 at index 1 in [4,7,2]; explain O(n²).","k":"p"},{"t":"UNIT 2 / Questions","k":"h"},{"t":"Dry-run binary search for 16; show bubble passes; state best/worst complexity for 5 sorts.","k":"p"},{"t":"UNIT 3 / Questions","k":"h"},{"t":"Draw a singly linked list; insert at head; delete by value; compare memory with arrays.","k":"p"}]},{"p":66,"unit":0,"chapter":"Revision & Source Notes","title":"UNIT 4 / Questions","blocks":[{"t":"UNIT 4 / Questions","k":"h"},{"t":"Demonstrate three pushes and two pops; convert A*(B+C) to postfix; trace factorial(4).","k":"p"},{"t":"UNIT 5 / Questions","k":"h"},{"t":"Show false overflow with five slots; write circular full test; explain dequeue of final node.","k":"p"},{"t":"UNIT 6 / Questions","k":"h"},{"t":"Build a BST; perform NLR/LNR/LRN; draw expression tree for (2+3)*4.","k":"code"},{"t":"Writing a program answer in an exam","k":"h"},{"t":"Write the structure or variable definitions first; then the core
