</style></head><body><div id="app"><div class="app"><aside class="sidebar" id="sidebar"><a class="logo" href="#" data-nav="dashboard"><div class="logo-mark">🧠</div><div><b>STACK<br>ATTACK!</b><small>DS Exam Arcade</small></div></a><div class="nav-label">Your base camp</div><nav class="nav" id="nav"></nav><div class="side-challenge"><span class="sticker">EXAM BOSS FIGHT</span><b>25 NOV · 10:30</b><p>Six units. One big brain. A ridiculous amount of practice.</p><button class="btn cream sm wide" data-nav="exam">Enter mock exam ↗</button></div><div class="sidebar-footer">Built for CWIT · Semester III<br>Study hard, panic less ✨</div></aside><div class="main-wrap"><header class="topbar"><div class="row"><button class="mini-btn mob-menu" data-action="toggle-sidebar">☰</button><div class="crumb">STACK ATTACK <span> / </span><span id="crumb">MISSION CONTROL</span></div></div><div class="top-actions"><div class="focus-widget"><span class="focus-time" id="focus-time">25:00</span><button class="mini-btn" title="Focus timer" data-action="focus-toggle">⏱</button></div><div class="xp-pill" id="xp-pill">✳ 0 XP</div><button class="mini-btn" title="Search (Ctrl+K)" data-action="search-modal">⌕</button><button class="mini-btn" title="Dark mode" data-action="theme-toggle">◐</button></div></header><main class="page" id="page"></main></div></div><div id="modal-root"></div><div id="toast-root"></div><div id="confetti-root"></div><input class="hidden" id="import-file" type="file" accept="application/json"></div><script>
const UNITS=[
 {id:1,name:'Foundations & Arrays',short:'Arrays',emoji:'🧱',color:'#f48b57',range:'4–10',tagline:'Build a brain for organizing data.',boss:'The Array Goblin'},
 {id:2,name:'Searching & Sorting',short:'Search + Sort',emoji:'🔎',color:'#7d75d8',range:'11–20',tagline:'Find it, sort it, explain every pass.',boss:'The Chaos Gremlin'},
 {id:3,name:'Linked Lists',short:'Linked Lists',emoji:'🔗',color:'#2fa69c',range:'21–28',tagline:'Pointers that actually make sense.',boss:'The Pointer Phantom'},
 {id:4,name:'Stacks & Recursion',short:'Stacks',emoji:'🥞',color:'#d49a30',range:'29–37',tagline:'Last in, first out. No drama.',boss:'The Recursion Dragon'},
 {id:5,name:'Queues',short:'Queues',emoji:'🚏',color:'#df7897',range:'38–44',tagline:'First come, first served.',boss:'The Queue Kraken'},
 {id:6,name:'Trees',short:'Trees',emoji:'🌳',color:'#609c60',range:'46–54',tagline:'Untangle branches and traversals.',boss:'The BST Beast'}
];
function L(u,p,title,summary,analogy,steps,why,trap,exam,code='') {return {id:'u'+u+'l'+(LESSONS.filter(x=>x.unit===u).length+1),unit:u,page:p,title,summary,analogy,steps:steps.split('|'),why,trap,exam,code};}
const LESSONS=[];
function lesson(...args){LESSONS.push(L(...args));}
lesson(1,4,'What is a data structure?','A data structure organizes data in memory so operations such as access, insertion, deletion and searching are predictable and efficient. It is not the same thing as a data type or an algorithm.','A college library needs shelves and an index; loose books are still books, but impossible to find quickly.','Data type = kind of single value (int, char)|Data structure = arrangement and relationships between values|Algorithm = finite instructions that operate on those values','Different jobs prioritize different operations: direct lookup, growth, ordered service, or branching search.','Do not define a data structure as “a computer program.”','Define data structure; list four needs/advantages with one practical example.');
lesson(1,5,'Classifications','Primitive/non-primitive describe value complexity; linear/non-linear describe logical arrangement; static/dynamic describe how storage is obtained. A structure may belong to multiple categories at once.','Primitive = single Lego brick; non-primitive = finished Lego model. Linear = train; non-linear = family tree.','Primitive: int, char, float|Non-primitive: arrays, lists, stacks, queues, trees|Linear: sequential logical relation|Non-linear: branching relations|Static: fixed allocated capacity|Dynamic: runtime allocation/deallocation','A linked list is linear even when nodes are scattered across memory because linear means logical order, not contiguous addresses.','A static array can update elements; only its allocated capacity is fixed.','Prepare three 2-column comparison tables.');
lesson(1,6,'Abstract Data Type (ADT)','An ADT specifies allowed operations and their behavior without prescribing the internal representation. A stack ADT promises push, pop, peek and LIFO whether backed by an array or linked list.','A TV remote tells you what buttons do without revealing circuit design.','Specify values and permitted operations|State expected behavior/invariants|Hide implementation behind an interface|Implement with an array or nodes','Separating what a structure does from how it stores data makes implementations interchangeable.','ADT does not automatically make a program faster.','Definition, features (abstraction, encapsulation, interface, implementation independence), example.');
lesson(1,6,'Seven basic operations','Traversal visits elements; insertion adds; deletion removes; searching finds; updating changes; sorting orders; merging combines collections.','Managing a class list: read names, add admission, remove leaver, find roll number, change marks, order by marks, merge two sections.','Traversal = visit|Insertion = add|Deletion = remove|Searching = locate|Updating = overwrite|Sorting = arrange|Merging = combine','Each operation has different speed depending on which structure stores the elements.','Do not confuse searching with sorting.','Write all seven with one-word meaning and a tiny example.');
lesson(1,7,'Arrays, indexes & memory','An array stores same-type elements at contiguous addresses. C indexes start at zero. The address of a[i] is base + i × element size; therefore indexed access is O(1).','Row of numbered seats: you jump straight to seat 4 rather than asking everyone.','int a[5] = {45,12,28,70,19}|a[0] = 45; a[2] = 28|If base=1000 and each int=4 bytes, a[3] starts at 1012','Contiguous layout and fixed element width let the computer compute an element address directly.','Index 2 is the third element. Accessing a[5] is invalid for a 5-element C array.','Define, diagram indexes, address formula, O(1) random access.','int a[5]={45,12,28,70,19};\nprintf("%d",a[2]); // 28');
lesson(1,7,'Array insertion and deletion','Insertion at index p shifts occupied elements right starting from the end; deletion at p shifts later elements left. Both can take O(n) time. Track logical length separately from capacity.','Adding a chair in the middle of a row: everyone shifts one place to make room.','Insert 99 at index 2 of [10,20,30,40]|Shift 40 right, then 30 right|Write 99 → [10,20,99,30,40]|Delete index 1: shift elements left → [10,99,30,40]','Shifting right-to-left preserves values that would otherwise be overwritten.','Check n < capacity before inserting; check 0 ≤ p ≤ n or p < n as appropriate.','Explain shift directions with stepwise diagrams and worst-case O(n).','for(int i=n;i>pos;i--) a[i]=a[i-1];\na[pos]=value; n++;\n// delete:\nfor(int i=pos;i<n-1;i++) a[i]=a[i+1];\nn--;');
lesson(1,8,'Algorithms & Big O','An algorithm is a finite, clear sequence of steps with input, output and termination. Time complexity models growth in work; space complexity models memory. O(1), O(log n), O(n), O(n log n), O(n²) are common growth classes.','One name on a seat chart is O(1); checking everyone is O(n); comparing all pairs approaches O(n²).','One direct array access → O(1)|One loop over n → O(n)|Two full nested loops → O(n²)|Halve search space repeatedly → O(log n)|Use extra cache memory to reduce work = time-space trade-off','Big O compares the way cost grows with input size rather than exact seconds on one computer.','O(log n) is not the same as O(n); Big O is a bound, not always “worst case” by definition.','Define algorithm, time/space complexity, four Big O examples, trade-off.','for(int i=0;i<n;i++) printf("%d",a[i]); // O(n)');
lesson(2,11,'Linear search','Compare elements left to right until the key matches or the collection ends. It works on unsorted data. Best O(1), worst/average O(n), auxiliary space O(1) for iteration.','Looking for a friend in a queue by checking one face at a time.','Array [25,10,40,15,30], key=15|Check 25 → no|Check 10 → no|Check 40 → no|Check 15 → found at index 3','No ordering assumptions are needed; simply inspect candidates sequentially.','Index 3 is position 4, not position 3 in everyday counting.','Algorithm/flowchart, example and complexity.','for(int i=0;i<n;i++){\n  if(a[i]==key){ printf("Found %d",i); break; }\n}');
lesson(2,12,'Binary search','For sorted input, compare the midpoint and discard the half that cannot contain the key. Worst O(log n); iterative auxiliary space O(1).','Guessing a number from 1–100 by asking “higher or lower?”','Array [5,12,18,26,31,47,59,63,77], key=59|low=0 high=8 mid=4 → 31|59 > 31 so low=5|mid=6 → 59 found','Sorting ensures that values on each side of the midpoint are ordered relative to the key.','Do NOT use ordinary binary search on unsorted data.','Sorted requirement, low/high/mid updates, example and O(log n).','while(low<=high){\n int mid=low+(high-low)/2;\n if(a[mid]==key)break;\n if(key<a[mid])high=mid-1;\n else low=mid+1;\n}');
lesson(2,14,'Bubble sort','Repeatedly compare adjacent elements and swap out-of-order pairs. After each full pass, the largest remaining element settles at the right. Optimized early-stop best O(n); average/worst O(n²).','Bubbles rise; large numbers “bubble” toward the end.','[5,1,4,2,8]|Pass 1 → [1,4,2,5,8]|Pass 2 → [1,2,4,5,8]|Next pass no swaps → stop','Adjacent swaps gradually move each element toward the proper position.','Bubble sort best-case O(n) only when a no-swap early-stop test exists.','Show each pass and state optimized best/average/worst.','for(int i=0;i<n-1;i++){\n int swapped=0;\n for(int j=0;j<n-i-1;j++)\n  if(a[j]>a[j+1]){int t=a[j];a[j]=a[j+1];a[j+1]=t;swapped=1;}\n if(!swapped)break;\n}');
lesson(2,15,'Selection sort','Find the smallest element from the unsorted part and swap it into the first unsorted position. Best/average/worst O(n²), auxiliary space O(1).','Picking the shortest student from an unsorted line and putting them first.','[4,9,2,6,1,8]|Find min 1 → [1,9,2,6,4,8]|Find min 2 → [1,2,9,6,4,8]|Find min 4 → [1,2,4,6,9,8]','One position is fixed after every outer iteration; finding its value still requires scanning the remainder.','The variable min stores an index, not necessarily the numerical minimum itself.','Minimum selection passes and O(n²) in all cases.');
lesson(2,16,'Insertion sort','Maintain a sorted left prefix. Pick the next key, shift larger preceding items right, then insert it in the gap. Best O(n) on sorted data; worst O(n²).','Arranging playing cards in your hand one at a time.','[74,34,44,14]|Insert 34 → [34,74,44,14]|Insert 44 → [34,44,74,14]|Insert 14 → [14,34,44,74]','Nearly sorted data has few inversions, so only a few shifts are necessary.','Save key before shifting: otherwise its original value can be overwritten.','Explain key, j, shifting and why near-sorted data benefits.');
lesson(2,17,'Merge sort','Divide the array recursively into halves, sort each half, then merge sorted halves. Best/average/worst O(n log n), generally O(n) extra array memory.','Two neatly sorted card piles can be combined by repeatedly taking the smaller top card.','[19,64,5,16]|Split → [19,64] [5,16]|Sorted halves → [19,64] [5,16]|Merge → [5,16,19,64]','There are about log₂n splitting levels and O(n) merge work at each level.','Unlike quick sort, merge sort guarantees O(n log n) time for all cases in this standard model.','Divide/conquer diagram, merging example, complexity and memory.');
lesson(2,18,'Quick sort','Choose a pivot, partition smaller/equal values to one side and larger values to the other, then recursively sort each side. Average O(n log n), worst O(n²).','Choosing a class monitor and putting shorter people on one side, taller on the other.','[24,9,29,14,19,27], pivot=27|Partition → [24,9,14,19,27,29]|Pivot now fixed at index 4|Sort left [24,9,14,19] recursively','Partitioning gives the pivot its final place without sorting all remaining values at once.','A poor pivot can create severely unbalanced partitions and O(n²) time.','Explain pivot/partition, average vs worst, merge sort comparison.');
lesson(3,21,'Why linked lists?','A linked list uses nodes with data and link pointers. Nodes need not be adjacent in memory; the next pointer establishes order. Traversal is O(n), head insertion O(1).','Treasure hunt: each clue tells you where the next clue is hidden.','Each node = data + next address|head points at first node|Last node next = NULL|Follow next links to traverse','Links avoid shifting array elements when inserting at a known position.','A linked list does not support O(1) indexed access just because nodes are linear.','Draw head → [data|next] → [data|next] → NULL.');
lesson(3,22,'Pointers, head and NULL','head holds the first node address; NULL means no node. A node pointer must be valid before accessing its fields. The -> operator reads a structure field through a pointer.','A phone contact list: each person holds the next phone number; a missing next number ends the chain.','typedef struct Node { int data; struct Node *next; } Node;|head == NULL means empty list|while (p != NULL) safely traverses|p->data reads a node’s value','The computer must follow addresses to locate the next node, not increment an index.','Never evaluate p->next when p is NULL.','Define node/head/NULL with labelled diagram.','typedef struct Node {\n int data;\n struct Node *next;\n} Node;');
lesson(3,22,'Dynamic memory: malloc/free','malloc(sizeof(Node)) asks the heap for memory and returns a pointer or NULL. free(pointer) releases it. Check allocation success and avoid using freed memory.','Renting a small storage box only when needed, then returning it when finished.','#include <stdlib.h>|Node *x = malloc(sizeof(Node));|if(x == NULL) handle failure|free(x) when no longer used','Dynamic allocation allows nodes to be created while the program is running.','Lost pointers cause memory leaks; dereferencing a freed pointer is undefined behavior.','Define malloc and free, show lifecycle and safety.','Node *x=malloc(sizeof(Node));\nif(x!=NULL){x->data=10; x->next=NULL; free(x);}');
lesson(3,23,'Insert nodes safely','To insert at head: new->next = head, then head = new. To insert after p: new->next = p->next, then p->next = new. Updating links in the right order prevents lost nodes.','Adding a new first person in a chain by giving them the old leader’s contact before appointing them leader.','Initial: head → 20 → 30|Create new node holding 10|new->next=head|head=new → 10 → 20 → 30','You must preserve the old chain before changing the pointer that reaches it.','Do not change head before connecting new->next to the old head.','Head insertion O(1), end insertion O(n) without tail pointer.','newNode->next = head;\nhead = newNode;');
lesson(3,24,'Delete without breaking links','Deleting first node: save old head, advance head, free old head. Deleting middle node: connect previous directly to target->next, then free target.','Removing a link in a chain: connect the neighbors first so nobody gets lost.','temp=head|head=head->next|free(temp)|For middle: prev->next=target->next; free(target)','Reconnect-before-free preserves access to nodes after the removed one.','Do not dereference target after free(target).','Draw before/after, explain deleting beginning vs middle.');
lesson(3,26,'Singly vs doubly vs circular','Singly nodes hold next; doubly nodes hold prev and next; circular lists link the last node back to head. Circular traversals must stop after one full cycle, not on NULL.','One-way train, two-way train, or a merry-go-round loop.','Singly: forward only; lighter memory|Doubly: backward + forward; extra pointer|Circular: tail->next=head|One-node circular: head->next=head','Extra links change the available operations and memory cost.','A circular list normally does not end with NULL, so an ordinary while(p!=NULL) loop can run forever.','Draw all three variants and differences.');
lesson(3,26,'Array vs linked list','Arrays give contiguous O(1) indexed access; lists grow by allocating separate nodes and support O(1) head insertions but O(n) traversal.','Fixed numbered lockers vs a flexible chain of paper notes.','Array: known capacity, contiguous slots|Linked list: pointer memory per node|Array insertion middle: shift O(n)|List head insertion: relink O(1)|List search by value: O(n)','Choosing a structure means selecting the trade-off that matches frequent operations.','Do not claim that all linked-list insertions are O(1); locating the position may take O(n).','Compare memory, indexing, insertion, resizing, traversal.');
lesson(4,29,'Stack: LIFO','A stack is a linear ADT where the last item inserted is the first removed. Push/pop/peek all operate at TOP.','Pile of plates: the plate placed last is taken first.','push(10) → [10]|push(20) → [10,20]|push(30) → [10,20,30]|pop() returns 30 first','Only one end is accessible for insertion and removal.','Stack is LIFO, not FIFO.','Definition, diagram, push/pop/peek/isEmpty.');
lesson(4,30,'Stack using an array','Initialize top=-1. Push increments top then stores; pop reads/decrements top. Overflow when top==MAX-1; underflow when top==-1.','Elevator with numbered floors: top points to the highest occupied slot.','top=-1 means empty|Push: check full, then a[++top]=x|Peek: return a[top] without modifying top|Pop: check empty, then return a[top--]','top stores the index of the current last item, not the number of occupied items.','Always check empty/full before accessing the array.','Show algorithms, pointer movement, overflow/underflow.','if(top==MAX-1) puts("Overflow");\nelse a[++top]=x;\nif(top==-1) puts("Underflow");\nelse printf("%d",a[top--]);');
lesson(4,31,'Linked stack','Use a singly linked list whose head is TOP. Push links a new head; pop removes and frees head. No fixed array capacity, but allocation can fail.','A pile of plates where new plates are connected by pointers instead of fixed slots.','push: new->next=top; top=new|pop: temp=top; top=top->next; free(temp)|peek: top->data|Empty: top==NULL','Both operations modify only the head and therefore normally run in O(1).','A linked stack can still run out of available memory.','Compare array vs linked stack.');
lesson(4,32,'Infix, prefix & postfix','Infix places operator between operands (A+B); prefix before (+AB); postfix after (AB+). Postfix can be evaluated using a stack without precedence parsing.','Infix says “3 plus 4”; postfix says “3 4 plus”.','Infix A+B*C|Postfix ABC*+|Prefix +A*BC|Postfix scan: push operands, pop for operators','Operators are applied after their operands appear in postfix notation, naturally matching stack LIFO.','Operand order matters for minus and divide: pop right operand first, then left.','Convert A+B*C and explain operator precedence.');
lesson(4,33,'Evaluate postfix','Read left-to-right. Push numbers. On operator, pop right then left, compute left op right, push result.','Calculator: keep numbers on a pile until an operator asks for the latest two.','2 3 1 * + 9 -|Push 2,3,1|* → 3×1=3|+ → 2+3=5|- → 5-9=-4','The operand stack remembers unfinished computations without parentheses.','For subtraction, a-b uses the SECOND popped number minus the FIRST popped number.','Show full stack states and final result.');
lesson(4,34,'Recursion and call stack','A recursive function calls itself with a smaller problem and stops at a base case. Each call uses a stack frame containing local state and return information.','Russian dolls: open one smaller doll until the smallest, then close outward.','factorial(3)=3*factorial(2)|factorial(2)=2*factorial(1)|factorial(1)=1 (base case)|Return 2 then 6','The stack preserves each suspended call while a deeper call runs.','No reachable base case can cause unbounded recursion and stack overflow.','Define recursion, base case and factorial trace.','int fact(int n){\n if(n<=1)return 1;\n return n*fact(n-1);\n}');
lesson(4,35,'Recursion vs iteration','Iteration repeats via loops; recursion repeats via function calls. Both can solve many of the same problems, but recursion adds call-stack overhead.','Climbing steps: loop walks each step; recursion asks a smaller copy of the same problem.','Iteration: for/while maintains loop state|Recursion: parameters and local variables form frames|Choose recursive forms for naturally nested structures|Watch base cases and memory','Recursive tree traversal mirrors the structure of subtrees and is often easier to express.','Recursive is not necessarily faster or more memory-efficient.','Differences and factorial program.');
lesson(5,38,'Queue: FIFO','A queue is a linear ADT where first inserted leaves first. Enqueue happens at REAR; dequeue happens at FRONT.','Students waiting at a canteen counter.','enqueue(10), enqueue(20), enqueue(30)|Front=10, rear=30|dequeue() returns 10|Remaining [20,30]','Insertion and removal happen at opposite ends, preserving arrival order.','Do not swap the definitions of FRONT and REAR.','Define FIFO, enqueue, dequeue, peek with diagram.');
lesson(5,39,'Linear queue in an array','A fixed array queue tracks front and rear. In a simple non-shifting linear queue, dequeued positions at the front are not automatically reused.','A theatre line where used positions in front remain roped off.','Initial front=0 rear=-1 for one conventional setup|enqueue: increment rear, write|dequeue: read front, increment front|rear at final index may block more appends','Fixed rear indexing can report overflow even when earlier slots have become empty.','Initial sentinel conventions differ by implementation; write the ones your algorithm uses.','Explain false overflow with example.');
lesson(5,40,'Circular queue','Wrap indexes around the array using modulo. A typical circular queue with -1 empty sentinel is full when (rear+1)%CAP == front.','Roundabout: when you pass the last position, you return to the first available one.','rear=(rear+1)%CAP|front=(front+1)%CAP after dequeue|Empty: front==-1|Full: (rear+1)%CAP==front','Modulo reuses freed slots at the start, preventing false overflow.','When removing the last item, reset both front and rear to -1 in the sentinel-based implementation.','Conditions, pointer updates and circular diagram.');
lesson(5,42,'Linked queue','Maintain front and rear pointers to separate nodes. Enqueue attaches at rear; dequeue removes front and frees the node.','A train that can add carriages at the tail and detach from the front.','enqueue: new->next=NULL|If empty, front=rear=new|Else rear->next=new; rear=new|dequeue: front=front->next; free(old)|If now empty, set rear=NULL too','With both pointers, enqueue/dequeue can operate in O(1) without array shifting.','After removing the last node, rear must not point to freed memory.','Diagram + algorithms for enqueue/dequeue with pointers.');
lesson(5,43,'Priority queues','A priority queue serves elements based on priority rather than strictly arrival order. Elements with equal priority may be handled FIFO depending on implementation.','Hospital triage: emergencies get served before routine arrivals.','Store each item with a priority|Select highest-priority item first|Heaps can implement efficient priority queues','The service policy determines which element is eligible to leave next.','Do not describe a priority queue as ordinary FIFO across different priorities.','Define, examples, compare with normal queue.');
lesson(5,43,'Deque (double-ended queue)','A deque allows insertion and deletion at both front and rear. Input-restricted and output-restricted variants limit operations at one end.','A corridor with two doors: people can enter or leave at either end.','insertFront / insertRear|deleteFront / deleteRear|Input-restricted deque: insertion at one end|Output-restricted deque: deletion at one end','Two accessible ends make deques suitable for sliding-window and bidirectional tasks.','A deque and a priority queue are not the same thing.','Operations, restricted types and one use case.');
lesson(5,44,'Queues compared','Linear queue can waste freed front slots; circular queue reuses them; linked queue grows through nodes; priority queue changes serving order; deque supports both ends.','Different queue designs for different real-life counters.','Linear: fixed walk forward|Circular: wrap to start|Linked: nodes + two pointers|Priority: highest priority next|Deque: either end','Performance and behavior depend on the structure and its invariant.','Circular queue is still FIFO; wrapping changes storage, not service order.','Comparison table for five queue types.');
lesson(6,46,'Tree vocabulary','A tree is hierarchical with root, parent/child, siblings, leaves, internal nodes, depth, height and subtrees.','A family tree or company reporting chart.','Root: node with no parent|Parent/child: direct relation|Leaf: no children|Depth: edges from root|Height: longest downward path in edges','Hierarchy lets us describe recursive subproblems at each subtree.','Height and depth may be measured in edges or nodes; state convention.','Label a tree diagram with root, leaf, parent and height.');
lesson(6,47,'Binary tree types','In a binary tree each node has at most two children. Full means 0 or 2 children per node; complete fills levels left-to-right; perfect fills every level; degenerate forms a chain.','Full classroom rows versus a row with empty seats only at the far right.','Binary: ≤2 children|Full: 0 or 2 children|Complete: last level filled left-to-right|Perfect: all levels filled|Degenerate: chain-like','Tree shape matters for traversal, storage and search complexity.','A full binary tree is NOT necessarily a perfect tree.','Define each shape and sketch examples.');
lesson(6,47,'Tree memory representation','Linked trees use nodes with left/right pointers. Complete trees fit arrays well: with zero-based indexing, left=2i+1, right=2i+2, parent=floor((i-1)/2).','Family tree stored as people with child contacts, or neatly numbered seats.','Linked: {data,left,right}|Array 0-based: children 2i+1, 2i+2|Array 1-based: children 2i, 2i+1|Sparse trees can waste array positions','Index arithmetic follows the complete binary tree’s positional layout.','Do not mix 0-based formulas with 1-based examples.','Draw representation and write both indexing formulas.');
lesson(6,48,'Preorder, inorder & postorder','Three depth-first traversals: preorder Root–Left–Right; inorder Left–Root–Right; postorder Left–Right–Root. Apply recursively at every subtree.','Do you greet the parent before the children, between the children, or after both children?','Tree root=50; children 30 and 70; leaves 20,40,60,80|Pre: 50 30 20 40 70 60 80|In: 20 30 40 50 60 70 80|Post: 20 40 30 60 80 70 50','The single difference is when the root is visited relative to recursive subtree visits.','Only inorder of a BST with unique keys yields sorted values, not inorder of every binary tree.','Draw tree and trace all 3 traversals.');
lesson(6,50,'Binary Search Trees (BST)','BST requires every left-subtree value to be smaller and every right-subtree value larger (with a consistent duplicate policy). Search follows one branch per comparison.','A guessing game: smaller? go left. larger? go right.','Insert 50,30,70,20,40,60,80|Search 60: 50 → 70 → 60|Balanced search O(log n)|Skewed chain may be O(n)','Subtree ordering—not just child ordering—lets us discard one branch at every decision.','An ordinary BST does not auto-balance.','Insert/search algorithm, diagram and complexity for balanced/skewed.');
lesson(6,52,'Expression trees','Operators occupy internal nodes, operands are leaves. For (3+5)*(2-1), root is *, left child +, right child -. Preorder gives prefix and postorder postfix.','Math expression as a tiny family of operations.','Expression: (3+5)*(2-1)|Preorder: * + 3 5 - 2 1|Inorder: (3+5)*(2-1)|Postorder: 3 5 + 2 1 - *','Tree structure preserves parentheses/precedence while traversals provide different notations.','Plain inorder without grouping parentheses may change meaning.','Draw expression tree and write its three traversals.');
lesson(6,52,'Heaps vs BST','Binary heap is a complete binary tree with parent-child heap ordering. In min heap parents ≤ children; in max heap parents ≥ children. Heaps serve priority queues; BSTs serve ordered searches.','Heap = most urgent task on top; BST = filing cabinet arranged for lookups.','Min heap root is minimum|Max heap root is maximum|Heap needs complete shape|BST uses full left/right subtree key ordering','Heap property ensures rapid access to an extreme, not sorted inorder traversal.','Do not assume a heap’s inorder output is sorted.','Compare min/max heap and distinguish heap from BST.');

Q(1,4,'Which statement best defines a data structure?',['A set of syntax errors','Organization of data to support operations','A C compiler setting','Any single integer variable'],1,'Data structures describe how data and relationships are stored for efficient operations.','Think about organizing many values.','easy');
Q(1,4,'Which is an algorithm rather than a data structure?',['Array','Linked list','Steps for binary search','Tree'],2,'Binary search is a step-by-step procedure. Arrays, lists and trees organize data.');
Q(1,5,'Which one is non-linear?',['Queue','Stack','Tree','Array'],2,'Trees express parent-child branches rather than one logical sequence.','Which can branch?','easy');
Q(1,5,'A linked list is linear primarily because...',['Nodes are next to one another in RAM','Its nodes form a logical sequence','It has a fixed size','It stores only characters'],1,'Linear refers to logical order. Linked nodes may be at unrelated physical addresses.');
Q(1,5,'Which is typically dynamic?',['int a[10]','char name[20]','Nodes created with malloc()','A fixed-size constant array'],2,'malloc() obtains memory while the program runs.');
Q(1,6,'An ADT primarily describes...',['Only RAM addresses','Operations and expected behavior','Machine code instructions','Number of CPU cores'],1,'ADT specifies a behavior contract independent of implementation.');
Q(1,6,'Which is an example of updating an array?',['a[2] = 99','Shifting to remove element','Combining two arrays','Printing every element'],0,'Updating changes a stored value at an existing index.');
Q(1,7,'In C, what is the first index of an array?',['-1','0','1','2'],1,'C indexes from zero: a[0] is the first element.','Separate index from position.','easy');
Q(1,7,'What is a[3] in int a[]={6,8,10,12,14}?',['8','10','12','14'],2,'Index 3 is the fourth element, 12.');
Q(1,7,'An int array starts at address 1000 and each int uses 4 bytes. What is address of a[4]?',['1004','1012','1016','1020'],2,'Address = base + index × element size = 1000 + 4×4 = 1016.');
Q(1,7,'When inserting into a middle array position, which way do existing elements shift?',['Left from first to last','Right from last to first','Randomly','No shift is ever required'],1,'Move from the end toward the insert position so values are not overwritten.');
Q(1,8,'A single loop that visits n elements is usually...',['O(1)','O(log n)','O(n)','O(n²)'],2,'The work grows proportionally to the number of elements.');
Q(1,8,'Two nested loops each running n times generally yield...',['O(n²)','O(n)','O(log n)','O(1)'],0,'n passes of n operations yield n² work.');
Q(1,8,'What is the key distinction between time and space complexity?',['Time counts memory; space counts operations','Time counts growth of work; space counts growth of memory','They are the same','Both always count seconds'],1,'Time measures computation growth, space memory growth.');
Q(1,7,'Which statement about array capacity is correct?',['Capacity automatically grows when writing past the end','Capacity and occupied length are always equal','Allocated capacity may exceed occupied length','Deleting changes the array data type'],2,'A fixed-capacity array can have unused slots; n tracks logical occupancy.');
Q(2,11,'What must be true before applying ordinary binary search?',['The array must be sorted','The array must be circular','The array must be empty','All numbers must be positive'],0,'Sorted order lets binary search discard half of the candidates safely.','Think about why one half can be ignored.','easy');
Q(2,11,'Worst-case iterative linear search complexity?',['O(1)','O(log n)','O(n)','O(n log n)'],2,'If key is absent or last, every element may be examined.');
Q(2,12,'For sorted [2,4,6,8,10], key=8, first midpoint index is...',['0','1','2','3'],2,'low=0, high=4, mid=(0+4)/2=2.');
Q(2,12,'Binary search finds the key larger than a[mid]. Update which boundary?',['high=mid-1','low=mid+1','high=mid','low=0'],1,'Larger keys can only be to the right in ascending sorted data.');
Q(2,14,'Bubble sort swaps which pair?',['Two farthest items','Two adjacent out-of-order items','Only pivot elements','Only smallest and largest items'],1,'Bubble sort operates on neighbors.','Focus on its inner loop.','easy');
Q(2,14,'When is optimized bubble sort O(n) in best case?',['When it lacks a swap flag','When it notices an entire pass has no swaps','When the data is reversed','When n is always one'],1,'A no-swap pass stops the algorithm after one scan of already-sorted input.');

FROM THIS BOOK","k":"h"},{"t":"For a new concept, read the explanation and the worked trace before looking at the program. Cover the program and\ntry to explain the algorithm in plain language. Finally, write a 4- or 6-mark answer without looking. If the question asks\nfor a program, practise the entire code and one sample output.","k":"p"},{"t":"The six chapters","k":"h"},{"t":"01 / Foundations and Arrays\nADT, classification, algorithms, complexity, array operations","k":"p"},{"t":"02 / Searching and Sorting\nLinear/binary search; five sorting methods; traces and complexity","k":"p"},{"t":"03 / Linked Lists\nMemory, pointers, singly/doubly/circular lists, insertion and deletion","k":"p"},{"t":"04 / Stacks and Recursion\nLIFO, array/linked implementations, expressions and recursive calls","k":"p"},{"t":"05 / Queues\nFIFO, array/linked queues, circular buffers, priority and deque","k":"p"},{"t":"06 / Trees\nTerminology, types, BST, traversals, expression trees and heaps","k":"p"}]},{"p":3,"unit":0,"chapter":"Front Matter","title":"How to write a strong 4–6 mark answer","blocks":[{"t":"How to write a strong 4–6 mark answer","k":"h"},{"t":"A confident answer usually has four parts: (1) a precise definition, (2) an accurately labelled diagram or algorithm, (3) a small worked example, and (4) a complexity, advantage, limitation or application when the question asks for it. For a comparison, use a table; for sorting, show each pass; for linked lists, show how the links change; for trees, number the traversal sequence. Empty definitions and unexplained code are weaker than a shorter, reasoned solution.","k":"p"},{"t":"A NOTE ON C","k":"h"},{"t":"All code in the new edition uses standard C99 syntax. Small examples prioritize clarity over a production-ready\ninterface. The full practical workbook at the back contains additional variants, including strings and linked\nimplementations.","k":"p"}]},{"p":4,"unit":1,"chapter":"Foundations & Arrays","title":"Foundations & arrays","blocks":[{"t":"Foundations & arrays","k":"h"},{"t":"Before choosing a clever algorithm, choose a sensible way to\norganize the data.","k":"p"},{"t":"COURSE R23CI2602 \n·\n PRIMARY SOURCE: UNIT 1 ASSIGNMENT & SLA UNIT I","k":"p"},{"t":"T H E  C E N T R A L I D E A","k":"h"},{"t":"Imagine managing 500 student roll numbers. The roll numbers are not a difficult problem; the\ndifficult part is deciding how they live in memory and which operations must be quick. A data\nstructure answers that question. A fixed-size classroom list may fit an array. A waiting list that\nchanges often may fit a linked list. A history of Undo actions may fit a stack. The structure follows\nthe behavior of the problem, not the other way round.","k":"p"},{"t":"1.1 What exactly is a data structure?","k":"h"},{"t":"A data structure is a particular way of organizing data in memory so that operations such as reading, updating, searching, inserting, deleting and traversing can be carried out in a predictable way. The word structure matters: it tells us how one element relates to another. For example, five integers can sit together in an array, form five nodes linked by addresses, or appear as nodes in a tree.","k":"p"},{"t":"A data type tells the language what an individual value is (for example, int , char  or float ). A data structure arranges many values and their relationships. An algorithm is the finite sequence of steps that operates on that structure. In an exam answer, distinguish these three ideas clearly; a data structure is not simply a program.","k":"p"},{"t":"Consider a college canteen. If you only have three students, writing their names anywhere works. If you have hundreds of students arriving and leaving, the order of service matters. The structure must preserve","k":"p"}]},{"p":5,"unit":1,"chapter":"Foundations & Arrays","title":"Why do we need them?","blocks":[{"t":"that order efficiently. This is why data structures are needed even when the underlying values are just simple integers.","k":"p"},{"t":"F I G U R E  —  F R O M  A P R O B L E M  TO  A C H O I C E  O F S T R U C T U R E","k":"p"},{"t":"Problem\nChoose a structure\nChoose operations","k":"p"},{"t":"The same values may be stored differently depending on how they will be used.","k":"p"},{"t":"Why do we need them?","k":"h"},{"t":"Efficient access means finding what you need without unnecessary checks. Efficient updates means adding and removing records without excessive movement of unrelated data. Predictable memory use helps a program run within a limited amount of RAM. Clear program design makes a system easier to test and modify. Each structure has a trade-off: an array is excellent for direct indexing but expensive for middle insertion; a linked list grows dynamically but needs extra pointer memory.","k":"p"},{"t":"1.2 Classification: six labels that examiners expect","k":"h"},{"t":"Classification\nMeaning\nExample and important point","k":"p"},{"t":"Primitive\nA basic built-in value such as `int`, `char`, `float`.\nHolds one logical item; the language\nprovides its operations.","k":"p"},{"t":"Non-\nprimitive\nA collection or arrangement built from simpler\nvalues.\nArray, stack, queue, linked list, tree.","k":"p"},{"t":"Linear\nElements follow a sequence; typically one logical\npredecessor and successor.\nArray, list, stack, queue. Does not mean\ncontiguous memory.","k":"p"},{"t":"Non-linear\nElements branch or form hierarchical / network\nrelationships.\nTree, graph. A node may have several\nchildren.","k":"p"},{"t":"Static\nCapacity is fixed once allocated for a particular\nstorage object.\n`int a[10]` always has room for ten\nintegers.","k":"p"},{"t":"Dynamic\nStorage is obtained or released while the program is\nrunning.\nList nodes created using `malloc()` and\nreleased using `free()`.","k":"code"},{"t":"Two common confusions: (1) A singly linked list is linear even if its nodes lie in different addresses, because its logical order is a sequence. (2) Static versus dynamic describes storage behavior, not","k":"p"}]},{"p":6,"unit":1,"chapter":"Foundations & Arrays","title":"1.3 The Abstract Data Type (ADT)","blocks":[{"t":"whether values can change. An element in a static array can be updated; what cannot expand automatically is the array capacity.","k":"p"},{"t":"1.3 The Abstract Data Type (ADT)","k":"h"},{"t":"An ADT describes the values and allowed operations of a structure, while leaving the internal representation hidden. Think of a TV remote: the buttons say what the user can do; the user does not need to know how electrical signals are generated. A stack ADT specifies operations such as push(x) , pop() , peek()  and isEmpty() . We can implement that behavior with an array or a linked list.","k":"p"},{"t":"Its useful features are abstraction (describe behavior rather than internal detail), encapsulation (keep the representation controlled), a defined interface (callers know which operations exist), and implementation independence (two implementations can satisfy the same rules). An ADT is not automatically faster; it primarily makes the contract of a data structure precise.","k":"p"},{"t":"F I G U R E  —  A DT A N D  I M P L E M E N TAT I O N  A R E  N OT T H E  SA M E","k":"p"},{"t":"STACK ADT","k":"h"},{"t":"push / pop / peek","k":"h"},{"t":"Array implementation\nLinked implementation","k":"h"},{"t":"1.4 Operations on data structures","k":"h"},{"t":"Operation\nWhat it means\nArray example","k":"p"},{"t":"Traversal\nVisit elements systematically.\nPrint `a[0]` through `a[n-1]`.","k":"p"},{"t":"Insertion\nAdd a new element.\nShift items right before placing a new one.","k":"p"},{"t":"Deletion\nRemove an existing element.\nShift following items left.","k":"p"},{"t":"Searching\nFind the position of a value.\nCheck elements until the key appears.","k":"p"},{"t":"Updating\nChange an existing value.\n`a[2] = 99`.","k":"p"},{"t":"Sorting\nRearrange into an order.\nAscending marks: 31, 43, 52.","k":"p"},{"t":"Merging\nCombine collections.\nJoin two sorted arrays into one.","k":"p"}]},{"p":7,"unit":1,"chapter":"Foundations & Arrays","title":"1.5 Arrays: size, capacity and addresses","blocks":[{"t":"1.5 Arrays: size, capacity and addresses","k":"h"},{"t":"An array stores same-type elements in contiguous memory locations. In C, a[0]  is the first element because indexing measures an offset from the array's starting address. If an int  occupies four bytes on a machine, the address of a[i]  is base + i × 4 . This address arithmetic makes accessing a known index constant-time: O(1) .","k":"p"},{"t":"There is a crucial distinction between capacity and logical length. If an array has capacity 8 but currently contains 5 records, we should treat only indices 0 through 4 as occupied. To insert a new record, ensure the length is smaller than the capacity before shifting. Writing into a[8]  for an eight-element C array is invalid; C will not automatically stop you.","k":"p"},{"t":"F I G U R E  —  A R R AY I N D I C E S ;  T H E  I N D E X  I S  N OT T H E  S TO R E D  VA LU E","k":"p"},{"t":"The value 28 is at index 2, but the third position in ordinary counting.","k":"p"},{"t":"Worked trace: insert 99 at index 2","k":"h"},{"t":"Start with a = [10, 20, 30, 40] , length 4 and capacity 6. We want 99 at index 2. If we write immediately at index 2, we lose 30. The safe order is to shift from right to left: move 40 from index 3 to 4, then 30 from index 2 to 3. Now place 99 at index 2 and increase the logical length to 5.","k":"p"},{"t":"Step\nContents after the step\nWhy","k":"p"},{"t":"Start\n10, 20, 30, 40, _, _\nTwo free slots exist.","k":"p"},{"t":"Move 40\n10, 20, 30, 40, 40, _\nCopy the last used element to the free slot.","k":"p"},{"t":"Move 30\n10, 20, 30, 30, 40, _\nOpen index 2 without losing 30.","k":"p"},{"t":"Write new item\n10, 20, **99**, 30, 40, _\nStore at index 2 and update length to 5.","k":"p"},{"t":"Insertion at the end can take O(1)  when capacity is available; insertion near the beginning requires shifting up to n  elements and takes O(n) . For deletion at index 1 from [10,20,99,30,40] , copy 99 into index 1, 30 into index 2, and 40 into index 3. Set length to 4. Remember: deletion does not have to erase the old final memory slot; it changes which slots are logically part of the array.","k":"p"}]},{"p":8,"unit":1,"chapter":"Foundations & Arrays","title":"PROGRAM 01 / C99","blocks":[{"t":"PROGRAM 01 / C99\nArray insert, delete and display","k":"h"},{"t":"#include <stdio.h>\n#define CAP 10\nint main(void) {\n    int a[CAP] = {10, 20, 30, 40};\n    int n = 4, pos = 2, value = 99;\n    if (n < CAP && pos >= 0 && pos <= n) {\n        for (int i = n; i > pos; i--)\n            a[i] = a[i - 1];\n        a[pos] = value;\n        n++;\n    }\n    /* Delete the element at index 1. */\n    pos = 1;\n    if (pos >= 0 && pos < n) {\n        for (int i = pos; i < n - 1; i++)\n            a[i] = a[i + 1];\n        n--;\n    }\n    for (int i = 0; i < n; i++)\n        printf(\"%d \", a[i]);\n    printf(\"\\n\");\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"10 99 30 40","k":"h"},{"t":"How the program works. The variables n  and CAP  have different meanings. CAP  prevents overflow; n tracks occupied slots. The insertion loop goes backward because shifting forward would overwrite data we still need. The deletion loop goes forward because each element must fill the gap to its left. Both operations are O(n)  in the worst case and use O(1)  extra storage.","k":"p"},{"t":"1.6 Algorithms, time and space complexity","k":"h"},{"t":"An algorithm is a finite series of unambiguous instructions with input, output and a stopping condition. In Data Structures, it is not enough that an algorithm works on four numbers. We also ask: what happens","k":"p"},{"t":"if we give it 400,000 numbers?","k":"h"},{"t":"Time complexity studies how the number of basic operations grows as input size n  grows. Space complexity studies additional memory used as input grows; be explicit whether you are discussing auxiliary space or including the input storage. Big O describes an asymptotic upper bound. For a simple exam discussion, we usually use it to state the worst-case growth class, but Big O itself does not always mean worst case.","k":"p"},{"t":"A single array access is O(1) . A loop over n  elements is usually O(n) . Two nested loops that each run approximately n  times usually give O(n²) . Binary search halves the search range each round, yielding O(log n) . Doubling the input does not necessarily double the running time; the growth class predicts the trend, not the exact number of seconds.","k":"p"}]},{"p":9,"unit":1,"chapter":"Foundations & Arrays","title":"COMPARING ORDERS","blocks":[{"t":"Growth\nExample for n = 8\nExample for n = 1024\nTypical idea","k":"p"},{"t":"O(1)\n1 unit\n1 unit\nFixed amount of work","k":"p"},{"t":"O(log₂ n)\n3 units\n10 units\nKeep halving the problem","k":"p"},{"t":"O(n)\n8 units\n1,024 units\nInspect each item","k":"p"},{"t":"O(n log₂ n)\n24 units\n10,240 units\nEfficient divide and combine","k":"p"},{"t":"O(n²)\n64 units\n1,048,576 units\nCompare many pairs","k":"p"},{"t":"COMPARING ORDERS","k":"h"},{"t":"Ignore constants when describing Big O growth: `3n+5` and `n` belong to the same `O(n)` class. That does not mean\nconstants are irrelevant in a real program, only that Big O focuses on how growth changes as n becomes large.","k":"p"},{"t":"Time–space trade-off","k":"h"},{"t":"A program can sometimes use more memory to avoid repeating work. Suppose you repeatedly search for whether a small integer has appeared before. You might scan an array every time (little extra memory, more repeated work) or keep a separate lookup table (more extra memory, faster checks). Neither choice is universally better; the appropriate choice depends on memory limits, search frequency and input size. State which resource increases and which resource decreases in exam answers.","k":"p"},{"t":"Exam answers: Unit 1","k":"h"},{"t":"Q1. Explain the need and advantages of data structures.","k":"h"},{"t":"Data structures provide organized storage and enable efficient operations on collections of values. They improve data access, searching, insertion, deletion, update and traversal. Appropriate structures also help manage memory and make algorithms clearer. For example, an array supports direct indexed access in O(1) , while a linked list can insert a new node at the head in O(1)  without shifting every element. The key advantage is choosing a representation suited to the operations performed most often.","k":"p"},{"t":"Examiner expects: Definition, at least four benefits, and one relevant example.","k":"p"}]},{"p":10,"unit":1,"chapter":"Foundations & Arrays","title":"Q2. Differentiate primitive and non-primitive; linear and non-linear; static and dynamic.","blocks":[{"t":"Q2. Differentiate primitive and non-primitive; linear and non-linear; static and dynamic.","k":"h"},{"t":"Primitive structures are built-in simple types such as integers and characters; non-primitive structures organize multiple values (arrays, lists, stacks and trees). Linear structures have a sequential logical arrangement such as an array or queue; non-linear structures have hierarchical or network relationships such as a tree or graph. Static structures have fixed capacity for a given allocation, whereas dynamic structures acquire or release storage during execution. The classifications describe different properties and may overlap: a linked list is non-primitive, linear and dynamic.","k":"p"},{"t":"Examiner expects: Write a separate table for each comparison if marks permit.","k":"p"},{"t":"Q3. Define Abstract Data Type and describe its features.","k":"h"},{"t":"An ADT specifies a set of values and operations without stating how those operations are implemented. It gives an interface, supports abstraction and encapsulation, and lets code use the same behavior with different internal implementations. A stack ADT permits push , pop  and peek ; the actual stack may be an array or linked list. The LIFO rule is part of its behavior, regardless of representation.","k":"p"},{"t":"Examiner expects: Distinguish ADT behavior from implementation.","k":"p"},{"t":"Q4. Explain time complexity, space complexity and time–space trade-off.","k":"h"},{"t":"Time complexity measures how the number of operations grows with input size n ; space complexity measures memory requirements as n  grows. Examples: array access is O(1) , linear search is O(n) , and binary search on sorted data is O(log n) . A time–space trade-off arises when extra memory reduces computation or a memory-saving method needs more computation. Example: storing previously computed results avoids recalculation but consumes memory.","k":"p"},{"t":"Examiner expects: Define each term, give a growth example and one trade-off.","k":"p"},{"t":"Q5. Describe array creation, insertion, deletion and display.","k":"h"},{"t":"For creation, reserve capacity and initialize the occupied elements. For insertion at index p , check capacity, shift elements from n-1  down to p  one position to the right, write the value at p  and increment n . For deletion at index p , shift elements from p+1  through n-1  left and decrement n . For display, loop from index 0  through n-1 . Worst-case insertion/deletion time is O(n) ; display is O(n) .","k":"p"},{"t":"Examiner expects: Show both shift directions and avoid out-of-range indexes.","k":"p"},{"t":"Check your understanding","k":"h"},{"t":"Can you explain why a linked list is linear but not contiguous? Why an array still needs a separate logical length when it has spare capacity? Why Big O is a growth bound rather than a stopwatch reading?","k":"p"}]},{"p":11,"unit":2,"chapter":"Searching & Sorting","title":"Searching & sorting","blocks":[{"t":"Searching & sorting","k":"h"},{"t":"One family of algorithms finds a value. The other makes the\nentire collection easier to use.","k":"p"},{"t":"COURSE R23CI2602 \n·\n PRIMARY SOURCE: UNIT 2 ASSIGNMENTS & SLA UNIT II","k":"p"},{"t":"T H E  C E N T R A L I D E A","k":"h"},{"t":"Imagine the prices [25, 10, 40, 15, 30] . Searching asks where 15 is; sorting rearranges all five\nvalues into an order. The two operations are connected: binary search can use its speed only when\nthe relevant values are sorted. The Unit 2 assignment explicitly covers linear search, binary search,\nbubble, selection, insertion, quick and merge sort, including traces and complexity. Every one is\nworth understanding as a process, not merely memorizing a definition.","k":"p"},{"t":"2.1 Linear search: the dependable baseline","k":"h"},{"t":"A linear search begins at the first element, compares it with the search key, then continues until a match is found or the collection ends. It does not require sorted data. Its simplicity is its strength: it works on the original unsorted list and can stop as soon as it finds the first matching value.","k":"p"},{"t":"For [25, 10, 40, 15, 30]  and key 15 , comparisons go 25 ≠ 15 , 10 ≠ 15 , 40 ≠ 15 , 15 = 15 . We report index 3 (position 4) after four comparisons. If the key is the first element, best-case time is O(1) . If it is absent or last, worst-case time is O(n) . Average time also grows linearly, and iterative linear search uses O(1)  auxiliary space.","k":"p"}]},{"p":12,"unit":2,"chapter":"Searching & Sorting","title":"PROGRAM 02 / C99","blocks":[{"t":"F I G U R E  —  L I N E A R  S E A R C H  S TO P S  AT T H E  F I R S T M ATC H","k":"p"},{"t":"Index 3 contains key 15; elements to the right are not inspected after the match.","k":"p"},{"t":"PROGRAM 02 / C99\nIterative linear search","k":"h"},{"t":"#include <stdio.h>\nint main(void) {\n    int a[] = {25, 10, 40, 15, 30};\n    int n = 5, key = 15, pos = -1;\n    for (int i = 0; i < n; i++) {\n        if (a[i] == key) {\n            pos = i;\n            break;\n        }\n    }\n    if (pos == -1) printf(\"Not found\\n\");\n    else printf(\"Found at index %d\\n\", pos);\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"Found at index 3","k":"h"},{"t":"How the program works. The sentinel pos = -1  means not found. Each iteration examines one candidate. A break  exits immediately on success; without it, the code might unnecessarily continue, or report the last matching position instead of the first. The program compares values rather than indexes.","k":"p"},{"t":"2.2 Binary search: halve the possibilities","k":"h"},{"t":"A binary search requires a sorted collection. Keep two boundaries, low  and high . Calculate mid = low + (high-low)/2  to avoid potential overflow from adding large indexes. If the middle item equals the key, stop. If the key is smaller, ignore the right half by setting high = mid-1 ; if larger, ignore the left half with low = mid+1 . Only one half can still contain the key because the data is sorted.","k":"p"},{"t":"Example: sorted data [5, 12, 18, 26, 31, 47, 59, 63, 77] , search for 59. First low=0 , high=8 , mid=4 , value 31. Since 59 is larger, choose indexes 5–8. Next mid=6 , value 59: found. An unsorted array breaks the reasoning—discarding a half would no longer be safe.","k":"p"}]},{"p":13,"unit":2,"chapter":"Searching & Sorting","title":"PROGRAM 03 / C99","blocks":[{"t":"Iteration\nlow\nhigh\nmid\na[mid]\nDecision","k":"p"},{"t":"1\n0\n8\n4\n31\n59 > 31; search indexes 5…8","k":"p"},{"t":"2\n5\n8\n6\n59\nFound at index 6","k":"p"},{"t":"PROGRAM 03 / C99\nBinary search on sorted integers","k":"h"},{"t":"#include <stdio.h>\nint main(void) {\n    int a[] = {5, 12, 18, 26, 31, 47, 59, 63, 77};\n    int low = 0, high = 8, key = 59;\n    int pos = -1;\n    while (low <= high) {\n        int mid = low + (high - low) / 2;\n        if (a[mid] == key) { pos = mid; break; }\n        if (key < a[mid]) high = mid - 1;\n        else low = mid + 1;\n    }\n    printf(\"Index = %d\\n\", pos);\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"Index = 6","k":"h"},{"t":"How the program works. The loop continues while the candidate interval is nonempty. Each comparison halves the remaining interval. That gives best case O(1)  (key equals the first midpoint) and worst/ average O(log n) . This iterative version needs O(1)  extra memory. It presumes ascending order; for descending data, comparison directions must be reversed.","k":"p"},{"t":"Linear search versus binary search","k":"h"},{"t":"Property\nLinear\nBinary","k":"p"},{"t":"Input ordering\nAny order\nMust be sorted","k":"p"},{"t":"Strategy\nOne-by-one comparison\nCompare midpoint and discard half","k":"p"},{"t":"Best / worst time\nO(1) / O(n)\nO(1) / O(log n)","k":"p"},{"t":"Extra space (iterative)\nO(1)\nO(1)","k":"p"},{"t":"Good use case\nShort/unsorted collection\nRepeated lookup in a large sorted collection","k":"p"}]},{"p":14,"unit":2,"chapter":"Searching & Sorting","title":"2.3 Sorting: what does one pass accomplish?","blocks":[{"t":"2.3 Sorting: what does one pass accomplish?","k":"h"},{"t":"Sorting arranges values in ascending, descending or another specified order. Internal sorting happens when the working data fits in main memory; external sorting is used for data too large to fit at once and often relies on disk-based merging. The Unit 2 assignment expects algorithms, advantages, limitations, best/average/worst complexity and worked passes. A sorting answer should show how the list changes —writing only the final sorted list does not demonstrate understanding.","k":"p"},{"t":"Bubble sort: repeated adjacent exchanges","k":"h"},{"t":"Compare adjacent elements and swap them if they are out of order. After one full left-to-right pass, the largest remaining item has moved to its final position at the right. On each later pass, the unsorted section becomes one item shorter. In an optimized bubble sort, a pass with no swaps means the array is already sorted and we can stop early.","k":"p"},{"t":"Pass\nArray after pass\nWhat becomes fixed","k":"p"},{"t":"Start\n5, 1, 4, 2, 8\nNothing","k":"p"},{"t":"1\n1, 4, 2, 5, **8**\n8 is at the end","k":"p"},{"t":"2\n1, 2, 4, **5**, 8\n5 is in place","k":"p"},{"t":"3\n1, 2, **4**, 5, 8\nAll elements now sorted","k":"p"},{"t":"PROGRAM 04 / C99\nBubble sort with early stop","k":"h"},{"t":"#include <stdio.h>\nint main(void) {\n    int a[] = {5, 1, 4, 2, 8}, n = 5;\n    for (int i = 0; i < n - 1; i++) {\n        int swapped = 0;\n        for (int j = 0; j < n - i - 1; j++) {\n            if (a[j] > a[j + 1]) {\n                int t = a[j];\n                a[j] = a[j + 1];\n                a[j + 1] = t;\n                swapped = 1;\n            }\n        }\n        if (!swapped) break;\n    }\n    for (int i = 0; i < n; i++) printf(\"%d \", a[i]);\n    printf(\"\\n\");\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"1 2 4 5 8","k":"h"}]},{"p":15,"unit":2,"chapter":"Searching & Sorting","title":"Selection sort: choose the smallest remaining value","blocks":[{"t":"How the program works. The outer loop counts passes; the inner loop compares pairs. n-i-1  avoids rechecking the largest items already settled at the right. The temporary variable t  prevents losing an item during a swap. With the no-swap flag, best case is O(n) ; average/worst are O(n²) . Extra memory is O(1) .","k":"p"},{"t":"Selection sort: choose the smallest remaining value","k":"h"},{"t":"Divide the array into a sorted prefix and an unsorted suffix. Find the smallest item in the suffix and swap it into the first unsorted position. Example on [4, 9, 2, 6, 1, 8] : first minimum is 1, so swap it with 4, producing [1, 9, 2, 6, 4, 8] . Next minimum is 2, so place it in index 1: [1, 2, 9, 6, 4, 8] . Continue until all positions are fixed. It makes comparatively few swaps, but it still scans the suffix even for sorted input, so best/average/worst time are all O(n²) .","k":"p"},{"t":"Pass\nMinimum selected\nArray","k":"p"},{"t":"1\n1\n1, 9, 2, 6, 4, 8","k":"p"},{"t":"2\n2\n1, 2, 9, 6, 4, 8","k":"p"},{"t":"3\n4\n1, 2, 4, 6, 9, 8","k":"p"},{"t":"4\n6\n1, 2, 4, 6, 9, 8","k":"p"},{"t":"5\n8\n1, 2, 4, 6, 8, 9","k":"p"},{"t":"PROGRAM 05 / C99\nSelection sort","k":"h"},{"t":"#include <stdio.h>\nint main(void) {\n    int a[] = {4, 9, 2, 6, 1, 8}, n = 6;\n    for (int i = 0; i < n - 1; i++) {\n        int min = i;\n        for (int j = i + 1; j < n; j++)\n            if (a[j] < a[min]) min = j;\n        int temp = a[i];\n        a[i] = a[min];\n        a[min] = temp;\n    }\n    for (int i = 0; i < n; i++) printf(\"%d \", a[i]);\n    printf(\"\\n\");\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"1 2 4 6 8 9","k":"h"},{"t":"How the program works. min  stores an index, not the minimum value itself. Search only from i+1 onward because positions before i  are already fixed. Each outer iteration puts one smallest remaining item into its final place. The routine is O(n²)  even in its best case, with O(1)  auxiliary space.","k":"p"}]},{"p":16,"unit":2,"chapter":"Searching & Sorting","title":"Insertion sort: grow a sorted prefix","blocks":[{"t":"Insertion sort: grow a sorted prefix","k":"h"},{"t":"Think of arranging playing cards in your hand. Treat the first item as sorted. Take the next item, called key , shift all larger values one place to the right and place key  into the newly opened gap. On [74, 34, 44, 14, 84, 24] : after inserting 34, the prefix is [34,74] ; after inserting 44, it becomes [34,44,74] ; after inserting 14, it becomes [14,34,44,74] . That is why insertion sort can be efficient when data is already nearly sorted—only a few shifts may be needed.","k":"p"},{"t":"Inserted key\nSorted prefix after insertion","k":"h"},{"t":"34\n34, 74","k":"h"},{"t":"44\n34, 44, 74","k":"h"},{"t":"14\n14, 34, 44, 74","k":"h"},{"t":"84\n14, 34, 44, 74, 84","k":"h"},{"t":"24\n14, 24, 34, 44, 74, 84","k":"h"},{"t":"PROGRAM 06 / C99\nInsertion sort","k":"h"},{"t":"#include <stdio.h>\nint main(void) {\n    int a[] = {74, 34, 44, 14, 84, 24};\n    int n = 6;\n    for (int i = 1; i < n; i++) {\n        int key = a[i], j = i - 1;\n        while (j >= 0 && a[j] > key) {\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = key;\n    }\n    for (int i = 0; i < n; i++) printf(\"%d \", a[i]);\n    printf(\"\\n\");\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"14 24 34 44 74 84","k":"h"},{"t":"How the program works. key  is saved before shifting, because its original slot may be overwritten. Moving j  to the left finds the correct insertion position. j+1  is the resulting free position, even when the key belongs at index 0. Best case is O(n) ; average/worst are O(n²) ; extra memory is O(1) .","k":"p"}]},{"p":17,"unit":2,"chapter":"Searching & Sorting","title":"2.4 Divide-and-conquer sorts","blocks":[{"t":"2.4 Divide-and-conquer sorts","k":"h"},{"t":"Merge sort: divide, sort the pieces, merge","k":"h"},{"t":"Merge sort splits an array into two parts repeatedly until each subarray contains only one item. A one- item array is already sorted. It then merges sorted halves, choosing the smaller front element each time. Example [19, 64, 5, 16, 13, 99, 2]  splits into [19,64,5]  and [16,13,99,2] ; the recursive halves eventually become sorted [5,19,64]  and [2,13,16,99] ; the final merge gives [2,5,13,16,19,64,99] .","k":"p"},{"t":"Because there are roughly log₂ n  levels and each level processes n  items while merging, time is O(n log n)  in best, average and worst cases. Array-based merge sort usually requires O(n)  auxiliary space for the merge buffer. This predictable worst-case time is its major advantage over quick sort.","k":"p"},{"t":"Stage\nLeft half\nRight half","k":"p"},{"t":"Divide\n19, 64, 5\n16, 13, 99, 2","k":"p"},{"t":"Sort halves\n5, 19, 64\n2, 13, 16, 99","k":"p"},{"t":"Final merge\n2, 5, 13, 16, 19, 64, 99\n—","k":"p"},{"t":"PROGRAM 07 / C99\nMerge sort: complete working implementation","k":"h"},{"t":"#include <stdio.h>\nvoid merge(int a[], int tmp[], int lo, int mid, int hi) {\n    int i = lo, j = mid + 1, k = lo;\n    while (i <= mid && j <= hi)\n        tmp[k++] = (a[i] <= a[j]) ? a[i++] : a[j++];\n    while (i <= mid) tmp[k++] = a[i++];\n    while (j <= hi) tmp[k++] = a[j++];\n    for (int x = lo; x <= hi; x++) a[x] = tmp[x];\n}\nvoid sort(int a[], int t[], int lo, int hi) {\n    if (lo >= hi) return;\n    int mid = lo + (hi - lo) / 2;\n    sort(a, t, lo, mid);\n    sort(a, t, mid + 1, hi);\n    merge(a, t, lo, mid, hi);\n}\nint main(void) {\n    int a[] = {19, 64, 5, 16, 13, 99, 2};\n    int temp[7];\n    sort(a, temp, 0, 6);\n    for (int i = 0; i < 7; i++) printf(\"%d \", a[i]);\n    printf(\"\\n\");\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"2 5 13 16 19 64 99","k":"h"}]},{"p":18,"unit":2,"chapter":"Searching & Sorting","title":"Quick sort: choose a pivot and partition","blocks":[{"t":"How the program works. sort  recursively processes each half. The stopping condition lo >= hi handles a zero- or one-item range. merge  compares the next unmerged values, transfers the smaller one to tmp , then copies any leftovers and writes the merged region back to a . Passing a single shared temporary array saves allocating a new buffer at every recursive call.","k":"p"},{"t":"Quick sort: choose a pivot and partition","k":"h"},{"t":"Quick sort chooses a pivot and rearranges elements so smaller/equal values appear on one side and larger values on the other. After partitioning, the pivot is in its final position; the same procedure sorts the two remaining sections recursively. It is often efficient on practical in-memory data. Its average time is O(n log n) , but a consistently poor pivot can produce very unbalanced partitions and O(n²)  worst- case time.","k":"p"},{"t":"For [24,9,29,14,19,27] , if the last element 27  is the pivot, one valid Lomuto partition produces [24,9,14,19,27,29]  with pivot 27 at index 4. The left subarray still needs sorting, and the right contains just 29. Different partition schemes may produce different intermediate arrays; the final sorted order is the same.","k":"p"},{"t":"PROGRAM 08 / C99\nQuick sort: last-element pivot","k":"h"},{"t":"#include <stdio.h>\nvoid swap(int *a, int *b) {\n    int t = *a; *a = *b; *b = t;\n}\nint partition(int a[], int lo, int hi) {\n    int pivot = a[hi], i = lo - 1;\n    for (int j = lo; j < hi; j++) {\n        if (a[j] <= pivot) {\n            i++;\n            swap(&a[i], &a[j]);\n        }\n    }\n    swap(&a[i + 1], &a[hi]);\n    return i + 1;\n}\nvoid quick(int a[], int lo, int hi) {\n    if (lo >= hi) return;\n    int p = partition(a, lo, hi);\n    quick(a, lo, p - 1);\n    quick(a, p + 1, hi);\n}\nint main(void) {\n    int a[] = {24, 9, 29, 14, 19, 27};\n    quick(a, 0, 5);\n    for (int i = 0; i < 6; i++) printf(\"%d \", a[i]);\n    printf(\"\\n\");\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"9 14 19 24 27 29","k":"h"},{"t":"How the program works. partition  scans from lo  up to (but not including) the pivot. i  tracks the end of the smaller-or-equal region. Each eligible value is swapped into that region. Finally the pivot is placed","k":"p"}]},{"p":19,"unit":2,"chapter":"Searching & Sorting","title":"2.5 One comparison table to remember","blocks":[{"t":"at i+1  and the recursive calls exclude its final index. Average recursion space is O(log n) , worst O(n) for severely unbalanced partitions.","k":"p"},{"t":"2.5 One comparison table to remember","k":"h"},{"t":"Method\nBest\nAverage\nWorst\nExtra memory","k":"p"},{"t":"Linear search\nO(1)\nO(n)\nO(n)\nO(1)","k":"p"},{"t":"Binary search, iterative\nO(1)\nO(log n)\nO(log n)\nO(1)","k":"p"},{"t":"Bubble with early stop\nO(n)\nO(n²)\nO(n²)\nO(1)","k":"p"},{"t":"Selection\nO(n²)\nO(n²)\nO(n²)\nO(1)","k":"p"},{"t":"Insertion\nO(n)\nO(n²)\nO(n²)\nO(1)","k":"p"},{"t":"Merge sort (array)\nO(n log n)\nO(n log n)\nO(n log n)\nO(n)","k":"p"},{"t":"Quick sort\nO(n log n)\nO(n log n)\nO(n²)\nO(log n) avg stack","k":"p"},{"t":"ALWAYS SPECIFY THE VARIANT","k":"h"},{"t":"Bubble sort has `O(n)` best case only when an early-stop test is included. A naive bubble sort keeps doing passes even if\nno swap occurs, and is `O(n²)` in its best case too. Complexity questions reward that qualification.","k":"p"},{"t":"Exam answers: Unit 2","k":"h"},{"t":"Q1. Differentiate linear and binary search with algorithm and requirements.","k":"h"},{"t":"Linear search compares key  with each element from left to right until found or exhausted. It works on unsorted data and has worst-case O(n)  time. Binary search repeatedly checks the midpoint of a sorted search range and discards the half that cannot contain key ; worst-case time is O(log n) . In both iterative algorithms, auxiliary space is O(1) . For binary search: initialize low=0 , high=n-1 ; while low<=high , compute midpoint and update one boundary.","k":"p"},{"t":"Examiner expects: Sorted requirement, boundary update, complexity comparison.","k":"p"}]},{"p":20,"unit":2,"chapter":"Searching & Sorting","title":"Q2. Describe selection sort and sort 4, 9, 2, 6, 1, 8.","blocks":[{"t":"Q2. Describe selection sort and sort 4, 9, 2, 6, 1, 8.","k":"h"},{"t":"Selection sort repeatedly chooses the minimum from the unsorted suffix and swaps it into the first remaining position. The passes are [1,9,2,6,4,8] , [1,2,9,6,4,8] , [1,2,4,6,9,8] , [1,2,4,6,9,8] , and [1,2,4,6,8,9] . It is easy to implement and uses O(1)  extra space; however, it performs O(n²) comparisons even when nearly sorted.","k":"p"},{"t":"Examiner expects: Include every pass and distinguish comparisons from swaps.","k":"p"},{"t":"Q3. Why is insertion sort suitable for nearly sorted data?","k":"h"},{"t":"Insertion sort maintains a sorted prefix and inserts each next item into the correct position, shifting only those preceding values that are larger. When the array is already nearly sorted, few shifts are required, so its running time can approach O(n) . A highly reversed array can force many shifts, giving O(n²) . It is in-place with O(1)  extra space.","k":"p"},{"t":"Examiner expects: Explain the *reason*: few inversions / shifts.","k":"p"},{"t":"Q4. Compare quick sort and merge sort.","k":"h"},{"t":"Both use divide and conquer. Merge sort first splits into halves, recursively sorts them and merges sorted halves; it guarantees O(n log n)  time but usually needs O(n)  extra array storage. Quick sort partitions around a pivot and recursively sorts the sections; average time is O(n log n)  with typically smaller extra memory, but a poor partition sequence gives O(n²)  worst-case time. Merge sort is stable in its standard implementation; standard in-place quick sort usually is not.","k":"p"},{"t":"Examiner expects: Pivot versus merge, time in worst case, memory and stability.","k":"p"},{"t":"Q5. Select suitable methods for five situations.","k":"h"},{"t":"(a) Unsorted data: linear search, because sorting is unnecessary. (b) Repeated lookup in a large sorted array: binary search, because it eliminates half each round. (c) Nearly sorted small list: insertion sort, because few shifts are needed. (d) Divide-and-conquer sorting: merge sort or quick sort, depending on constraints. (e) Guaranteed O(n log n)  worst-case comparison sorting: merge sort.","k":"p"},{"t":"Examiner expects: Justify every choice in a phrase; naming alone is insufficient.","k":"p"},{"t":"Check your understanding","k":"h"},{"t":"Why is binary search unsafe on unsorted data? Which part of merge sort creates its extra memory need? What makes selection sort different from insertion sort? Can you reproduce a bubble-sort pass without writing code?","k":"p"}]},{"p":21,"unit":3,"chapter":"Linked Lists","title":"Linked lists","blocks":[{"t":"Linked lists","k":"h"},{"t":"A collection of connected nodes whose addresses, not array\nindexes, define the order.","k":"p"},{"t":"COURSE R23CI2602 \n·\n PRIMARY SOURCE: 23-PAGE UNIT 3 LECTURE NOTES & SLA UNIT III","k":"p"},{"t":"T H E  C E N T R A L I D E A","k":"h"},{"t":"Picture three rooms in different parts of a building. Each room contains a note that tells you the\nnumber of the next room. You can visit the rooms in order without requiring them to be next to\neach other. That is the linked-list idea. The link is the important information: without it, even if a\nnode still exists in memory, the program may no longer be able to reach it.","k":"p"},{"t":"3.1 Why linked lists exist","k":"h"},{"t":"An array holds elements contiguously and allows direct access by index. This is useful, but resizing an array or repeatedly inserting at the beginning can require copying or shifting many elements. A linked list holds separate nodes. A typical singly linked node contains two fields: data  and a pointer called next , which holds the address of the next node.","k":"p"},{"t":"Because nodes can be allocated individually at runtime, the list can grow as needed (subject to available memory). However, there is no automatic direct indexing: to find the fifth node, start from the first node and follow four links. The trade-off is straightforward: linked lists make local link changes easy but make random access more expensive and consume extra pointer memory.","k":"p"}]},{"p":22,"unit":3,"chapter":"Linked Lists","title":"Terminology: node, head, next and NULL","blocks":[{"t":"F I G U R E  —  S I N G LY L I N K E D  L I S T:  T H E  N E X T F I E L D  I S  A N  A D D R E S S","k":"p"},{"t":"head","k":"h"},{"t":"10\nnext\n20\nnext\n30\nnext","k":"p"},{"t":"NULL","k":"h"},{"t":"The program remembers HEAD; the last node stores NULL as its next pointer.","k":"p"},{"t":"Terminology: node, head, next and NULL","k":"h"},{"t":"A node is a record containing data and links. HEAD is the pointer to the first node. head == NULL  means the list is empty. A node's next  pointer is either the address of another valid node or NULL , meaning the chain ends. The data values 10, 20, 30 describe the logical sequence, but the nodes themselves might be at unrelated physical addresses.","k":"p"},{"t":"Notice an important safety condition in C: p->next  can be accessed only if p  points to a valid node. If p","k":"p"},{"t":"== NULL , evaluating p->next  is invalid. Therefore a traversal normally uses while (p != NULL)  and","k":"code"},{"t":"checks pointer validity before dereferencing it.","k":"p"},{"t":"3.2 Static versus dynamic memory allocation","k":"h"},{"t":"A fixed-size local array such as int a[20]  has storage reserved as part of its declaration (typically automatic storage for a local array). A dynamically allocated node obtains memory during execution with","k":"p"},{"t":"malloc()  from the heap; its lifetime continues until it is freed or the process ends. In C, include","k":"code"},{"t":"<stdlib.h>  for allocation functions. malloc(sizeof(Node))  asks for the number of bytes required for","k":"code"},{"t":"one node, then returns a pointer, or NULL  if allocation failed.","k":"p"},{"t":"After deleting a dynamically allocated node, use free(pointer)  to release its storage. Do not use the pointer again after freeing it. A lost node—no reachable pointer remains, but memory was never freed— causes a memory leak. These are practical consequences of the memory-allocation discussion in the Unit 3 notes.","k":"p"}]},{"p":23,"unit":3,"chapter":"Linked Lists","title":"PROGRAM 09 / C99","blocks":[{"t":"PROGRAM 09 / C99\nAllocate, link, traverse, then free","k":"h"},{"t":"#include <stdio.h>\n#include <stdlib.h>\ntypedef struct Node {\n    int data;\n    struct Node *next;\n} Node;\nint main(void) {\n    Node *a = malloc(sizeof(Node));\n    Node *b = malloc(sizeof(Node));\n    if (a == NULL || b == NULL) {\n        free(a); free(b);\n        return 1;\n    }\n    a->data = 10; a->next = b;\n    b->data = 20; b->next = NULL;\n    for (Node *p = a; p != NULL; p = p->next)\n        printf(\"%d \", p->data);\n    printf(\"\\n\");\n    free(b);\n    free(a);\n    return 0;\n}","k":"code"},{"t":"ILLUSTRATIVE OUTPUT","k":"h"},{"t":"10 20","k":"h"},{"t":"How the program works. typedef  makes the name Node  usable without repeating struct . The -> operator accesses a structure member through a pointer. Node a  points to b , and b  terminates the chain. Traversal starts at the head and follows next . Every successful malloc  must eventually be matched by a free  when the data is no longer needed.","k":"p"},{"t":"3.3 Insertion in a singly linked list","k":"h"},{"t":"Insert at beginning","k":"h"},{"t":"To add node X before the existing head, create X, put the data into X, then set X->next = head . Finally set head = X . The order matters: if we change head  first and lose the old head address, the previous list may become unreachable. This operation uses O(1) time because it does not traverse the list. It works even for an empty list: when head  is NULL , the new node simply points to NULL .","k":"p"},{"t":"Before\nChange\nAfter","k":"p"},{"t":"head → 20 → 30 → NULL\n`X->next = head` where X stores 10\nX(10) → 20 → 30","k":"p"},{"t":"head still points to 20\n`head = X`\nhead → 10 → 20 → 30 → NULL","k":"p"}]},{"p":24,"unit":3,"chapter":"Linked Lists","title":"Insert at end or after a given node","blocks":[{"t":"Insert at end or after a given node","k":"h"},{"t":"To insert at the end, allocate a new node whose next  is NULL . If the list is empty, make it the head. Otherwise traverse to the last node and connect last->next  to the new node. Without a separate tail pointer, this takes O(n)  time. If the program maintains a valid tail pointer, appending can be O(1) .","k":"p"},{"t":"To insert a node X after node P, the safe order is X->next = P->next  followed by P->next = X . This preserves the existing remainder of the list. When the address of P is already known, the link modification is O(1) ; locating P by searching can still take O(n) .","k":"p"},{"t":"F I G U R E  —  B E F O R E  A N D  A F T E R  I N S E RT I N G  A N O D E","k":"p"},{"t":"head","k":"h"},{"t":"10\nnext\n25\nnext\n30\nnext","k":"p"},{"t":"NULL","k":"h"},{"t":"Insertion updates links. The already-existing nodes need not move in memory.","k":"p"},{"t":"3.4 Deletion: reconnect first, free second","k":"h"},{"t":"Deleting the first node uses two steps: save the old head in temp ; set head = head->next ; then free(temp) . To remove a middle node, keep both the current pointer p  and its predecessor prev . First reconnect prev->next = p->next , then release p  with free(p) . To remove the last node, set the previous node's next  to NULL . When deleting the only node, the new head must be NULL .","k":"p"},{"t":"This is why a singly linked list usually needs a previous pointer during deletion by value: the list does not have backward links. If you delete a node before reconnecting the list, you might lose the address of the following node. Searching for a value takes O(n) ; removal after that location is known can be O(1) .","k":"p"}]},{"p":25,"unit":3,"chapter":"Linked Lists","title":"PROGRAM 10 / C99","blocks":[{"t":"PROGRAM 10 / C99\nSingly linked list: insert, delete and display","k":"h"},{"t":"#include <stdio.h>\n#include <stdlib.h>\ntypedef struct Node {\n    int data;\n    struct Node *next;\n} Node;\nvoid insertFront(Node **head, int x) {\n    Node *p = malloc(sizeof(Node));\n    if (p == NULL) exit(1);\n    p->data = x;\n    p->next = *head;\n    *head = p;\n}\nvoid removeValue(Node **head, int key) {\n    Node *p = *head, *prev = NULL;\n    while (p != NULL && p->data != key) {\n        prev = p;\n        p = p->next;\n    }\n    if (p == NULL) return;\n    if (prev == NULL) *head = p->next;\n    else prev->next = p->next;\n    free(p);\n}\nvoid printList(Node *p) {\n    while (p != NULL) {\n        printf(\"%d \", p->data);\n        p = p->next;\n    }\n    printf(\"\\n\");\n}\nint main(void) {\n    Node *head = NULL;\n    insertFront(&head, 30);\n    insertFront(&head, 20);\n    insertFront(&head, 10);\n    printList(head);\n    removeValue(&head, 20);\n    printList(head);\n    while (head != NULL) {\n
